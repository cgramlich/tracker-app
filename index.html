        onCancel={()=>setConfirmClear(false)}/>}
    </div>
  );
}

/* ============================================================
   VIEW: SEARCH (across all four entities)
   ============================================================ */
function SearchView({ store, openEditor, back }){
  const [q,setQ]=useState("");
  const term = q.trim().toLowerCase();
  const has = (...vals) => vals.filter(Boolean).some(v=>String(v).toLowerCase().includes(term));
  let todos=[], ideas=[], projects=[], goals=[];
  if(term){
    todos    = store.data.todos.filter(t=>has(t.title, t.notes, (t.tags||[]).join(" "), t.location, t.waitingOn));
    projects = store.data.projects.filter(p=>has(p.name, p.outcome, p.description));
    ideas    = store.data.ideas.filter(i=>has(i.title, i.body, (i.tags||[]).join(" ")));
    goals    = store.data.goals.filter(g=>has(g.name, g.why));
  }
  const total = todos.length+projects.length+ideas.length+goals.length;
  const Section = ({title, rows, kind, label, sub}) => rows.length ? (
    <div style={{marginTop:18}}>
      <div className="eyebrow">{title} ({rows.length})</div>
      <div className="list">{rows.map(r=>
        <div key={r.id} className="item" onClick={()=>openEditor(kind, r)}>
          <div className="item-body"><div className="item-title">{label(r)}</div>
            <div className="item-meta"><TypeChip type={r.type}/>{sub(r)}</div></div>
        </div>)}</div>
    </div>
  ) : null;
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <button className="btn btn-ghost btn-sm" onClick={back}>{Ic.back} Back</button>
        <h1 className="title" style={{marginTop:8}}>Search</h1>
      </div>
      <input className="input" style={{marginTop:14}} value={q} onChange={e=>setQ(e.target.value)}
        placeholder="Search todos, ideas, projects, goals..." autoFocus/>
      {term && total===0 && <Empty glyph={"\u2014"} title="No matches" sub="Try a different word."/>}
      {todos.length>0 &&
        <div style={{marginTop:18}}>
          <div className="eyebrow">Todos ({todos.length})</div>
          <div className="list">{todos.map(t=><TodoRow key={t.id} store={store} todo={t} onOpen={()=>openEditor("todo", t)}/>)}</div>
        </div>}
      <Section title="Projects" rows={projects} kind="project" label={r=>r.name}  sub={r=><span className="chip">{r.status}</span>}/>
      <Section title="Ideas"    rows={ideas}    kind="idea"    label={r=>r.title} sub={r=><span className="chip">{r.state}</span>}/>
      <Section title="Goals"    rows={goals}    kind="goal"    label={r=>r.name}  sub={r=><span className="chip">{r.status}</span>}/>
    </div>
  );
}

/* ============================================================
   VIEW: DASHBOARD - a roll-up of "what needs my attention". Reads existing data (no new
   item type) and respects the active Space (store.data is already space-scoped): focus a
   Space -> its dashboard; All -> a cross-Space roll-up (with a Space dot on each row).
   ============================================================ */
/* ============================================================
   VIEW: CALENDAR (read-only .ics agenda). Events come from the backend, which
   fetches + parses the feeds server-side. Space-aware: the active Space filters
   which feeds are queried; "All" shows everything with a per-feed color dot.
   READ-ONLY by design - no create/edit/delete affordances anywhere.
   ============================================================ */
function CalendarView({ store }){
  const [mode,setMode]=useState("week");     // today | week | month
  const [data,setData]=useState(null);
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const [detail,setDetail]=useState(null);
  // Month grid: which month is shown (1st of it, local midnight) and which day is expanded.
  const [monthAnchor,setMonthAnchor]=useState(()=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(1); return d; });
  const [selDay,setSelDay]=useState(TODAY());
  const active = store.activeSpace || "all";
  const spaceName = active==="all" ? "All spaces" : (((store.spaces||[]).find(s=>s.id===active)||{}).name || "Space");

  const load = useCallback(async (refresh)=>{
    setBusy(true); setErr("");
    try{
      let s, e;
      if(mode==="month"){
        // Fetch the whole visible grid: the Sunday on/before the 1st through 6 weeks (42 days).
        const first = new Date(monthAnchor); first.setHours(0,0,0,0);
        s = new Date(first); s.setDate(1 - first.getDay());
        e = new Date(s); e.setDate(e.getDate() + 42);
      } else {
        s = new Date(); s.setHours(0,0,0,0);
        e = new Date(s); e.setDate(e.getDate() + (mode==="today" ? 1 : 7));
      }
      // Local midnight -> ISO instant, so the server's window matches the user's day.
      setData(await calEventsGet({ start:s.toISOString(), end:e.toISOString(), space:active, refresh }));
    }catch(ex){ setErr(ex.message||"Couldn't load your calendar."); setData(null); }
    finally{ setBusy(false); }
  },[mode, active, monthAnchor]);
  useEffect(()=>{ load(false); },[load]);

  const feeds = (data && data.feeds) || [];
  const feedName = (id)=>{ const f = feeds.find(x=>x.id===id); return f ? f.name : ""; };
  const problems = feeds.filter(f=>f.status==="error" || f.status==="parse_error" || f.status==="stale");

  // Dedupe + time formatting come from the shared module-level helpers, so this view
  // and the Dashboard card can never drift apart.
  const fmtWhen = fmtEventTime;

  // Group into LOCAL days (all-day events are already date-only - slice the string
  // rather than parsing, which would shift them a day behind UTC).
  // One merged/deduped/conflict-marked list, keyed by local day. The day-list (today/
  // week) and the month grid both read this, so they can never disagree about a day.
  const byDay = {};
  if(data && data.events){
    markConflicts(mergeCalendarEvents(data.events)).forEach(ev=>{
      const k = ev.all_day ? String(ev.start||"").slice(0,10) : todayKey(new Date(ev.start));
      (byDay[k] = byDay[k] || []).push(ev);
    });
  }
  const groups = Object.keys(byDay).sort().map(k=>({ key:k, events:byDay[k] }));
  function dayLabel(k){
    if(k===TODAY()) return "Today";
    const d = new Date(k+"T00:00:00");
    if(isNaN(d)) return k;
    return d.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
  }

  // ---- Ask about your calendar (read-only Q&A) ----
  const [q,setQ]=useState("");
  const [qBusy,setQBusy]=useState(false);
  const [qErr,setQErr]=useState("");
  const [msgs,setMsgs]=useState([]);   // {role:'user'|'assistant'|'sys', text} - 'sys' is UI-only
  const [qOpen,setQOpen]=useState(true);   // collapse the thread without losing it
  const [qInfo,setQInfo]=useState(false);  // the how-to text, tucked behind an (i)

  // Compact, token-cheap event lines. Weekday is included so the model can reason
  // about weekends without having to derive it.
  function compactEvents(list, nameOf){
    return (list||[]).slice(0,300).map(ev=>{
      const day = ev.all_day ? String(ev.start||"").slice(0,10) : todayKey(new Date(ev.start));
      const wd  = new Date(day+"T00:00:00").toLocaleDateString(undefined,{weekday:"short"});
      const t2  = (d)=> new Date(d).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", hour12:false});
      const when = ev.all_day ? "all-day" : (t2(ev.start) + (ev.end ? "-"+t2(ev.end) : ""));
      const cals = (ev.feedIds||[ev.feed_id]).map(nameOf).filter(Boolean).join("/");
      return day+" ("+wd+") "+when+" "+(ev.title||"")+(cals?(" ["+cals+"]"):"")+(ev.location?(" @"+ev.location):"");
    }).join("\n");
  }

  async function ask(){
    const question = q.trim();
    if(!question || qBusy) return;
    const history = msgs;                 // turns BEFORE this question drive the follow-up
    setQ(""); setQErr(""); setQOpen(true);   // asking always reveals the thread again
    setMsgs(m=>[...m, { role:"user", text:question }]);
    setQBusy(true);
    try{
      let win = await calInferWindow(question, history);
      let res = await calEventsGet({ start:win.start, end:win.end, space:active });
      let evs = mergeCalendarEvents((res && res.events) || []);
      // Open-ended lookups ("my next X") often sit past the inferred window. Widening
      // once costs nothing extra in AI - it's just another fetch.
      if(evs.length === 0){
        const f = new Date(); f.setMonth(f.getMonth()+12);
        win = { start: TODAY(), end: todayKey(f) };
        res = await calEventsGet({ start:win.start, end:win.end, space:active });
        evs = mergeCalendarEvents((res && res.events) || []);
      }
      const nameOf = (id)=>{ const f=((res && res.feeds)||[]).find(x=>x.id===id); return f ? f.name : ""; };
      const scope = active==="all" ? "all spaces" : spaceName;
      const text = await calAnswer(question, win, scope, compactEvents(evs, nameOf), evs.length, history);
      setMsgs(m=>[...m,
        { role:"assistant", text: text || "(no answer)" },
        { role:"sys", text: "Searched "+fmtDate(win.start)+" - "+fmtDate(win.end)+" ("+scope+", "+evs.length+" event"+(evs.length===1?"":"s")+")" }
      ]);
    }catch(e){ setQErr(e.message||"Couldn't answer that."); }
    finally{ setQBusy(false); }
  }

  // One event row, shared by the day list (today/week) and the month grid's selected day.
  function renderEventItem(ev, key){
    return (
      <div key={key} className="item" style={{cursor:"pointer"}} onClick={()=>setDetail(ev)}>
        <div className="item-body">
          <div className="item-title"><CalDots colors={ev.colors||[ev.color]}/>{ev.title||"(no title)"}</div>
          <div className="item-meta">
            <span className="chip">{fmtWhen(ev)}</span>
            {ev.location && <span className="chip">{ev.location}</span>}
            {(()=>{ const names=(ev.feedIds||[ev.feed_id]).map(feedName).filter(Boolean);
              return names.length ? <span className="chip">{names.join(" + ")}</span> : null; })()}
          </div>
        </div>
        {ev.conflict && <span className="chip red" style={{flex:"0 0 auto"}} title="Overlaps another event">Conflict</span>}
      </div>
    );
  }
  // 42 cells (6 weeks) from the Sunday on/before the 1st of the shown month.
  function monthCells(){
    const first = new Date(monthAnchor); first.setHours(0,0,0,0);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const cells = [];
    for(let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const key = todayKey(d);
      const evs = byDay[key] || [];
      const colors = [];
      evs.forEach(ev => (ev.colors||[ev.color]).forEach(c => { if(c && colors.indexOf(c)<0 && colors.length<3) colors.push(c); }));
      cells.push({ key, day:d.getDate(), inMonth:d.getMonth()===monthAnchor.getMonth(), isToday:key===TODAY(), count:evs.length, colors });
    }
    return cells;
  }
  function shiftMonth(n){
    const d = new Date(monthAnchor); d.setDate(1); d.setMonth(d.getMonth()+n); d.setHours(0,0,0,0);
    setMonthAnchor(d);
    const t = new Date();
    const isCur = d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth();
    setSelDay(isCur ? TODAY() : todayKey(d));   // land on today in the current month, else its 1st
  }

  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <div className="eyebrow">Schedule</div>
        <div className="topbar-row"><h1 className="title">Calendar</h1>
          <button className="btn btn-ghost btn-sm" disabled={busy} onClick={()=>load(true)}>{busy? <span className="spin"></span> : "Refresh"}</button></div>
        <div className="subtle" style={{marginTop:2}}>{spaceName} &middot; read-only</div>
      </div>

      <div className="sortrow" style={{marginTop:12}}>
        <div className="seg">
          <button className={"seg-b"+(mode==="today"?" on":"")} onClick={()=>setMode("today")}>Today</button>
          <button className={"seg-b"+(mode==="week"?" on":"")} onClick={()=>setMode("week")}>Week</button>
          <button className={"seg-b"+(mode==="month"?" on":"")} onClick={()=>setMode("month")}>Month</button>
        </div>
        <span className="sortlbl">{feeds.length? (feeds.length+" calendar"+(feeds.length===1?"":"s")) : ""}</span>
      </div>

      <div className="card" style={{marginTop:14,borderColor:"var(--amber-line)"}}>
        <div className="topbar-row" style={{alignItems:"center"}}>
          <div className="label" style={{display:"flex",alignItems:"center",gap:6}}>{Ic.sparkle} Ask about your calendar</div>
          <div style={{display:"flex",gap:6,alignItems:"center",flex:"0 0 auto"}}>
            <button className="icon-btn-sm" aria-label="How this works" title="How this works"
              onClick={()=>setQInfo(v=>!v)}>{Ic.info}</button>
            {msgs.length>0 && <button className="btn btn-ghost btn-sm" onClick={()=>setQOpen(v=>!v)}>{qOpen?"Hide":"Show"}</button>}
            {msgs.length>0 && <button className="btn btn-ghost btn-sm" onClick={()=>{ setMsgs([]); setQErr(""); setQOpen(true); }}>Clear</button>}
          </div>
        </div>
        {qInfo &&
          <p className="hint" style={{marginTop:8}}>Ask anything - "any 5-day gap in October including a weekend?", "what do I have Thursday?", "when is my next dentist appointment?". It's a conversation, so you can correct it: "look for Dr Robinson, that's my dentist". Answers come only from your real events, and each reply shows the window it searched.</p>}
        {msgs.length>0 && qOpen &&
          <div className="chat-scroll" style={{marginTop:8}}>
            {msgs.map((m,i)=><div key={i} className={"bubble "+(m.role==="user"?"user":m.role==="assistant"?"ai":"sys")}>{m.text}</div>)}
            {qBusy && <div className="bubble ai" style={{color:"var(--ink-3)"}}>Checking your calendar...</div>}
          </div>}
        {msgs.length>0 && !qOpen &&
          <p className="hint" style={{marginTop:8}}>{Math.ceil(msgs.filter(m=>m.role!=="sys").length/2)} exchange{Math.ceil(msgs.filter(m=>m.role!=="sys").length/2)===1?"":"s"} hidden - tap Show.</p>}
        <div className="row" style={{marginTop:8,alignItems:"center"}}>
          <input className="input" style={{flex:1}} value={q} onChange={e=>setQ(e.target.value)}
            placeholder={msgs.length? "Ask a follow-up..." : "e.g. when is my next dentist appointment?"}
            onKeyDown={e=>{ if(e.key==="Enter") ask(); }}/>
          <button className="btn btn-primary btn-sm" style={{flex:"0 0 auto"}} disabled={qBusy||!q.trim()} onClick={ask}>
            {qBusy? <span className="spin"></span> : "Ask"}</button>
        </div>
        {qErr && <p className="hint danger-text" style={{marginTop:8}}>{qErr}</p>}
      </div>

      {err && <p className="hint danger-text" style={{marginTop:10}}>{err}</p>}
      {/* Show WHY, per feed. The old copy said "showing the last copy we have" for every
          problem - but status==="error" means there is NO copy and that calendar is simply
          missing from the view, which is exactly the silent failure that reads as
          "my feed doesn't work" with nothing to act on. */}
      {problems.length>0 &&
        <div className="card" style={{marginTop:10,borderColor:"var(--red-line, var(--line-2))"}}>
          {problems.map(f=>(
            <div key={f.id} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"4px 0"}}>
              <span className="dot" style={{background:f.status==="stale"?"var(--amber)":"var(--red)",
                width:8,height:8,borderRadius:"50%",flex:"0 0 auto",marginTop:6}}></span>
              <span style={{flex:1}}>
                <b style={{fontSize:14}}>{f.name}</b>
                <span className="hint" style={{display:"block"}}>
                  {f.status==="stale"
                    ? "Couldn't refresh - showing the last copy we have."
                    : f.status==="parse_error"
                      ? "Loaded, but the calendar data couldn't be read."
                      : "Not loading - this calendar is missing from the view."}
                  {f.error ? " ("+f.error+")" : ""}
                </span>
              </span>
            </div>
          ))}
          <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:6}}
            onClick={()=>load(true)}>Try again</button>
        </div>}
      {!err && data===null && busy && <p className="hint" style={{marginTop:12}}>Loading your schedule...</p>}
      {!err && mode!=="month" && data && groups.length===0 &&
        <Empty glyph={"—"} title="Nothing scheduled" sub={feeds.length? "No events in this window." : "Add a calendar in Settings > Calendars."}/>}

      {mode!=="month" && groups.map(g=>(
        <div key={g.key} style={{marginTop:16}}>
          <div className="eyebrow" style={{marginBottom:8}}>{dayLabel(g.key)}</div>
          <div className="list">{g.events.map((ev,i)=>renderEventItem(ev, g.key+"-"+i))}</div>
        </div>))}

      {mode==="month" && !err && (
        <div style={{marginTop:14}}>
          <div className="cal-monthhead">
            <button className="icon-btn" aria-label="Previous month" onClick={()=>shiftMonth(-1)}>{Ic.back}</button>
            <div className="cal-monthname">{monthAnchor.toLocaleDateString(undefined,{month:"long", year:"numeric"})}</div>
            <button className="icon-btn" aria-label="Next month" onClick={()=>shiftMonth(1)} style={{transform:"scaleX(-1)"}}>{Ic.back}</button>
          </div>
          <div className="cal-dow">{["S","M","T","W","T","F","S"].map((d,i)=><span key={i}>{d}</span>)}</div>
          <div className="cal-grid">
            {monthCells().map(c=>(
              <button key={c.key} className={"cal-cell"+(c.inMonth?"":" out")+(c.isToday?" today":"")+(c.key===selDay?" sel":"")}
                onClick={()=>setSelDay(c.key)}>
                <span className="cal-num">{c.day}</span>
                <span className="cal-dots">{c.colors.map((col,i)=><span key={i} className="cal-d" style={{background:col}}></span>)}</span>
              </button>
            ))}
          </div>
          <div style={{marginTop:16}}>
            <div className="eyebrow" style={{marginBottom:8}}>{dayLabel(selDay)}</div>
            {(byDay[selDay]||[]).length===0
              ? <p className="hint">{busy? "Loading..." : "Nothing scheduled."}</p>
              : <div className="list">{byDay[selDay].map((ev,i)=>renderEventItem(ev, "sel-"+i))}</div>}
          </div>
        </div>)}

      {data && data.truncated && <p className="hint" style={{marginTop:12}}>Showing the first {(data.events||[]).length} events for this window.</p>}

      {detail &&
        <Sheet title="Event" onClose={()=>setDetail(null)}>
          <h3 style={{fontFamily:"Fraunces",fontSize:19,marginBottom:6}}>{detail.title||"(no title)"}</h3>
          <p className="hint" style={{marginTop:0}}>
            {dayLabel(detail.all_day ? String(detail.start||"").slice(0,10) : todayKey(new Date(detail.start)))} &middot; {fmtWhen(detail)}
          </p>
          {detail.location && <div className="field"><span className="label">Location</span><div>{detail.location}</div></div>}
          <div className="field"><span className="label">{(detail.feedIds||[]).length>1?"Calendars":"Calendar"}</span>
            <div>{((detail.feedIds||[detail.feed_id]).map(feedName).filter(Boolean).join(", "))||"-"}</div></div>
          {(detail.feedIds||[]).length>1 && <p className="hint" style={{marginTop:0}}>This event appears on more than one of your calendars.</p>}
          {detail.tz && <div className="field"><span className="label">Time zone</span><div>{detail.tz}</div></div>}
          <p className="hint" style={{marginTop:10}}>Read-only. Edit this event in the calendar it came from.</p>
        </Sheet>}

      <div style={{height:20}}></div>
    </div>
  );
}

function DashboardView({ store, onOpen, openEditor, go }){
  const active = store.activeSpace;
  const isAll = !active || active==="all";
  const spaceName = isAll ? "All spaces" : (((store.spaces||[]).find(s=>s.id===active)||{}).name || "Space");
  const { todos, projects, goals, ideas } = store.data;

  const openTodos = todos.filter(t=>t.status!=="done" && !isDeferredAway(t));
  const todayOverdue = openTodos.filter(t=>t.due && (isToday(t.due)||isOverdue(t.due)))
    .sort((a,b)=> a.due<b.due?-1:a.due>b.due?1:0);
  const todaySet = new Set(todayOverdue.map(t=>t.id));
  const priorities = openTodos.filter(t=>(t.starredToday || t.quad==="q1") && !todaySet.has(t.id)).sort(sortTodos);
  const activeProjects = projects.filter(p=>p.status==="active").sort(byOrder);
  const activeGoals = goals.filter(g=>g.status==="active").sort(byOrder);
  const recent = [
    ...todos.map(x=>({x,kind:"todo",name:x.title})),
    ...projects.map(x=>({x,kind:"project",name:x.name})),
    ...ideas.map(x=>({x,kind:"idea",name:x.title})),
    ...goals.map(x=>({x,kind:"goal",name:x.name})),
  ].filter(r=>r.x.updatedAt).sort((a,b)=> a.x.updatedAt<b.x.updatedAt?1:-1).slice(0,6);

  const openCount = (pid)=> todos.filter(t=>t.projectId===pid && t.status!=="done").length;
  const Dot = ({id})=>{ if(!isAll) return null; const s=(store.spaces||[]).find(x=>x.id===id); return s? <span className="space-dot" style={{background:s.color,marginRight:6,display:"inline-block",verticalAlign:"middle"}} title={s.name}></span>:null; };
  const More = ({n})=> n>0 ? <p className="hint" style={{marginTop:6}}>+{n} more</p> : null;
  const Section = ({title, n, children, empty})=> (
    <div style={{marginTop:18}}>
      <div className="eyebrow" style={{marginBottom:8}}>{title}{n>0?" ("+n+")":""}</div>
      {children || <p className="hint">{empty}</p>}
    </div>
  );
  const Row = ({onClick, spaceId, title, chips})=> (
    <div className="item" style={{cursor:"pointer"}} onClick={onClick}>
      <div className="item-body"><div className="item-title"><Dot id={spaceId}/>{title||"(untitled)"}</div>
        <div className="item-meta">{chips}</div></div>
    </div>
  );

  // Today's schedule (read-only calendar overlay). Fetched separately from the task data
  // and deliberately NON-BLOCKING: if the calendar API fails, the card says so and the
  // rest of the dashboard still renders.
  const [sched,setSched]=useState(null);      // null = still loading
  const [schedErr,setSchedErr]=useState("");
  useEffect(()=>{
    let alive = true;
    (async ()=>{
      setSchedErr("");
      try{
        const s=new Date(); s.setHours(0,0,0,0);
        const e=new Date(s); e.setDate(e.getDate()+1);
        const j = await calEventsGet({ start:s.toISOString(), end:e.toISOString(), space:active });
        if(alive) setSched(j);
      }catch(ex){ if(alive){ setSchedErr(ex.message||"Couldn't load your schedule."); setSched({ events:[], feeds:[] }); } }
    })();
    return ()=>{ alive=false; };
  },[active]);
  const schedFeeds  = (sched && sched.feeds) || [];
  const schedEvents = markConflicts(mergeCalendarEvents((sched && sched.events) || []));
  const schedName   = (id)=>{ const f=schedFeeds.find(x=>x.id===id); return f ? f.name : ""; };

  // AI brief (optional, button-triggered so it never auto-spends). Summarizes the CURRENT
  // (space-scoped) snapshot. Grounded: the prompt says use only the provided items.
  const [brief,setBrief]=useState("");
  const [briefBusy,setBriefBusy]=useState(false);
  const [briefErr,setBriefErr]=useState("");
  const hasData = todayOverdue.length||priorities.length||activeProjects.length||activeGoals.length;
  function buildBriefInput(){
    const line=(t)=>{ let s='"'+(t.title||"")+'"'; const bits=[];
      if(t.due) bits.push(isOverdue(t.due)?("overdue, was due "+t.due):isToday(t.due)?"due today":("due "+t.due));
      if(t.quad==="q1") bits.push("Do First"); if(t.starredToday) bits.push("flagged");
      if(bits.length) s+=" ("+bits.join(", ")+")"; return s; };
    const L=["Space: "+spaceName];
    // Today's meetings go in too, so the brief can weigh tasks against actual booked time.
    if(schedEvents.length) L.push("Today's schedule ("+schedEvents.length+"): "+schedEvents.slice(0,12).map(ev=>'"'+(ev.title||"")+'" '+fmtEventTime(ev)).join("; "));
    if(todayOverdue.length) L.push("Due/overdue ("+todayOverdue.length+"): "+todayOverdue.slice(0,12).map(line).join("; "));
    if(priorities.length)   L.push("Priorities ("+priorities.length+"): "+priorities.slice(0,10).map(line).join("; "));
    if(activeProjects.length) L.push("Active projects ("+activeProjects.length+"): "+activeProjects.slice(0,10).map(p=>'"'+p.name+'" - '+openCount(p.id)+" open"+(p.deadline?(", deadline "+p.deadline):"")).join("; "));
    if(activeGoals.length)  L.push("Goals ("+activeGoals.length+"): "+activeGoals.slice(0,8).map(g=>'"'+g.name+'"').join("; "));
    return L.join("\n");
  }
  async function runBrief(){
    if(briefBusy) return;
    setBriefBusy(true); setBriefErr("");
    try{
      const sys = "You are the user's focused assistant. Given a snapshot of their current tasks, projects and goals"+(isAll?"":(" for their \""+spaceName+"\" area"))+", write a SHORT brief (3-5 sentences, plain text, no headers or markdown) on what needs their attention right now. Lead with anything overdue or due today. Be specific and name actual items. Use ONLY the provided data - never invent tasks. If there's little to do, say so briefly.";
      setBrief(await claudeBrief(sys, buildBriefInput()) || "(no summary returned)");
    }catch(e){ setBriefErr(e.message||"Couldn't generate a brief."); }
    finally{ setBriefBusy(false); }
  }

  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <div className="eyebrow">Overview</div>
        <div className="topbar-row"><h1 className="title">Dashboard</h1></div>
        <div className="subtle" style={{marginTop:2}}>{spaceName}{" · "}{todayOverdue.length} due/overdue{" · "}{activeProjects.length} active project{activeProjects.length===1?"":"s"}{schedEvents.length? (" · "+schedEvents.length+" today") : ""}</div>
      </div>

      <HeadsUpCard store={store} style={{marginTop:16}}/>
      <OrdersNeedsLookLine store={store} go={go}/>
      <NewWinLine store={store} go={go}/>
      <ComingUpCard store={store}/>
      <RadarCard store={store} onOpen={onOpen}/>

      <div className="card" style={{marginTop:16,borderColor:"var(--amber-line)"}}>
        <div className="topbar-row" style={{alignItems:"center"}}>
          <div className="label" style={{display:"flex",alignItems:"center",gap:6}}>{Ic.sparkle} AI brief</div>
          {hasData && <button className="btn btn-ghost btn-sm" disabled={briefBusy} onClick={runBrief}>{briefBusy? <span className="spin"></span> : (brief?"Refresh":"Summarize")}</button>}
        </div>
        {briefErr && <p className="hint danger-text" style={{marginTop:8}}>{briefErr}</p>}
        {!briefErr && brief && <p style={{marginTop:8,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{brief}</p>}
        {!briefErr && !brief && !briefBusy &&
          <p className="hint" style={{marginTop:8}}>{hasData ? ("Tap Summarize for a quick read on what needs your attention"+(isAll?" across all Spaces.":" in "+spaceName+".")) : "Nothing to brief right now."}</p>}
      </div>

      {/* Today's schedule sits directly above today's tasks - meetings and tasks in one

address. Outlook has one too, under publish or share.

Switch between **Today**, **Week**, and **Month** at the top. Month is a full grid:

- "Is there a five day window in October I could take off, including a weekend?"
- "When is my next dentist appointment?"

It answers from your real events. It also follows a conversation, so if it comes back
with nothing you can say "look for Dr Robinson, that is my dentist" and it will try
again with that.

small **i** explains it in place.

---

For a list you rebuild often. Packing for a trip, a weekly routine, anything you redo.

Save any project's open items as a template, then spin up a fresh copy in one tap
whenever you need it again. Manage them in Settings.

---

---

Under the gear in the top right, or from More:

- **Appearance**: name the app whatever you like, pick an accent color and a theme.

---

function renderHelpInline(text, kp){
  const nodes=[]; const re=/\*\*([^*]+)\*\*|\*([^*]+)\*/g;
  let last=0, m, k=0;
  while((m=re.exec(text))){
    if(m.index>last) nodes.push(text.slice(last,m.index));
    if(m[1]!=null) nodes.push(<strong key={kp+"b"+(k++)}>{m[1]}</strong>);
    else nodes.push(<em key={kp+"i"+(k++)}>{m[2]}</em>);
    last=re.lastIndex;
  }
  if(last<text.length) nodes.push(text.slice(last));
  return nodes;
}
function renderHelpMarkdown(doc){
  const lines=(doc||"").split("\n");
  const out=[]; let key=0; let para=[]; let bullets=null;
  const flushPara=()=>{ if(para.length){ out.push(<p key={"p"+(key++)} className="help-p">{renderHelpInline(para.join(" "),"p"+key)}</p>); para=[]; } };
  const flushBullets=()=>{ if(bullets){ const b=bullets; out.push(<ul key={"u"+(key++)} className="help-ul">{b.map((t,bi)=><li key={bi}>{renderHelpInline(t,"u"+key+"_"+bi)}</li>)}</ul>); bullets=null; } };
  for(const raw of lines){
    const line=raw.replace(/\s+$/,"");
    if(/^-{3,}$/.test(line.trim())){ flushPara(); flushBullets(); out.push(<hr key={"h"+(key++)} className="help-hr" />); continue; }
    if(/^#\s+/.test(line)){ flushPara(); flushBullets(); out.push(<h1 key={"t"+(key++)} className="help-h1">{line.replace(/^#\s+/,"")}</h1>); continue; }
    if(/^##\s+/.test(line)){ flushPara(); flushBullets(); out.push(<h2 key={"s"+(key++)} className="help-h2">{line.replace(/^##\s+/,"")}</h2>); continue; }
    if(/^###\s+/.test(line)){ flushPara(); flushBullets(); out.push(<h3 key={"x"+(key++)} className="help-h3">{line.replace(/^###\s+/,"")}</h3>); continue; }
    if(/^-\s+/.test(line)){ flushPara(); (bullets=bullets||[]).push(line.replace(/^-\s+/,"")); continue; }
    if(/^\s+\S/.test(raw) && bullets && bullets.length){ bullets[bullets.length-1]+=" "+line.trim(); continue; }
    if(line.trim()===""){ flushPara(); flushBullets(); continue; }
    flushBullets(); para.push(line.trim());
  }
  flushPara(); flushBullets();
  return out;
}

const RUNDOWN_STATUSES = [
  { k:"live",    label:"Live",    cls:"rs-live" },
  { k:"waiting", label:"Waiting", cls:"rs-waiting" },
  { k:"onice",   label:"On ice",  cls:"rs-onice" },
  { k:"won",     label:"Won",     cls:"rs-won" },
  { k:"done",    label:"Done",    cls:"rs-done" },

// or the paste importer (Stage 2) creates them from a pasted note.
function seedRundown(){ return { workstreams: [], items: [] }; }

// Parse a pasted note into { workstreams:[name], items:[{workstreamName,name,status,
// nextStep,blocker,note,initiative,pinned}] }.
// Format (forgiving): a "# Header" line starts a workstream; every other non-empty line is
// an item in the current workstream. Status comes from an optional [tag] anywhere in the
// line ([live] [waiting] [on ice] [won] [dropped]) or from ~strikethrough~ (=> dropped);
// [initiative] lifts it to the Initiatives tier and [pin] pins it as a north star.
// An indented "next:", "blocked:", "note:" or "decide:" line attaches that field to the item
// above it. Leading bullets are stripped. Lines before any header go into "General".
const _RD_STAT = { live:"live", waiting:"waiting", "on ice":"onice", onice:"onice", won:"won", done:"done", dropped:"dropped" };

/* "decide: question | label = value ; label = value"  ->  a decision object.
   Separator choices, both deliberate:
   - ";" between options, NOT "/". Real values contain slashes ("0.50/0.325"),
     so "/" would split a single option into two nonsense ones.
   - the LAST "=" in an option splits label from value, so a label may contain
     one. Everything is optional: a bare question with no "|" is a valid open
     decision, and options with no "=" simply carry no value.
   Nothing here can mark an option as chosen. An import is a capture of what is
   still open; choosing is a deliberate tap in the editor. */
function parseDecisionLine(v){
  const s = String(v||"").trim();
  if(!s) return null;
  const bar = s.indexOf("|");
  const question = (bar>=0 ? s.slice(0,bar) : s).trim();
  const rest = bar>=0 ? s.slice(bar+1) : "";
  const candidates = rest.split(";").map(p=>p.trim()).filter(Boolean).map(p=>{
    const eq = p.lastIndexOf("=");
    const label = (eq>=0 ? p.slice(0,eq) : p).trim();
    const value = eq>=0 ? p.slice(eq+1).trim() : "";
    return label ? { id:uid(), label, value } : null;
  }).filter(Boolean);
  if(!question && !candidates.length) return null;
  return { question, candidates, chosenId:"", decidedAt:"", why:"" };
}
function parseRundownPaste(text){
  const lines = String(text||"").split(/\r?\n/);
  const workstreams = [];   // ordered unique names
  const items = [];
  let cur = null;           // current area (workstream)
  let last = null;          // last item added, for next:/blocked:/note: continuation lines
  for(const raw of lines){
    const line = raw.replace(/\s+$/,"");
    if(!line.trim()) continue;
    const h = line.match(/^\s*#+\s+(.*)$/);
    if(h){ const n=h[1].trim(); if(n){ cur=n; last=null; if(!workstreams.some(w=>w.toLowerCase()===n.toLowerCase())) workstreams.push(n); } continue; }
    // A "next:/blocked:/note:" line attaches to the item above it (kept out of the item list).
    const cont = line.match(/^\s*(next|blocked|blocker|note|decide|decision)\s*:\s*(.*)$/i);
    if(cont && last){
      const k=cont[1].toLowerCase(); const v=cont[2].trim();
      if(k==="next") last.nextStep=v;
      else if(k==="blocked"||k==="blocker") last.blocker=v;
      else if(k==="note") last.note=v;
      else if(k==="decide"||k==="decision") last.decision=parseDecisionLine(v);
      continue;
    }
    let name = line.replace(/^\s*[-*•◦·]\s+/, "").trim();
    if(!name) continue;
    let status="", initiative=false, pinned=false, pursuit=false;
    // Pull every [tag] out FIRST so a trailing tag can't break the ~strike~ end-anchor.
    // Recognized: status tags, plus [initiative]/[init], [pin]/[pinned]/[north star], [pursuit].
    name = name.replace(/\[([a-z ]+)\]/ig, (m,g)=>{
      const k=g.trim().toLowerCase();
      if(_RD_STAT[k]){ status=_RD_STAT[k]; return " "; }
      if(k==="initiative"||k==="init"){ initiative=true; return " "; }
      if(k==="pin"||k==="pinned"||k==="north star"){ initiative=true; pinned=true; return " "; }
      if(k==="pursuit"){ pursuit=true; return " "; }
      return m;   // unknown tag: leave it in the name
    }).replace(/\s{2,}/g," ").trim();
    if(/^~.+~$/.test(name)){ if(!status) status="dropped"; name=name.replace(/^~+|~+$/g,"").trim(); }
    if(!cur){ cur="General"; if(!workstreams.some(w=>w.toLowerCase()==="general")) workstreams.push("General"); }
    if(name){ last={ workstreamName:cur, name, status, nextStep:"", blocker:"", note:"", decision:null, initiative, pinned:initiative&&pinned, pursuit }; items.push(last); }
  }
  return { workstreams, items };
}

function RundownImportSheet({ onImport, onClose }){
  const [text,setText]=useState("");
  const fileRef = useRef(null);
  const parsed = text.trim() ? parseRundownPaste(text) : { workstreams:[], items:[] };
  function onFile(e){
    const f = e.target.files && e.target.files[0];
    e.target.value = "";              // allow re-picking the same file
    if(!f) return;
    const r = new FileReader();
    r.onload = () => setText(String(r.result||""));
    r.readAsText(f);
  }
  return (
    <Sheet title="Import a note" onClose={onClose}>
      <p className="hint" style={{marginBottom:10}}>Choose a text file, or paste below. Lines starting with <b>#</b> become
        areas; every other line becomes an item. Add <b>[won]</b>, <b>[waiting]</b>, <b>[on ice]</b>,
        <b>[live]</b> or <b>[dropped]</b> to set a status, and <b>[initiative]</b> / <b>[pin]</b> for a
        north star. An indented <b>next:</b>, <b>blocked:</b> or <b>note:</b> line adds that to the item above.
        A <b>decide:</b> line adds an open decision: the question, then <b>|</b>, then the options
        separated by <b>;</b> (an <b>=</b> gives an option a value).</p>
      <p className="hint" style={{marginBottom:10,opacity:.75}}>
        decide: how bold is the ask? | pilot on one workflow ; AI-assist with review ; full autonomy</p>
      <input ref={fileRef} type="file" accept=".txt,.md,text/plain,text/markdown" style={{display:"none"}} onChange={onFile}/>
      <button className="btn btn-ghost btn-block" style={{marginBottom:10}} onClick={()=>fileRef.current&&fileRef.current.click()}>
        {Ic.lists} Choose a file</button>
      <textarea className="input" rows={9} value={text} onChange={e=>setText(e.target.value)}
        placeholder={"# Opportunities\nTapp Engine [waiting]\nBureaus [on ice]\n..."} style={{fontFamily:"inherit"}}/>
      {text.trim() && (()=>{ const dec = parsed.items.filter(i=>i.decision).length;
        // Call out decisions explicitly: a mistyped "|" silently yields a question
        // with no options, and without this you would not find out until later.
        return <p className="hint" style={{marginTop:8}}>Found {parsed.workstreams.length} area{parsed.workstreams.length===1?"":"s"} and {parsed.items.length} item{parsed.items.length===1?"":"s"}
          {dec>0 ? ", "+dec+" with a decision" : ""}.</p>; })()}
      <button className="btn btn-primary btn-block" style={{marginTop:12}} disabled={!parsed.items.length}
        onClick={()=>onImport(parsed)}>Import {parsed.items.length||""} item{parsed.items.length===1?"":"s"}</button>
      <p className="hint" style={{marginTop:8,opacity:.7}}>Adds to your board (existing items are kept). Areas with a name you already have are reused.</p>
    </Sheet>
  );
}

function RundownItemSheet({ item, workstreams, onSave, onDelete, onClose }){
  const isNew = !item.id;
  const [name,setName]=useState(item.name||"");
  const [workstreamId,setWs]=useState(item.workstreamId || (workstreams[0]&&workstreams[0].id) || "");
  const [status,setStatus]=useState(item.status||"");
  const [nextStep,setNext]=useState(item.nextStep||"");
  const [blocker,setBlocker]=useState(item.blocker||"");
  const [note,setNote]=useState(item.note||"");
  const [initiative,setInitiative]=useState(!!item.initiative);
  const [pinned,setPinned]=useState(!!item.pinned);
  const [pursuit,setPursuit]=useState(!!item.pursuit);
  const [decision,setDecision]=useState(item.decision||null);
  function save(){
    const n=name.trim(); if(!n) return;
    onSave({ id:item.id, workstreamId, name:n, status, nextStep:nextStep.trim(), blocker:blocker.trim(),
      note:note.trim(), decision: cleanDecision(decision), initiative, pinned: initiative && pinned, pursuit });
  }
  return (
    <Sheet title={isNew?(item.initiative?"Add initiative":item.pursuit?"Add pursuit":"Add item"):"Edit item"} onClose={onClose}>
      <div className="field"><span className="label">What is it</span>
        <input className="input" value={name} autoFocus onChange={e=>setName(e.target.value)}
          placeholder="e.g. Tapp Engine" onKeyDown={e=>{ if(e.key==="Enter") save(); }}/></div>
      <div className="field"><span className="label">Area</span>
        <select className="select" value={workstreamId} onChange={e=>setWs(e.target.value)}>
          {workstreams.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
        </select></div>
      <div className="field"><span className="label">Status</span>
        <select className="select" value={status} onChange={e=>setStatus(e.target.value)}>
          <option value="">None (just awareness)</option>
          {RUNDOWN_STATUSES.map(s=><option key={s.k} value={s.k}>{s.label}</option>)}
        </select></div>
      <div className="field"><span className="label">Next step (optional)</span>
        <input className="input" value={nextStep} onChange={e=>setNext(e.target.value)}
          placeholder="an action, or a wait (e.g. hear back from Eric)"/></div>
      <div className="field"><span className="label">Blocker (optional)</span>
        <input className="input" value={blocker} onChange={e=>setBlocker(e.target.value)}
          placeholder="what's in the way / who you're waiting on"/></div>
      <div className="field"><span className="label">Note (optional)</span>
        <textarea className="input" rows={2} value={note} onChange={e=>setNote(e.target.value)}
          placeholder="context, numbers, links"/></div>
      <DecisionField value={decision} onChange={setDecision}/>
      <label className="row" style={{alignItems:"center",gap:10,marginTop:4,cursor:"pointer"}}>
        <input type="checkbox" checked={pursuit} onChange={e=>setPursuit(e.target.checked)}
          style={{width:18,height:18,flex:"0 0 auto",accentColor:"var(--green)"}}/>
        <span style={{flex:1}}><b style={{display:"block",fontSize:14}}>Pursuit</b>
          <span className="hint">A known deal you&rsquo;re trying to win - shows in the Pursuits pipeline</span></span>
      </label>
      <label className="row" style={{alignItems:"center",gap:10,marginTop:8,cursor:"pointer"}}>
        <input type="checkbox" checked={initiative} onChange={e=>setInitiative(e.target.checked)}
          style={{width:18,height:18,flex:"0 0 auto",accentColor:"var(--blue)"}}/>
        <span style={{flex:1}}><b style={{display:"block",fontSize:14}}>Strategic initiative</b>
          <span className="hint">A big bet, tracked on its own tier - not a tactical item</span></span>
      </label>
      {initiative &&
        <label className="row" style={{alignItems:"center",gap:10,marginTop:8,cursor:"pointer"}}>
          <input type="checkbox" checked={pinned} onChange={e=>setPinned(e.target.checked)}
            style={{width:18,height:18,flex:"0 0 auto",accentColor:"var(--amber)"}}/>
          <span style={{flex:1}}><b style={{display:"block",fontSize:14}}>Pin as a north star</b>
            <span className="hint">Keep it up top on the Overview</span></span>
        </label>}
      <button className="btn btn-primary btn-block" style={{marginTop:12}} disabled={!name.trim()} onClick={save}>
        {isNew?"Add":"Save"}</button>
      {!isNew && <button className="btn btn-ghost btn-block" style={{marginTop:10,color:"var(--red)"}}
        onClick={()=>onDelete(item.id)}>Delete</button>}
    </Sheet>
  );
}

function RundownWorkstreamsSheet({ rundown, onSave, onClose }){
  const [ws,setWs]=useState(()=> (rundown.workstreams||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0)));
  const [adding,setAdding]=useState("");
  const itemCount = (id)=> (rundown.items||[]).filter(i=>i.workstreamId===id).length;
  function commit(next){ setWs(next); onSave(next); }
  function rename(id,v){ const n=(v||"").trim(); if(n) commit(ws.map(w=>w.id===id?{...w,name:n}:w)); }
  function add(){ const n=adding.trim(); if(!n) return;
    commit([...ws, { id:uid(), name:n, order:(ws.reduce((m,w)=>Math.max(m,w.order||0),0))+1 }]); setAdding(""); }
  function del(id){ if(itemCount(id)>0) return; commit(ws.filter(w=>w.id!==id)); }
  return (
    <Sheet title="Areas" onClose={onClose}>
      {ws.map(w=>(
        <div key={w.id} className="row" style={{alignItems:"center",gap:8,background:"var(--bg)",marginBottom:6}}>
          <input className="input" defaultValue={w.name} key={w.id+"|"+w.name} style={{flex:1}}
            onBlur={e=>rename(w.id,e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }}/>
          {itemCount(w.id)>0
            ? <span className="chip" style={{flex:"0 0 auto"}}>{itemCount(w.id)}</span>
            : <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>del(w.id)}>Remove</button>}
        </div>
      ))}
      <div className="row" style={{marginTop:6}}>
        <input className="input" value={adding} onChange={e=>setAdding(e.target.value)} placeholder="Add an area"
          onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:3}}/>
        <button className="btn btn-ghost btn-sm" onClick={add} style={{flex:1}}>Add</button>
      </div>
      <p className="hint" style={{marginTop:6}}>Tap a name to rename. An area with items can't be removed until it's empty.</p>
    </Sheet>
  );
}

function RundownView({ store, toast, toastUndo }){
  const rundown = store.rundown;
  const [shown,setShown]=useState(()=>{ const s=lsGet("rdShown",null); return new Set(Array.isArray(s)?s.filter(k=>RD_FILTER_KEYS.includes(k)):RD_DEFAULT_SHOWN); });
  const [needsMe,setNeedsMe]=useState(false);
  const [mode,setMode]=useState(()=>lsGet("rdMode","overview"));   // overview | board | initiatives | wins
  const [edit,setEdit]=useState(null);      // item object being edited/created; null = closed
  const [manageWs,setManageWs]=useState(false);
  const [importing,setImporting]=useState(false);
  const goMode=(m)=>{ setMode(m); lsSet("rdMode", m); };

  // Seed on first open (once). store.rundown starts null.
  useEffect(()=>{ if(store.rundown===null) store.saveRundown(seedRundown()); }, []);

  if(!rundown){
    return <div className="screen"><div className="topbar" style={{padding:0,position:"static"}}>
      <div className="eyebrow">Awareness</div><h1 className="title">Rundown</h1></div>
      <p className="hint" style={{marginTop:16}}>Setting up your board...</p></div>;
  }

  const ws = (rundown.workstreams||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const items = rundown.items||[];
  const isAllShown = RD_FILTER_KEYS.every(k=>shown.has(k));
  const persistShown=(next)=>{ setShown(next); lsSet("rdShown",[...next]); };
  const toggleStatus=(k)=>{ const next=new Set(shown); if(next.has(k)) next.delete(k); else next.add(k);
    if(next.size===0) RD_FILTER_KEYS.forEach(x=>next.add(x));   // never empty -> falls back to All
    persistShown(next); };
  const showAll=()=>persistShown(new Set(RD_FILTER_KEYS));

  // Tactical board = items that are NOT strategic initiatives (those get their own tier).
  function visibleFor(wsId){
    return items.filter(it=>it.workstreamId===wsId && !it.initiative)
      .filter(it=> shown.has(it.status||""))
      .filter(it=> needsMe ? rundownHasAction(it) : true)
      .sort((a,b)=>(a.order||0)-(b.order||0));
  }
  const byUpdated = (a,b)=> (b.updatedAt||"").localeCompare(a.updatedAt||"");
  function renderItemCard(it, showNote){
    const st = RUNDOWN_STATUS_MAP[it.status];
    return (
      <div key={it.id} className={"rd-item"+(it.status==="dropped"?" dropped":"")+(it.pinned?" pinned":"")} onClick={()=>setEdit(it)}>
        <div className="rd-head">
          {it.pinned && <span className="rd-star">{Ic.star}</span>}
          {st && <span className={"rd-chip "+st.cls}>{st.label}</span>}
          <span className="rd-name">{it.name}</span>
        </div>
        {it.nextStep && it.nextStep.trim() && <div className="rd-line"><b className="rd-next">Next</b> {it.nextStep}</div>}
        {it.blocker && it.blocker.trim() && <div className="rd-line"><b className="rd-block">Blocked</b> {it.blocker}</div>}
        {decisionIsOpen(it.decision) && <div className="rd-line"><b className="rd-decide">Deciding</b> {decisionSummary(it.decision)}</div>}
        {showNote && it.note && it.note.trim() && <div className="rd-line rd-note">{it.note}</div>}
      </div>
    );
  }
  function saveItem(it){
    const list = items.slice();
    if(it.id){ const i=list.findIndex(x=>x.id===it.id); if(i>=0) list[i]={...list[i],...it,updatedAt:nowISO()}; }
    else { const order=(list.filter(x=>x.workstreamId===it.workstreamId).reduce((m,x)=>Math.max(m,x.order||0),0))+10;
           list.push({ ...it, id:uid(), order, updatedAt:nowISO() }); }
    store.saveRundown({ ...rundown, items:list }); setEdit(null);
    toast && toast(it.id?"Saved":"Added");
  }
  function deleteItem(id){
    const removed = items.find(x=>x.id===id);
    store.saveRundown({ ...rundown, items: items.filter(x=>x.id!==id) }); setEdit(null);
    toastUndo && toastUndo("Item removed", ()=>{ const cur=store.rundown||rundown;
      store.saveRundown({ ...cur, items:[...(cur.items||[]), removed] }); });
  }
  function doImport(parsed){
    const cur = store.rundown || { workstreams:[], items:[] };
    const wsList = (cur.workstreams||[]).slice();
    const idByName = {};
    wsList.forEach(w=>{ idByName[w.name.toLowerCase()] = w.id; });
    let order = wsList.reduce((m,w)=>Math.max(m, w.order||0), -1);
    parsed.workstreams.forEach(n=>{
      if(!idByName[n.toLowerCase()]){ const id=uid(); wsList.push({ id, name:n, order:++order }); idByName[n.toLowerCase()]=id; }
    });
    const itemList = (cur.items||[]).slice();
    const orderByWs = {};
    itemList.forEach(it=>{ orderByWs[it.workstreamId]=Math.max(orderByWs[it.workstreamId]||0, it.order||0); });
    let added = 0;
    parsed.items.forEach(p=>{
      const wsId = idByName[p.workstreamName.toLowerCase()]; if(!wsId) return;
      const o = (orderByWs[wsId]||0)+10; orderByWs[wsId]=o;
      itemList.push({ id:uid(), workstreamId:wsId, name:p.name, status:p.status||"",
        nextStep:p.nextStep||"", blocker:p.blocker||"", note:p.note||"",
        decision: cleanDecision(p.decision),   // same normalizer the editor uses
        initiative:!!p.initiative, pinned:!!(p.initiative&&p.pinned), pursuit:!!p.pursuit,
        order:o, updatedAt:nowISO() });
      added++;
    });
    store.saveRundown({ ...cur, workstreams:wsList, items:itemList });
    setImporting(false);
    toast && toast("Imported "+added+" item"+(added===1?"":"s"));
  }
  function renderInitiatives(){
    const inits = items.filter(it=>it.initiative);
    const pinned = inits.filter(it=>it.pinned).sort(byUpdated);
    const rest = inits.filter(it=>!it.pinned).sort(byUpdated);
    return (
      <>
        <button className="btn btn-primary btn-block" style={{marginTop:12}}
          onClick={()=>setEdit({ workstreamId: ws[0]&&ws[0].id, initiative:true })}>{Ic.plus} Add initiative</button>
        {inits.length===0 && <p className="hint" style={{marginTop:16,opacity:.7}}>No initiatives yet. Add your big bets, and pin the top ones as north stars.</p>}
        {pinned.length>0 && <><div className="eyebrow" style={{marginTop:18,marginBottom:8}}>North stars</div>{pinned.map(it=>renderItemCard(it,true))}</>}
        {rest.length>0 && <><div className="eyebrow" style={{marginTop:18,marginBottom:8}}>Tracking</div>{rest.map(it=>renderItemCard(it,true))}</>}
      </>
    );
  }
  function renderPursuits(){
    const all = items.filter(it=>it.pursuit);
    const groups = RUNDOWN_STATUSES.map(s=>({ s, list: all.filter(it=>(it.status||"")===s.k).sort(byUpdated) }))
      .concat([{ s:{k:"",label:"No status"}, list: all.filter(it=>!it.status).sort(byUpdated) }]);
    return (
      <>
        <button className="btn btn-primary btn-block" style={{marginTop:12}}
          onClick={()=>setEdit({ workstreamId: ws[0]&&ws[0].id, pursuit:true })}>{Ic.plus} Add pursuit</button>
        {all.length===0 && <p className="hint" style={{marginTop:16,opacity:.7}}>No pursuits yet. A pursuit is a known deal you&rsquo;re trying to win - open any item and check <b>Pursuit</b>, or add one here.</p>}
        {groups.map(g=> g.list.length>0 && (
          <div key={g.s.k||"none"}>
            <div className="eyebrow" style={{marginTop:18,marginBottom:8}}>{g.s.label} &middot; {g.list.length}</div>
            {g.list.map(it=>renderItemCard(it,true))}
          </div>
        ))}
      </>
    );
  }
  function renderWins(){
    const wins = items.filter(it=>it.status==="won").sort(byUpdated);
    return wins.length===0
      ? <p className="hint" style={{marginTop:16,opacity:.7}}>No wins logged yet. Set an item's status to Won and it lands here as a deal won.</p>
      : <div style={{marginTop:16}}>{wins.map(it=>renderItemCard(it,true))}</div>;
  }
  function renderOverview(){
    const heroes = items.filter(it=>it.initiative && it.pinned).sort(byUpdated);
    const activePursuits = items.filter(it=>it.pursuit && it.status!=="won" && it.status!=="done" && it.status!=="dropped").sort(byUpdated);
    const recentWins = items.filter(it=>it.status==="won").sort(byUpdated).slice(0,5);
    const needs = items.filter(it=>!it.initiative && it.status!=="dropped" && rundownHasAction(it)).sort(byUpdated);
    return (
      <>
        <div className="eyebrow" style={{marginTop:16,marginBottom:8,display:"flex",alignItems:"center",gap:5}}><span className="rd-star">{Ic.star}</span> North stars</div>
        {heroes.length ? heroes.map(it=>renderItemCard(it,true)) : <p className="hint" style={{opacity:.7}}>Pin an initiative as a north star to see it here.</p>}
        <div className="eyebrow" style={{marginTop:22,marginBottom:8}}>Active pursuits</div>
        {activePursuits.length ? activePursuits.slice(0,5).map(it=>renderItemCard(it,false)) : <p className="hint" style={{opacity:.7}}>Deals you&rsquo;re trying to win show up here.</p>}
        <div className="eyebrow" style={{marginTop:22,marginBottom:8}}>Recent wins</div>
        {recentWins.length ? recentWins.map(it=>renderItemCard(it,true)) : <p className="hint" style={{opacity:.7}}>Deals you win show up here.</p>}
        <div className="eyebrow" style={{marginTop:22,marginBottom:8}}>Needs you</div>
        {needs.length ? needs.slice(0,15).map(it=>renderItemCard(it,false)) : <p className="hint" style={{opacity:.7}}>Nothing waiting on you right now.</p>}
      </>
    );
  }
  const totalOpen = items.filter(rundownHasAction).length;

  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <div className="eyebrow">Awareness</div>
        <div className="topbar-row"><h1 className="title">Rundown</h1>
          <div style={{display:"flex",gap:6,flex:"0 0 auto"}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setImporting(true)}>Import</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setManageWs(true)}>Areas</button>
          </div></div>
        <div className="subtle" style={{marginTop:2}}>{items.length} item{items.length===1?"":"s"} &middot; {totalOpen} need{totalOpen===1?"s":""} a next step or unblock</div>
      </div>

      {ws.length===0 && items.length===0 &&
        <div className="card" style={{marginTop:16}}>
          <b style={{fontFamily:"Fraunces",fontSize:16}}>Set up your Rundown</b>
          <p className="hint" style={{marginTop:6}}>Your awareness board: everything in flight, grouped into areas, each item showing where it stands. Start with an area (like &ldquo;Opportunities&rdquo; or &ldquo;Deals&rdquo;), then add items to it.</p>
          <button className="btn btn-primary btn-block" style={{marginTop:10}} onClick={()=>setManageWs(true)}>Add your first area</button>
          <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>setImporting(true)}>Paste from a note</button>
        </div>}

      {(ws.length>0 || items.length>0) && <>
        <div className="seg rd-modes" style={{marginTop:12}}>
          <button className={"seg-b"+(mode==="overview"?" on":"")} onClick={()=>goMode("overview")}>Overview</button>
          <button className={"seg-b"+(mode==="board"?" on":"")} onClick={()=>goMode("board")}>Board</button>
          <button className={"seg-b"+(mode==="pursuits"?" on":"")} onClick={()=>goMode("pursuits")}>Pursuits</button>
          <button className={"seg-b"+(mode==="initiatives"?" on":"")} onClick={()=>goMode("initiatives")}>Initiatives</button>
          <button className={"seg-b"+(mode==="wins"?" on":"")} onClick={()=>goMode("wins")}>Wins</button>
        </div>

        {mode==="overview" && renderOverview()}
        {mode==="pursuits" && renderPursuits()}
        {mode==="initiatives" && renderInitiatives()}
        {mode==="wins" && renderWins()}
        {mode==="board" && <>
          <div className="sortrow" style={{marginTop:12}}>
            <div className="seg">
              <button className={"seg-b"+(!needsMe?" on":"")} onClick={()=>setNeedsMe(false)}>Everything</button>
              <button className={"seg-b"+(needsMe?" on":"")} onClick={()=>setNeedsMe(true)}>Needs me</button>
            </div>
          </div>
          <div className="rd-filters" style={{marginTop:10}}>
            <button className={"rd-fchip rd-fall"+(isAllShown?" on":"")} onClick={showAll}>All</button>
            {RUNDOWN_STATUSES.map(s=>(
              <button key={s.k} className={"rd-fchip"+(!isAllShown&&shown.has(s.k)?" on":"")} onClick={()=>toggleStatus(s.k)}>{s.label}</button>
            ))}
            <button className={"rd-fchip"+(!isAllShown&&shown.has("")?" on":"")} onClick={()=>toggleStatus("")}>No status</button>
          </div>
          <button className="btn btn-primary btn-block" style={{marginTop:12}}
            onClick={()=>setEdit({ workstreamId: ws[0]&&ws[0].id })}>{Ic.plus} Add item</button>
          {ws.map(w=>{
            const vis = visibleFor(w.id);
            if(needsMe && vis.length===0) return null;
            return (
              <div key={w.id} style={{marginTop:18}}>
                <div className="eyebrow" style={{marginBottom:8}}>{w.name}</div>
                {vis.length===0
                  ? <p className="hint" style={{opacity:.6}}>Nothing here.</p>
                  : vis.map(it=>renderItemCard(it, false))}
              </div>
            );
          })}
        </>}
      </>}

      <div style={{height:24}}></div>

      {edit && <RundownItemSheet item={edit} workstreams={ws} onSave={saveItem} onDelete={deleteItem} onClose={()=>setEdit(null)}/>}
      {manageWs && <RundownWorkstreamsSheet rundown={rundown} onClose={()=>setManageWs(false)}
        onSave={(nextWs)=>store.saveRundown({ ...store.rundown, workstreams: nextWs })}/>}
      {importing && <RundownImportSheet onImport={doImport} onClose={()=>setImporting(false)}/>}
    </div>
  );
}
