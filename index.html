        {list.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
      </select>
    </div>
  );
}

function TodoEditor({ store, todo, onClose, toast }){
  const t = todo || {};
  const [space,setSpace]=useState(editorSpace(store, t));
  const [title,setTitle]=useState(t.title||"");
  const [status,setStatus]=useState(t.status||"inbox");
  const [type,setType]=useState(t.type||"");
  const [quad,setQuad]=useState(t.quad||"");
  const [due,setDue]=useState(t.due||"");
  const [defer,setDefer]=useState(t.defer||"");
  const [recur,setRecur]=useState(t.recur||"none");
  const [routine,setRoutine]=useState(
    t.routine !== undefined ? !!t.routine : defaultRoutineFor(t.recur||"none"));
  // Switching the cadence re-applies the sensible default (daily = routine), which is
  // what you want when turning repetition on; you can still override it below.
  function changeRecur(v){ setRecur(v); setRoutine(defaultRoutineFor(v)); }
  const [tags,setTags]=useState((t.tags||[]).join(", "));
  const [projectId,setProjectId]=useState(t.projectId||"");
  const [url,setUrl]=useState(t.url||"");
  const [notes,setNotes]=useState(t.notes||"");
  const [waitingOn,setWaitingOn]=useState(t.waitingOn||"");
  const [event,setEvent]=useState(t.event||null);
  const [subtasks,setSubtasks]=useState(t.subtasks||[]);
  const [newSub,setNewSub]=useState("");
  const locs = knownLocations(store);
  const [location,setLocation]=useState(t.location||"");
  const [locCustom,setLocCustom]=useState(!!t.location && !locs.includes(t.location));
  const [newProj,setNewProj]=useState("");      // inline "create new project" name
  const projects = store.data.projects.filter(p=>p.status!=="archived");

  function save(){
    if(!title.trim()){ toast("Add a title first"); return; }
    // If the user chose "create new project", make it first and link to its id.
    let finalProjectId = projectId;
    if(projectId==="__new"){
      if(newProj.trim()){
        const p = store.upsert("projects",{ name:newProj.trim(), type, status:"active", outcome:"", description:"", deadline:"", goalId:null });
        finalProjectId = p.id;
        log("SAVE","todo created project "+newProj.trim());
      } else {
        finalProjectId = "";   // chose "new" but typed nothing -> leave unlinked
      }
    }
    // A recurring todo needs an anchor; if none given, start it today.
    let dueAnchored = (recur!=="none" && !due) ? TODAY() : due;
    const isRt = recur!=="none" && routine;
    // A routine must never be saved already-overdue - that is the whole point of the
    // flag. Ticking "it's a routine" on a long-stale item fixes it here and now,
    // rather than waiting for the next pull to roll it.
    if(isRt && dueAnchored && dueAnchored < TODAY()) dueAnchored = rollToToday(dueAnchored, recur);
    store.upsert("todos",{ id:t.id, title:title.trim(), status, type, quad, due:dueAnchored, defer, recur, routine:isRt, space,
      tags: tags.split(",").map(s=>s.trim()).filter(Boolean), projectId:finalProjectId, url:url.trim(), notes, location,
      waitingOn: status==="waiting"?waitingOn:"", subtasks, event: cleanEventLink(event),
      starredToday: t.starredToday||false, completedAt: t.completedAt||null });
    toast(t.id?"Saved":"Added"); onClose();
  }
  function addSub(){ if(!newSub.trim())return; setSubtasks([...subtasks,{id:uid(),title:newSub.trim(),done:false}]); setNewSub(""); }

  return (
    <Sheet title={t.id?"Edit todo":"New todo"} onClose={onClose} action={<button className="btn btn-primary btn-sm" onClick={save}>{t.id?"Save":"Add"}</button>}>
      <div className="title-field"><span className="label">Title</span>
        <input className="title-input" value={title} onChange={e=>setTitle(e.target.value)} placeholder="What needs doing?" autoFocus/></div>
      <div className="row">
        <div className="field"><span className="label">Status</span>
          <select className="select" value={status} onChange={e=>setStatus(e.target.value)}>
            {STATUS_ORDER.map(s=><option key={s} value={s}>{s[0].toUpperCase()+s.slice(1)}</option>)}
          </select></div>
        <div className="field"><span className="label">Category</span>
          <select className="select" value={type} onChange={e=>setType(e.target.value)}>
            <option value="">Uncategorized</option>{knownCategories(store).map(c=><option key={c} value={c}>{c}</option>)}</select></div>
      </div>
      <SpaceField store={store} value={space} onChange={setSpace}/>
      {status==="waiting" &&
        <div className="field"><span className="label">Waiting on</span>
          <input className="input" value={waitingOn} onChange={e=>setWaitingOn(e.target.value)} placeholder="Who / what?"/></div>}
      <div className="field"><span className="label">Priority (Eisenhower)</span>
        <select className="select" value={quad} onChange={e=>setQuad(e.target.value)}>
          <option value="">None</option>
          {Object.entries(QUADRANTS).map(([k,v])=><option key={k} value={k}>{v.label} - {v.hint}</option>)}
        </select></div>
      <div className="row">
        <div className="field"><span className="label">Due</span>
          <input className="input" type="date" value={due} onChange={e=>setDue(e.target.value)}/></div>
        <div className="field"><span className="label">Defer until</span>
          <input className="input" type="date" value={defer} onChange={e=>setDefer(e.target.value)}/></div>
      </div>
      <div className="field"><span className="label">Repeat</span>
        <select className="select" value={recur} onChange={e=>changeRecur(e.target.value)}>
          <option value="none">Does not repeat</option>
          <option value="daily">Daily</option>
          <option value="weekdays">Every weekday (Mon-Fri)</option>
          <option value="weekends">Every weekend (Sat-Sun)</option>
          <option value="weekly">Weekly</option>

/* Swipe a row left to reveal a Delete action. Horizontal-only, so vertical scroll and
   the reorder handle are unaffected; a swipe suppresses the row's open-on-tap.
   Pointer capture is DEFERRED until horizontal intent is established: capturing on
   pointerdown retargets the follow-up click to .swipe-body, so on desktop a mouse
   click never reached the row's own onClick (rows wouldn't open). Deferring keeps
   both clean mouse clicks AND mouse-drag swipe - the latter matters because some
   rows (locations/categories editor) have swipe as their ONLY delete affordance. */
function SwipeRow({ onDelete, children }){
  const [dx,setDx] = useState(0);
  const st = useRef(null); const moved = useRef(false);
  function down(e){ st.current = { x:e.clientX, y:e.clientY, base:dx }; moved.current = false; }
  function move(e){
    if(!st.current) return;
    const ddx = e.clientX - st.current.x, ddy = e.clientY - st.current.y;
    if(!moved.current && Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy)){
      moved.current = true;                                        // horizontal intent: now it's a swipe...
      try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}  // ...so capture to track beyond the row
    }
    if(moved.current){ setDx(Math.max(-96, Math.min(0, st.current.base + ddx))); }
  }
  function end(){ if(!st.current) return; st.current = null; setDx(d => { const nd = d <= -48 ? -84 : 0; if(nd===0) moved.current = false; return nd; }); }
  function clickCapture(e){ if(moved.current || dx !== 0){ e.stopPropagation(); e.preventDefault(); moved.current = false; setDx(0); } }
  return (
    <div className="swipe-wrap">
      <button className="swipe-del" onClick={(e)=>{ e.stopPropagation(); setDx(0); onDelete(); }}>{Ic.trash}<span>Delete</span></button>
      <div className="swipe-body" style={{ transform:`translateX(${dx}px)`, transition: st.current ? "none" : "transform .18s" }}
        onPointerDown={down} onPointerMove={move} onPointerUp={end} onPointerCancel={end} onClickCapture={clickCapture}>
        {children}
      </div>
    </div>
  );
}

/* ============================================================
   DRAG-TO-REORDER list. Handle-based (grip), pointer events for touch+mouse.
   Persists one moved item via onReorder(movedId, newIdsInOrder).
   ============================================================ */
function DragList({ items, getId, onReorder, onDelete, render, reorderable=true }){
  const [order,setOrder] = useState(items);
  const dragId = useRef(null);
  const cont = useRef(null);
  // resync from source unless mid-drag
  useEffect(() => { if(dragId.current==null) setOrder(items); }, [items]);
  function down(e, id){ dragId.current = id; try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){} setOrder(items.slice()); }
  function move(e){
    if(dragId.current==null || !cont.current) return;
    const rows = [...cont.current.querySelectorAll("[data-drag-row]")];
    const y = e.clientY;
    let target = rows.findIndex(r => { const b=r.getBoundingClientRect(); return y < b.top + b.height/2; });
    if(target===-1) target = order.length-1;
    const from = order.findIndex(x => getId(x)===dragId.current);
    if(from<0 || target<0 || from===target) return;
    const next = order.slice(); const [m] = next.splice(from,1); next.splice(target,0,m); setOrder(next);
  }
  function up(){
    if(dragId.current==null) return;
    const moved = dragId.current; dragId.current = null;
    const newIds = order.map(getId), oldIds = items.map(getId);
    if(newIds.join("|") !== oldIds.join("|")) onReorder(moved, newIds);  // skip stray taps
  }
  return (
    <div className="list" ref={cont} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
      {order.map(it => (
        <div className={"drag-row"+(dragId.current===getId(it)?" dragging":"")} data-drag-row key={getId(it)}>
          {reorderable && <button className="drag-handle" aria-label="Drag to reorder" onPointerDown={e=>down(e, getId(it))}>{Ic.grip}</button>}
          <div className="drag-row-body">{onDelete ? <SwipeRow onDelete={()=>onDelete(it)}>{render(it)}</SwipeRow> : render(it)}</div>
        </div>
      ))}
    </div>
  );
}

/* Shared "show completed to-dos" preference, used everywhere to-dos are listed
   (the To-Dos view and inside a project) so behavior is consistent. The value is
   persisted to localStorage, so the choice sticks between sessions and across both
   surfaces. Each view keeps its own React state but reads/writes the same key; the

function useShowDone(){
  const [showDone,setShowDone]=useState(()=>lsGet("showDone",false));

}

  const datePart = targetISO.slice(0,10);

function TodoRow({ store, todo, onOpen }){
  const done = todo.status==="done";
  const [snz,setSnz]=useState(false);
  const project = store.data.projects.find(p=>p.id===todo.projectId);
  const subDone = (todo.subtasks||[]).filter(s=>s.done).length;
  const dwait = todo.status==="waiting" ? waitingDays(todo) : null;            // days waiting (null if not waiting)
  const waitStale = dwait!=null && dwait >= waitThreshold(store);              // past the follow-up threshold
  function toggle(){
    if(!done){ store.completeTodo(todo); }       // completing: spawns next if recurring
    else { store.upsert("todos",{ id:todo.id, status:"next", completedAt:null }); } // un-completing: no spawn
  }
  return (
    <div className={"item"+(done?" done":"")}>
      <Check on={done} onClick={toggle}/>
      <div className="item-body" onClick={onOpen}>
        <div className="item-title">{todo.title}</div>
        <div className="item-meta">
          <TypeChip type={todo.type}/>
          {todo.starredToday && <span className="chip amber">{Ic.star}</span>}
          {todo.status!=="done" && todo.status!=="next" && todo.status!=="waiting" && <span className="chip">{todo.status}</span>}
          {todo.status==="waiting" && <span className={"chip "+(waitStale?"red":"")}>{Ic.clock} Waiting{dwait!=null?" "+dwait+"d":""}</span>}
          {todo.quad && <span className="chip amber">{QUADRANTS[todo.quad].label}</span>}
          {todo.due && <span className={"chip "+(isOverdue(todo.due)?"red":isToday(todo.due)?"amber":"")}>{isOverdue(todo.due)?"Overdue ":""}{fmtDate(todo.due)}</span>}
          {isDeferredAway(todo) && <span className="chip blue">{Ic.clock} {fmtDefer(todo.defer)}</span>}
          {todo.waitingOn && <span className="chip blue">waiting: {todo.waitingOn}</span>}
          {todo.event && todo.event.title && <span className="chip blue">{Ic.schedule} {todo.event.title}</span>}
          {todo.location && <span className="chip green">{todo.location}</span>}
          {project && <span className="chip">{project.name}</span>}
          {todo.recur && todo.recur!=="none" && <span className="chip violet">{Ic.review} {todo.recur}</span>}
          {(todo.subtasks||[]).length>0 && <span className="chip">{subDone}/{todo.subtasks.length}</span>}
          {(todo.tags||[]).map(t=><span key={t} className="chip">#{t}</span>)}
        </div>
      </div>
      {!done && <button aria-label="Snooze" onClick={(e)=>{ e.stopPropagation(); setSnz(true); }}
        style={{flex:"0 0 auto",alignSelf:"center",background:"none",border:"none",color:"var(--ink-3)",padding:"6px 8px",cursor:"pointer"}}>
        <span style={{width:18,height:18,display:"inline-flex"}}>{Ic.clock}</span></button>}
      {snz && <SnoozeSheet onPick={(iso)=>snoozeTodo(store, todo, iso)} onClose={()=>setSnz(false)}/>}
    </div>
  );
}

/* ============================================================
   CAPTURE - action sheet + quick add + AI flows
   ============================================================ */
function CaptureSheet({ store, onClose, toast, openEditor, openAI }){
  // Resume an unsaved review draft if one was left behind (survives close + reload).
  const initialPending = lsGet("pendingReview", []) || [];
  const [mode,setMode]=useState(initialPending.length ? "review" : "menu"); // menu | quick | brain | photo | review | template
  const [quick,setQuick]=useState("");
  const [jot,setJot]=useState("");           // the freeform note scratchpad
  const [tplName,setTplName]=useState("");   // optional project name when creating from a template
  const [busy,setBusy]=useState(false);
  const [brain,setBrain]=useState("");
  const [results,setResults]=useState(initialPending); // AI extracted items pending review
  const [err,setErr]=useState("");
  const fileRef = useRef(null);

  // WHY: persist the in-progress review so an accidental dismiss never throws away
  // AI work the user already paid an API call for. Cleared only on save or discard.
  useEffect(() => {
    if(results.length) lsSet("pendingReview", results); else lsDel("pendingReview");
  }, [results]);

  // Jot: the zero-friction note. No fields, no form, no AI wait - type and it's saved.
  // Lands in ideas as state "raw" (the unprocessed pile) so it can be organized later,
  // by hand or by AI. First line becomes the title, the rest is the body.
  function jotDown(){
    const raw = jot.trim(); if(!raw) return;
    const nl = raw.indexOf("\n");
    let title = (nl===-1 ? raw : raw.slice(0,nl)).trim();
    const body = nl===-1 ? "" : raw.slice(nl+1).trim();
    // A long single-line jot still needs a readable title; keep the whole text in the body.
    if(!body && title.length>80) return saveJot(title.slice(0,80).trim()+"...", title);
    saveJot(title, body);
  }
  function saveJot(title, body){
    store.upsert("ideas",{ title, body, type:"", state:"raw", space: editorSpace(store, null),
      tags:[], capturedAt: nowISO(), promotedProjectId: null });
    toast("Jotted down");
    setJot("");
    log("NAV","jot -> ideas (raw)");
  }
  function quickAdd(){
    const raw = quick.trim(); if(!raw) return;
    // Pull a plain-language due date out of the text ("call dentist thursday"),
    // locally - no AI, no wait. If nothing parses, `due` is "" and the title is raw.
    const { due, title } = parseDueFromText(raw);
    store.upsert("todos",{ title: title || raw, status:"inbox", type:"", tags:[], subtasks:[], due: due || "" });
    toast(due ? ("Added to Inbox · due " + fmtDueShort(due)) : "Added to Inbox");
    setQuick("");
    log("NAV", "quick-add to inbox" + (due ? " (due parsed)" : ""));
  }
  async function runBrain(){
    if(!brain.trim())return;
    setBusy(true); setErr("");
    try{
      const items = await claudeExtract([{type:"text",text:"Turn this into tracker items:\n\n"+brain}]);
      setResults(items.map(x=>({ ...x, keep:true }))); setMode("review");
    }catch(e){ setErr(e.message); } finally{ setBusy(false); }
  }
  async function runPhoto(file){
    if(!file)return;
    setBusy(true); setErr(""); setMode("photo");
    try{
      const b64 = await resizeImage(file);
      const items = await claudeExtract([
        { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:b64 } },
        { type:"text", text:"Extract every task/idea written or shown in this image as tracker items." }
      ]);
      setResults(items.map(x=>({ ...x, keep:true }))); setMode("review");
    }catch(e){ setErr(e.message); setMode("photo"); } finally{ setBusy(false); }
  }
  function saveReview(){
    const keep = results.filter(r=>r.keep);
    const byFile = { todos:[], ideas:[], projects:[] };
    keep.forEach(r=>{
      if(r.type==="idea") byFile.ideas.push({ title:r.title, body:r.note||"", type:"", tags:[], state:"raw", capturedAt:nowISO() });
      else if(r.type==="project") byFile.projects.push({ name:r.title, type:"", status:"active", outcome:"", description:r.note||"", deadline:"", goalId:null });
      else byFile.todos.push({ title:r.title, status:r.suggestedStatus||"inbox", type:"", tags:[], notes:r.note||"", subtasks:[] });
    });
    Object.entries(byFile).forEach(([f,rows])=>{ if(rows.length) store.bulkAdd(f,rows); });
    lsDel("pendingReview");                  // explicit: unmount may pre-empt the effect
    setResults([]);
    toast("Added "+keep.length+" item"+(keep.length===1?"":"s")); onClose();
  }
  function discardDraft(){
    lsDel("pendingReview"); setResults([]); setMode("menu");
    toast("Draft discarded");
  }

  if(mode==="menu") return (
    <Sheet title="Capture" onClose={onClose}>
      {results.length>0 &&
        <button className="card" style={{display:"flex",alignItems:"center",gap:12,width:"100%",textAlign:"left",
          borderColor:"var(--amber-line)",background:"var(--amber-dim)",marginTop:6,marginBottom:4}}
          onClick={()=>setMode("review")}>
          <span className="act-ic">{Ic.bolt}</span>
          <span className="act-txt"><b>Resume your review</b><span>{results.length} item{results.length===1?"":"s"} waiting - nothing saved yet</span></span>
        </button>}
      <div className="field" style={{marginTop:6}}>
        <span className="label">Jot a note</span>
        <textarea className="textarea" value={jot} onChange={e=>setJot(e.target.value)} style={{minHeight:72}}
          placeholder="Anything on your mind - a thought, a number, something from a call. Saved as-is, organize it later."
          onKeyDown={e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) jotDown(); }}/>
        <button className="btn btn-ghost btn-block" style={{marginTop:8}} disabled={!jot.trim()} onClick={jotDown}>
          Jot it down</button>
        <p className="hint">Saved instantly to Notes &amp; ideas - no fields, no waiting. Organize it later, yourself or with AI.</p>
      </div>
      <div className="divider"></div>
      <div className="field">
        <span className="label" style={{color:"var(--amber)"}}>Brain-dump to AI</span>
        <textarea className="textarea" value={brain} onChange={e=>setBrain(e.target.value)} style={{minHeight:92}}
          placeholder="Talk or type everything on your mind - I'll turn it into todos, projects, and ideas, and help file your inbox..."/>
        <button className="btn btn-primary btn-block" style={{marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}
          onClick={()=>{ const t=brain.trim(); if(t) lsSet("aiSeed", t); openAI(); }}>
          <span style={{width:18,height:18,display:"inline-flex"}}>{Ic.sparkle}</span> Organize with AI</button>
      </div>
      <div className="divider"></div>
      <div className="field">
        <div className="row">
          <input className="input" value={quick} onChange={e=>setQuick(e.target.value)} placeholder="Or quick-add one to Inbox..."
            onKeyDown={e=>e.key==="Enter"&&quickAdd()} style={{flex:3}}/>
          <button className="btn btn-primary btn-sm" onClick={quickAdd} style={{flex:1}}>Add</button>
        </div>
        <p className="hint">Type or dictate a single item. Add a due date in plain words and it's picked up automatically, like "pay rent friday" or "call dentist jul 5".</p>
      </div>
      <div className="divider"></div>
      <button className="act-row" onClick={()=>{ onClose(); openEditor("todo"); }}>
        <span className="act-ic">{Ic.todo}</span><span className="act-txt"><b>New todo</b><span>Full form, all fields</span></span></button>
      <button className="act-row" onClick={()=>{ onClose(); openEditor("orderCapture"); }}>
        <span className="act-ic">{Ic.camera}</span><span className="act-txt"><b>Track an order</b><span>Screenshot the confirmation</span></span></button>
      <button className="act-row" onClick={()=>{ onClose(); openEditor("idea"); }}>
        <span className="act-ic">{Ic.idea}</span><span className="act-txt"><b>New idea</b><span>A thought to sit on</span></span></button>
      <button className="act-row" onClick={()=>{ onClose(); openEditor("project"); }}>
        <span className="act-ic">{Ic.project}</span><span className="act-txt"><b>New project</b><span>An outcome with many steps</span></span></button>
      <button className="act-row" onClick={()=>{ setTplName(""); setMode("template"); }}>
        <span className="act-ic">{Ic.lists}</span><span className="act-txt"><b>New from template</b><span>Reuse a saved checklist (e.g. packing)</span></span></button>
      <button className="act-row" onClick={()=>{ onClose(); openEditor("goal"); }}>
        <span className="act-ic">{Ic.goal}</span><span className="act-txt"><b>New goal</b><span>Longer-term objective</span></span></button>
      <div className="divider"></div>
      <button className="act-row" onClick={()=>fileRef.current && fileRef.current.click()}>
        <span className="act-ic">{Ic.camera}</span><span className="act-txt"><b>Photo / scan</b><span>Read tasks from a picture</span></span></button>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}}
        onChange={e=>{ const f=e.target.files[0]; e.target.value=""; runPhoto(f); }}/>
    </Sheet>
  );

  if(mode==="template") return (
    <Sheet title="New from template" onClose={onClose}>
      {(store.templates||[]).length===0
        ? <><p className="hint">No templates yet. Open a project and tap <b>Save as template</b> to make a reusable checklist - like a packing list you reuse each trip.</p>
            <button className="btn btn-ghost btn-block" style={{marginTop:12}} onClick={()=>setMode("menu")}>Back</button></>
        : <>

              <input className="input" value={tplName} onChange={e=>setTplName(e.target.value)} placeholder="Defaults to the template name - e.g. Trip: Kansas City"/></div>

            {(store.templates||[]).map(tpl=>{ const n=(tpl.items||[]).length; return (
              <button key={tpl.id} className="act-row" onClick={()=>{
                const proj = store.createFromTemplate(tpl, tplName.trim()||tpl.name);
                toast("Created \""+proj.name+"\" ("+n+" item"+(n===1?"":"s")+")"); onClose();
              }}>
                <span className="act-ic">{Ic.lists}</span>
                <span className="act-txt"><b>{tpl.name}</b><span>{n} item{n===1?"":"s"}</span></span>
              </button>); })}
            <button className="btn btn-ghost btn-block" style={{marginTop:12}} onClick={()=>setMode("menu")}>Back</button>
          </>}
    </Sheet>
  );

  if(mode==="brain") return (
    <Sheet title="Brain dump" onClose={onClose}>
      <p className="hint" style={{marginBottom:10}}>Dump everything on your mind. Claude turns it into clean inbox items you review before saving.</p>
      <textarea className="textarea" style={{minHeight:160}} value={brain} onChange={e=>setBrain(e.target.value)}
        placeholder="call dentist, the salty tee box tech pack needs final colors, idea: subscription box, email BANA about the fee..." autoFocus/>
      {err && <p className="hint danger-text" style={{marginTop:8}}>{err}</p>}

  if(mode==="photo") return (

    </Sheet>
  );
  return null;

/* ============================================================
   FILTER HELPERS
   ============================================================ */
// An item deferred to a future date is hidden everywhere until then.
const isDeferredAway = (t) => { if(!t.defer) return false; return (t.defer.length>10) ? (t.defer > snzNow()) : (t.defer > TODAY()); };
// Quadrant sort weight (Do First highest)
const quadWeight = (q) => ({q1:0,q3:1,q2:2,q4:3,"":4})[q||""];

function todayItems(todos){
  return todos.filter(t => t.status!=="done" && t.status!=="someday" && !isDeferredAway(t) &&
    ( isToday(t.due) || isOverdue(t.due) || t.starredToday || (t.defer && t.defer===TODAY()) ));
}

/* Tomorrow is deliberately NARROWER than today, not the same filter shifted a day.
   Three of today's ingredients are today-only concepts and would be nonsense here:
   OVERDUE (nothing is overdue tomorrow), STARRED-FOR-TODAY (the flag means today),
   and the follow-up nudges (waiting-N-days is a now question). What is left is the
   honest answer to "what does tomorrow bring": things dated to it.

   The defer/due disagreement matters: an item DUE tomorrow but DEFERRED past it is
   not tomorrow's problem, so defer wins. */
function TOMORROW(){ return todayKey(snzAddDays(1)); }
function tomorrowDate(){ return snzAddDays(1); }
function tomorrowItems(todos){
  const t = TOMORROW();
  return (todos||[]).filter(x => x.status!=="done" && x.status!=="someday" &&
    (x.due===t || x.defer===t) && !(x.defer && x.defer > t));
}
/* The 7-day horizon, grouped by day. Deliberately INCLUDES today: the point of
   this view is the SHAPE of the week ("Thursday is empty, Friday is brutal"), and
   a week with today cut out of it is not the week. The overlap with the Today tab
   is intentional - Today is for focus, this is for planning.

   Overdue is NOT folded in. It belongs to no day, and dropping it into today's
   bucket would silently restate work the Today tab already owns. Habits are left
   out too: seven days of the same daily habit is noise, not information. */
const WEEK_DAYS = 7;
function weekBuckets(todos){
  const out = [];
  for(let i=0;i<WEEK_DAYS;i++){
    const d = snzAddDays(i);
    const key = todayKey(d);
    const items = (todos||[]).filter(x => x.status!=="done" && x.status!=="someday" &&
      (x.due===key || x.defer===key) && !(x.defer && x.defer > key));
    out.push({ key, date:d, items });
  }
  return out;
}
function weekCount(todos){ return weekBuckets(todos).reduce((n,b)=>n+b.items.length, 0); }
function headsUpWeek(todos){
  const n = weekCount(todos);
  return { line: n ? n + " thing" + (n===1?"":"s") + " across the next 7 days."
                   : "Nothing scheduled in the next 7 days.", tone:"calm" };
}

// Tomorrow's glance line. Separate from headsUp() rather than a mode flag on it,
// because it shares none of that function's overdue/incoming/quiet-Space logic.
function headsUpTomorrow(todos, habits){
  const n = tomorrowItems(todos).length;
  const h = (habits||[]).filter(x => habitExpectedOn(x.cadence, tomorrowDate())).length;
  const parts = [];
  if(n) parts.push(n + " land" + (n===1?"s":"") + " tomorrow.");
  if(h) parts.push(h + " habit" + (h===1?"":"s") + " due.");
  return { line: parts.length ? parts.join(" ") : "Tomorrow is clear.", tone:"calm" };
}
// ---- "What's about to hit me" -------------------------------------------------
// One plain sentence answering the two-second glance question, computed LOCALLY so
// it is instant and works offline - this is the thing you read before deciding
// whether to open anything at all.
// Counts reconcile with WHAT THE TODAY TAB ACTUALLY LISTS. That is not the same as
// todayItems(): TodayView pulls routines out into their own card, so a sentence built
// straight off todayItems() reports a number the list below it does not show. Chris hit
// exactly that on 2026-08-09 ("2 overdue and 2 on you today" over a list of 2, the other
// two being routines) and reasonably asked where the missing items were. Routines now get
// their own clause instead of being folded into the task counts.
// The horizon look-ahead is the genuinely new part - nothing else in the app answers
// "what lands in the next few days", which is the actual meaning of "incoming".
const HEADS_UP_DAYS = 7;
function headsUpWhen(due){
  const t = todayKey(snzAddDays(1));
  if(due===t) return "tomorrow";
  const d = new Date(due+"T00:00:00");
  return isNaN(d) ? "soon" : d.toLocaleDateString(undefined,{weekday:"long"});
}
function headsUp(todos, spaces, activeSpace, habits){
  const open = (todos||[]).filter(t=>t.status!=="done" && t.status!=="someday" && !isDeferredAway(t));
  // Habits are their own thing now, not todos, so nothing here has to filter them
  // out - they simply are not in `todos`. `habits` is passed in so the sentence can
  // still name them, since they are real work even though they live elsewhere.
  const onNow = todayItems(todos||[]);
  const routinesLeft = (habits||[]).filter(habitDueToday).length;
  const overdue = onNow.filter(t=>isOverdue(t.due)).length;
  const rest = onNow.length - overdue;              // due today, starred, or deferred to today
  const horizon = todayKey(snzAddDays(HEADS_UP_DAYS));
  const incoming = open.filter(t=>t.due && t.due>TODAY() && t.due<=horizon)
                       .sort((a,b)=> a.due<b.due ? -1 : 1);

  const parts = [];
  // "for today", not "due today": `rest` counts starred and deferred-to-today items
  // that carry no due date at all, so "due" would be a lie. Settled 2026-08-09.
  if(overdue && rest)      parts.push(overdue+" overdue and "+rest+" for today.");
  else if(overdue)         parts.push(overdue+" overdue.");
  else if(rest)            parts.push(rest+" for today.");

  // Routines are named separately rather than folded in: they are real work, they just
  // live in their own card. Reads "2 overdue. 2 routines left." not "4 on you today".
  if(routinesLeft) parts.push(routinesLeft+" habit"+(routinesLeft===1?"":"s")+" left.");

  if(!parts.length){                                 // nothing on you right now
    if(incoming.length){
      const n = incoming[0];
      // Titles here are real ones ("Need priority waterfall with number of accounts...") -
      // clip so the glance stays one readable line instead of a paragraph.
      const name = n.title.length>44 ? n.title.slice(0,44).trim()+"..." : n.title;
      parts.push("You're clear today. Next up: "+name+", "+headsUpWhen(n.due)+".");
    } else {
      parts.push("Nothing due today or in the next week. You're clear.");
    }
  } else if(incoming.length){
    parts.push(incoming.length+" more land"+(incoming.length===1?"s":"")+" in the next week.");
  }

  // Reassurance is half the value: name a Space that has genuinely nothing coming.
  // Only when looking at everything, and only when exactly one is quiet - two or more
  // and the sentence stops being a sentence.
  if(activeSpace==="all" && Array.isArray(spaces) && spaces.length>1){
    const busy = new Set();
    onNow.concat(incoming).forEach(t=>{ if(t.space) busy.add(t.space); });
    const quiet = spaces.filter(s=>!s.archived && !busy.has(s.id));
    if(quiet.length===1) parts.push(quiet[0].name+" is quiet.");
  }
  return { line: parts.join(" "), overdue, onNow: onNow.length, incoming: incoming.length,
           tone: overdue ? "alert" : (onNow.length ? "busy" : "clear") };
}
function sortTodos(a,b){
  const q = quadWeight(a.quad)-quadWeight(b.quad); if(q) return q;
  if(a.due && b.due) return a.due<b.due?-1:1; if(a.due) return -1; if(b.due) return 1;
  return 0;
}
// Natural (pre-manual) sorts, used once to seed each item's manual `order`.
function sortIdeas(a,b){ return (b.capturedAt||"").localeCompare(a.capturedAt||""); }
const PROJ_STATUS_ORDER = { active:0, onhold:1, someday:2, done:3, archived:4 };
function sortProjects(a,b){ return (PROJ_STATUS_ORDER[a.status]||0)-(PROJ_STATUS_ORDER[b.status]||0); }
function sortGoals(a,b){ return 0; }  // keep existing array order
const NAT_CMP = { todos:sortTodos, ideas:sortIdeas, projects:sortProjects, goals:sortGoals };
// Manual order: what drag-to-reorder controls. All items get a numeric `order` (seeded once).
function byOrder(a,b){ return (a.order==null?0:a.order)-(b.order==null?0:b.order); }
// Persist a single moved item's new position as the midpoint between its new neighbors.
function reorderItem(store, file, movedId, idsInOrder, items){
  const byId = {}; items.forEach(x=>{ byId[x.id]=x; });
  const idx = idsInOrder.indexOf(movedId);
  if(idx<0) return;
  const prev = idx>0 ? byId[idsInOrder[idx-1]] : null;
  const next = idx<idsInOrder.length-1 ? byId[idsInOrder[idx+1]] : null;
  const po = prev && typeof prev.order==="number" ? prev.order : null;
  const no = next && typeof next.order==="number" ? next.order : null;
  let ord;
  if(po!=null && no!=null) ord = (po+no)/2;
  else if(po!=null) ord = po+1000;
  else if(no!=null) ord = no-1000;
  else ord = 0;
  store.upsert(file, { id:movedId, order:ord });
  log("SAVE","reorder "+file+" -> order "+ord);
}

/* ============================================================
   VIEW: TODAY  (+ entry to Now/Focus)
   ============================================================ */
/* Routines roll up into ONE card instead of a full-size card each. Deliberately still
   VISIBLE by default (collapsed-by-default would make an already-ignored thing invisible);
   the win is weight, not hiding. Today's COMPLETED routines stay listed so you can see
   what you have done - completing one drops it from todayItems and spawns tomorrow's
   copy, so without this the card would just shrink and you would lose the payoff. */
/* Habits expected today, in the active Space. Habits ride the meta object, NOT
   the space-scoped `data`, so the Space lens has to be applied by hand here. */
function habitsInSpace(store){
  const sp = store.activeSpace;
  return (store.habits||[]).filter(h => !sp || sp==="all" || (h.space||DEFAULT_SPACE)===sp);
}
function habitsForToday(store){
  return habitsInSpace(store).filter(h => habitExpectedOn(h.cadence, new Date()));
}
function RoutinesCard({ store, onOpen }){
  /* COLLAPSED BY DEFAULT (Chris, 2026-08-14: "I don't think I'm liking the habit
     card front and center"). It stays ABOVE the task list rather than moving below
     it: at the bottom, a busy day buries it and the daily prompt - the entire point
     of the card - is lost. Collapsed it is one slim row, which is not "front and
     centre" but is still seen and still one tap from ticking.
     The storage key changed from routinesOpen so the new default actually applies
     to devices that had already stored the old one. */
  const [open,setOpen] = useState(() => lsGet("habitsOpen", false));
  const toggle = () => { const v=!open; setOpen(v); lsSet("habitsOpen", v); };
  const rows = habitsForToday(store);
  const done = rows.filter(habitDoneToday).length;
  const pct  = rows.length ? Math.round((done/rows.length)*100) : 0;
  const all  = rows.length>0 && done === rows.length;
  // Ticking is REVERSIBLE now. A tick is just a date in a list, so un-ticking
  // removes it - there is no spawned copy to hunt down like the old routine todos.
  const tick = (h)=> store.saveHabits((store.habits||[]).map(x => x.id===h.id ? habitToggle(x) : x));
  if(!rows.length) return null;
  return (
    <div className="card" style={{marginTop:14,padding:"12px 14px"}}>
      <button onClick={toggle} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:0}}>
        <span style={{flex:1,textAlign:"left"}}>
          <b style={{fontFamily:"Fraunces",fontSize:15,display:"block"}}>Habits</b>
          <span className="hint">{all ? "All done today" : done+" of "+rows.length+" done"}</span>
        </span>
        <span className="chip" style={{flex:"0 0 auto",borderColor:all?"var(--green)":"var(--line-2)",color:all?"var(--green)":"var(--ink-2)"}}>
          {done}/{rows.length}
        </span>
        <span className="rt-chev" style={{transform:open?"rotate(180deg)":"none"}}>{Ic.chevron}</span>
      </button>
      {open &&
        <div style={{height:4,borderRadius:99,background:"var(--bg-3)",marginTop:10,overflow:"hidden"}}>
          <div style={{height:"100%",width:pct+"%",background:all?"var(--green)":"var(--blue)",transition:"width .3s"}}></div>
        </div>}
      {open && <div style={{marginTop:8}}>
        {rows.map(h=>{
          const isDone = habitDoneToday(h);
          const streak = habitStreak(h);
          return (
            <div key={h.id} className="rt-row">
              <button className={"rt-box"+(isDone?" on":"")} aria-label={isDone?"Done today - tap to undo":"Mark done"}
                onClick={()=>tick(h)}>{isDone?Ic.check:null}</button>
              <button className="rt-title" onClick={()=>onOpen(h)}
                style={{opacity:isDone?.6:1,textDecoration:isDone?"line-through":"none"}}>{h.name}</button>
              {streak>1 && <span className="hb-streak">{streak}d</span>}
            </div>
          );
        })}
      </div>}
    </div>
  );
}

/* ---- RADAR ------------------------------------------------------------------
   What's coming at you, as one picture. Overdue is a COUNT in the core; everything
   dated sits on one of three rings by how soon it lands. Colour is the Space.

   Blips are INTERMINGLED, not segregated into per-Space wedges. Angle carries no
   meaning at all here, which is exactly why it is free: each ring spreads its blips
   evenly around the whole circle, so a light week looks calm and a heavy one looks
   full. (Wedges wasted most of the canvas and made two items look lopsided.) Each
   ring also gets its own rotation offset so rings never line up into spokes.

   Size is uniform - a dot is a thing, not a quantity. Rings are discrete bands, not a
   continuous radius, because "further out = further off" is the only reading anyone
   actually makes.                                                                   */
const RADAR_CORE_R = 26;
// Rings sit well clear of the core - at r=46 the inner blips visually stuck to it - and
// the label lives at the BOTTOM of each ring. Stacked at 12 o'clock they read as a column
// of headings competing with the dots; along the bottom edge they recede into being what
// they are, axis marks.
// The spins are deliberately not multiples of each other and not axis-aligned: with a
// single ring holding two items an even sweep puts them at 3 and 9 o'clock, which reads
// as a pair of ears stuck on the core rather than as data.
const RADAR_RINGS = [
  { k:"today", label:"Today", r:52,  spin: 18 },
  { k:"week",  label:"Week",  r:76,  spin: 41 },
  { k:"later", label:"Later", r:100, spin: 65 },
];
const RADAR_HIT_R = 11.5;             // invisible tap circle around each blip
const RADAR_MAX   = 26;               // plotted individually; the rest become "+N more"
// Degrees kept clear at 6 o'clock for the ring labels. 26 was too narrow - the NEXT ring
// out sweeps close enough to the gap edge to sit on the label below it.
const RADAR_GAP   = 40;
// How many blips a ring can hold before their tap circles touch. Capacity rises with
// radius: two blips need 2*asin(hit/r) between them to clear, so a ring fits
// usable_arc / that_angle. Measured on the render: 13 inner, 19 middle, 25 outer.
function radarCapacity(r){
  const thetaMin = 2 * Math.asin(Math.min(1, RADAR_HIT_R / r)) * 180 / Math.PI;
  return Math.max(1, Math.floor((360 - RADAR_GAP) / thetaMin));
}
// The condensed "when" for the selection strip - a word where possible, a date otherwise.
function radarWhen(t){
  if(isOverdue(t.due)) return "Overdue";
  if(isToday(t.due)) return "Today";
  if(t.due === todayKey(snzAddDays(1))) return "Tomorrow";
  if(t.due) return fmtDate(t.due);
  return t.starredToday ? "Starred" : "";
}
// -1 = the overdue core (counted, not plotted); 0..2 = today / week / later.
function radarRing(t){
  if(isOverdue(t.due)) return -1;
  if(isToday(t.due) || t.starredToday || (t.defer && t.defer===TODAY())) return 0;
  if(t.due && t.due <= todayKey(snzAddDays(HEADS_UP_DAYS))) return 1;
  return 2;
}
// `hidden` (a Set of space ids) is the user's per-Space toggle; it filters the picture
// without touching the app-wide Space switcher.
function radarBlips(todos, offSpaces){
  const off = offSpaces || new Set();
  const open = (todos||[]).filter(t=>t.status!=="done" && t.status!=="someday" && !isDeferredAway(t))
    .filter(t=> t.due || t.starredToday)
    .filter(t=> !off.has(t.space||""));
  const rated = open.map(t=>({ t, ring:radarRing(t) }));
  const late = rated.filter(b=>b.ring===-1).map(b=>b.t)
    .sort((a,b)=> String(a.due||"").localeCompare(String(b.due||"")));   // oldest first
  const plottable = rated.filter(b=>b.ring>=0)
    .sort((a,b)=> (a.ring-b.ring) || String(a.t.due||"").localeCompare(String(b.t.due||"")));

  const cap = RADAR_RINGS.map(ring=>radarCapacity(ring.r));
  const per = [0,0,0], shown = [];
  let over = 0;
  plottable.forEach(b=>{
    per[b.ring]++;
    if(per[b.ring]<=cap[b.ring] && shown.length<RADAR_MAX) shown.push(b); else over++;
  });
  return { shown, hidden:over, late };
}
function RadarCard({ store, onOpen, style }){
  const spaceList = (store.spaces||[]).filter(s=>!s.archived).slice()
    .sort((a,b)=>(a.order||0)-(b.order||0));
  // Per-Space visibility, independent of the app-wide Space switcher, so you can mute
  // half the picture without leaving the "All" view. Persisted per device.
  const [off,setOff] = useState(()=> new Set(lsGet("rdOff", []) || []));
  const toggleSpace = (id)=>{
    const next = new Set(off);
    if(next.has(id)) next.delete(id); else next.add(id);
    if(next.size >= spaceList.length) next.delete(id);      // never mute everything
    setOff(next); lsSet("rdOff", [...next]);
  };
  const colorOf = {}; spaceList.forEach(s=>{ colorOf[s.id]=s.color; });

  const { shown, hidden, late } = radarBlips(store.data.todos, off);
  const CX=120, CY=120;

  // Tapping a dot IDENTIFIES it; the strip underneath is what opens it. A dot carries no
  // text, so jumping straight into the editor meant leaving the dashboard just to find out
  // which one you hit. Held by id, so an item that gets completed or filtered away simply
  // drops the selection instead of stranding a stale label.
  const [selId,setSelId] = useState(null);
  const sel = selId ? (shown.find(b=>b.t.id===selId) || late.find(t=>t.id===selId)) : null;
  const selTodo = sel ? (sel.t || sel) : null;
  const pick = (t)=> setSelId(cur => cur===t.id ? null : t.id);

  // Spread each ring's blips evenly around the WHOLE circle - Spaces intermingle, they
  // are not penned into wedges. RADAR_GAP of arc is left clear at 12 o'clock so the ring
  // labels always have air, and each ring carries its own rotation so the rings never
  // line up into spokes.
  const byRing = [[],[],[]];
  shown.forEach(b=>byRing[b.ring].push(b));
  const placed = [];
  byRing.forEach((grp,ri)=>{
    const n = grp.length; if(!n) return;
    const ring = RADAR_RINGS[ri], arc = 360 - RADAR_GAP;
    grp.forEach((b,i)=>{
      // The sweep starts just past the 6 o'clock gap the labels occupy. `spin` must wrap
      // INSIDE that arc - adding it to the start angle instead rotates the gap itself,
      // so every ring's clear zone lands somewhere different and dots sweep over the
      // labels. (That was a real bug, caught by measuring label boxes against dots.)
      const t = (ring.spin + arc*((i+0.5)/n)) % arc;
      const a = (90 + RADAR_GAP/2 + t) * Math.PI/180;
      placed.push({ ...b, x: CX + ring.r*Math.cos(a), y: CY + ring.r*Math.sin(a),
        color: colorOf[b.t.space] || "var(--amber)" });
    });
  });
  return (
    <div className="card" style={{marginTop:16, ...(style||{})}}>
      <div className="topbar-row" style={{alignItems:"center",marginBottom:2}}>
        <div className="label">Radar</div>
        {hidden>0 && <span className="hint" style={{marginLeft:"auto"}}>+{hidden} more</span>}
      </div>
      {(placed.length===0 && !late.length)
        ? <p className="hint" style={{margin:"10px 0 2px"}}>
            {off.size>0 ? "Nothing showing for the Spaces you have on."
                        : "Nothing dated on the radar. Give something a due date and it shows up here."}</p>
        : <svg viewBox="0 0 240 240" className="radar" style={{maxWidth:300}} role="img"
            aria-label={"Radar. "+(late.length?late.length+" overdue at the centre. ":"No overdue items. ")
              +placed.length+" upcoming items on rings by how soon they are due."}>
            {RADAR_RINGS.map((ring,ri)=>(
              <circle key={ring.k} className={"rdr-ring"+(byRing[ri].length?" live":"")}
                cx={CX} cy={CY} r={ring.r+12}/>
            ))}
            {RADAR_RINGS.map((ring,ri)=>(
              <text key={ring.k} className={"rdr-label"+(byRing[ri].length?" live":"")}
                x={CX} y={CY+ring.r+15} textAnchor="middle">{ring.label.toUpperCase()}</text>
            ))}
            {/* The core: overdue as a number. Dots that close cannot be told apart or
                reliably tapped, and a count can never overlap itself. Tapping steps
                through the late items one at a time in the strip below. */}
            <g style={{cursor: late.length?"pointer":"default"}}
               onClick={()=>{ if(!late.length) return;
                 const i = late.findIndex(t=>t.id===selId);
                 setSelId(late[(i+1) % late.length].id); }}>
              <circle cx={CX} cy={CY} r={RADAR_CORE_R}
                fill={late.length?"var(--red)":"transparent"}
                stroke={late.length?"var(--red)":"var(--line-2)"} strokeWidth="1"
                opacity={late.length?0.92:0.5}/>
              {late.length>0 && <>
                <text className="rdr-core-n" x={CX} y={CY+1} textAnchor="middle">{late.length}</text>
                <text className="rdr-core-l" x={CX} y={CY+12} textAnchor="middle">LATE</text>
                <title>{late.length===1 ? "1 overdue item" : late.length+" overdue items"}</title>
              </>}
            </g>
            {/* Each dot carries an invisible tap circle far larger than the dot itself -
                a 12-unit dot is not a hittable target on a phone. */}
            {placed.map(b=>(
              <g key={b.t.id} style={{cursor:"pointer"}} onClick={()=>pick(b.t)}>
                <circle className="rdr-hit" cx={b.x} cy={b.y} r={RADAR_HIT_R}/>
                {selId===b.t.id && <circle className="rdr-halo" cx={b.x} cy={b.y} r="10"/>}
                <circle className="rdr-blip" cx={b.x} cy={b.y} r="6" fill={b.color}
                  pointerEvents="none"/>
                <title>{b.t.title}</title>
              </g>
            ))}
          </svg>}
      {selTodo &&
        <button className="rd-sel" onClick={()=>onOpen&&onOpen(selTodo)}>
          <span className="rd-dot" style={{background: colorOf[selTodo.space] || "var(--amber)"}}/>
          <span className="rd-sel-t">{selTodo.title}</span>
          <span className={"rd-sel-m"+(isOverdue(selTodo.due)?" late":"")}>{radarWhen(selTodo)}</span>
          <span className="rd-sel-go">Open</span>
        </button>}
      {spaceList.length>1 &&
        <div className="rd-toggles">
          {spaceList.map(s=>{
            const on = !off.has(s.id);
            return (
              <button key={s.id} className={"rd-tog"+(on?" on":" off")}
                aria-pressed={on} onClick={()=>toggleSpace(s.id)}>
                <span className="rd-dot" style={{background:s.color}}/>{s.name}
              </button>
            );
          })}
        </div>}
      {/* Four lines of instructions on a glance tile defeats the point - the chips and the
          colours explain themselves after one tap. */}
      <p className="hint" style={{marginTop:8,marginBottom:0}}>
        Overdue in the middle, then out by how soon. Tap a dot to see what it is
        {late.length>1?", or the centre to step through what's late":""}.</p>
    </div>
  );
}

// The glance. One sentence, read in two seconds, before you decide to open anything.
/* "Coming up": upcoming calendar events that have open work attached to them.
   Built ENTIRELY from the snapshots stored on the items, so it needs no network
   call, works offline, and cannot be blanked by a calendar outage. The cost is
   that a trip rescheduled since you last opened its picker shows its old date
   until you open the picker again.

   It self-selects what counts as a "trip": an event appears only once you have
   attached something to it, so the 10am call you never touched never shows up
   and nothing has to classify events by type. */
function comingUp(data){
  const todos = (data.todos||[]).filter(t=>t.status!=="done");
  const projects = (data.projects||[]).filter(p=>p.status!=="done" && p.status!=="archived");
  // A todo carrying its OWN link is counted directly, so exclude it from its
  // project's tally or the same work lands on the card twice.
  const openInProject = {};
  todos.forEach(t=>{ if(t.projectId && !t.event) openInProject[t.projectId]=(openInProject[t.projectId]||0)+1; });

  const groups = new Map();
  const add = (link, n)=>{
    const k = eventLinkKey(link); if(!k || !n) return;
    const g = groups.get(k) || { link, open:0 };
    g.open += n; groups.set(k, g);
  };
  todos.forEach(t=>{ if(t.event) add(t.event, 1); });
  projects.forEach(p=>{ if(p.event) add(p.event, openInProject[p.id]||0); });

  const today = new Date(); today.setHours(0,0,0,0);
  return Array.from(groups.values())
    // end||start keeps a multi-day trip on the card WHILE you are on it.
    .filter(g=>{ const ms = Date.parse(g.link.end || g.link.start); return ms && ms >= today.getTime(); })
    .sort((a,b)=> String(a.link.start||"").localeCompare(String(b.link.start||"")));
}
function ComingUpCard({ store, style }){
  const rows = comingUp(store.data);
  if(!rows.length) return null;                       // silent until you attach something
  const shown = rows.slice(0,5);
  return (
    <div className="card" style={{marginTop:14, ...(style||{})}}>
      <div className="eyebrow" style={{marginBottom:6}}>Coming up</div>
      {shown.map(g=>
        <div key={eventLinkKey(g.link)} className="cu-row">
          <span className="cu-name">{g.link.title || "Calendar event"}</span>
          <span className="cu-when">{eventUntilLabel(g.link.start)}</span>
          <span className="cu-open">{g.open} open</span>
        </div>)}
      {rows.length>shown.length &&
        <p className="hint" style={{marginTop:8}}>+{rows.length-shown.length} more with work attached.</p>}
    </div>
  );
}
/* Which wins the user has already seen. Device-local on purpose: this is a UI
   nicety, not user data, and syncing it would mean a new meta slice (and the
   signOut contract that goes with it) for something that does not matter if a
   second device shows the line once more. */
function winsSeen(){ return lsGet("winsSeen", {}) || {}; }
function unseenWins(wins){
  const seen = winsSeen();
  return wins.filter(w => !seen[w.key] || String(seen[w.key]) < String(w.at||""));
}
function markWinsSeen(wins){
  const seen = winsSeen();
  wins.forEach(w => { seen[w.key] = w.at || TODAY(); });
  lsSet("winsSeen", seen);
}

/* Wins are unscoped by Space on purpose - recognition is personal and a
   Space-filtered trophy case would read as a partial record. Same reasoning as
   Export and the home-screen badge, both of which also use allData. */
function storeWins(store){ return computeWins(store.allData, store.habits, store.rundown); }

/* One line on the Dashboard, ONLY while something is unseen. This is the whole
   compromise on nagging: without it the Wins screen is one nobody remembers
   exists; as permanent chrome it becomes something you learn to scroll past. */
function NewWinLine({ store, go }){
  const fresh = unseenWins(storeWins(store));
  if(!fresh.length) return null;
  const w = fresh[0];
  return (
    <button className="card" onClick={()=>go("wins")}
      style={{marginTop:14,display:"flex",gap:10,alignItems:"center",width:"100%",textAlign:"left",
              borderColor:"var(--amber-line)",background:"var(--amber-dim)"}}>
      <span className="win-mark">{fresh.length>1?fresh.length:"★"}</span>
      <span style={{flex:1,minWidth:0}}>
        <b style={{fontFamily:"Fraunces",fontSize:15,display:"block"}}>{w.title}</b>
        <span className="hint">{w.detail}{fresh.length>1?" and "+(fresh.length-1)+" more":""}</span>
      </span>
    </button>
  );
}

function WinsView({ store, back }){
  const wins = storeWins(store);
  const rec = computeRecords(store.habits);
  // Seen-marking happens on open, which is the only moment we know he looked.
  useEffect(()=>{ markWinsSeen(wins); }, []);   // eslint-disable-line
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <button className="btn btn-ghost btn-sm" onClick={back}>{Ic.back} Back</button>
        <h1 className="title" style={{marginTop:8}}>Wins</h1>
        <div className="subtle" style={{marginTop:2}}>What you've actually pulled off</div>
      </div>

      <div className="rec-grid" style={{marginTop:14}}>
        <div className="rec-cell">
          <div className="rec-num">{rec.bestStreak}</div>
          <div className="hint">longest streak{rec.bestHabit?" - "+rec.bestHabit:""}</div>
        </div>
        <div className="rec-cell">
          <div className="rec-num">{rec.totalDays}</div>
          <div className="hint">habit days logged</div>
        </div>
      </div>

      {wins.length===0
        ? <Empty glyph={"★"} title="Nothing yet"
            sub="Wins are earned by things that are hard or slow - a habit held for a week, a project finished, something long overdue finally cleared."/>
        : <div className="card" style={{marginTop:14}}>
            {wins.map(w=>
              <div key={w.key} className="win-row">
                <span className="win-mark">{w.count>1?w.count:"★"}</span>
                <span className="win-body">
                  <span className="win-title">{w.title}</span>
                  <span className="win-detail">{w.detail}</span>
                </span>
                <span className="win-when">{w.at?fmtDate(w.at):""}</span>
              </div>)}
          </div>}

      <p className="hint" style={{marginTop:12}}>Wins are worked out from your existing history, so nothing is
        stored and nothing can be lost. There are no points and no levels - a win means something happened
        that was hard or that took a long time.</p>
    </div>
  );
}

/* One line at the top of Today. Renders nothing at all until there is something
   to say - an empty affirmation slot would be worse than no affirmations. */
function AffirmationLine({ store }){
  const a = affirmationOfTheDay(store.affirmations, TODAY());
  if(!a) return null;
  return <p className="affirm">{a.text}</p>;
}

/* Dashboard line, shown ONLY when an order needs a look: late, gone quiet, or
   flagged as a problem. Something simply on its way is not worth interrupting
   the Dashboard for; that is what the Orders screen is for. */
function OrdersNeedsLookLine({ store, go }){
  const sum = ordersSummary(ordersInSpace(store), TODAY());
  if(!sum.needsLook) return null;
  const parts = [];
  if(sum.late) parts.push(sum.late + " late");
  if(sum.stale) parts.push(sum.stale + " gone quiet");
  if(sum.problem) parts.push(sum.problem + " with a problem");
  return (
    <button className="card" onClick={()=>go("orders")}
      style={{marginTop:14,display:"flex",gap:10,alignItems:"center",width:"100%",textAlign:"left",borderColor:"var(--red)"}}>
      <span style={{flex:1,minWidth:0}}>
        <b style={{fontFamily:"Fraunces",fontSize:15,display:"block"}}>
          {sum.needsLook === 1 ? "An order needs a look" : sum.needsLook + " orders need a look"}</b>
        <span className="hint">{parts.join(", ")}</span>
      </span>
    </button>
  );
}

function OrdersView({ store, back, toast }){
  const [edit,setEdit] = useState(null);          // an order, or {} for a new one
  const [capture,setCapture] = useState(false);
  const [showClosed,setShowClosed] = useState(false);
  const today = TODAY();
  const ranked = ordersByUrgency(ordersInSpace(store), today);
  const look = ranked.filter(r => r.st.bucket === "late" || r.st.bucket === "stale" || r.st.bucket === "problem");
  const coming = ranked.filter(r => r.st.bucket === "soon" || r.st.bucket === "upcoming" || r.st.bucket === "undated");
  const closed = ranked.filter(r => r.st.bucket === "closed")
    .sort((a, b) => String(b.o.arrivedAt || b.o.orderedAt).localeCompare(String(a.o.arrivedAt || a.o.orderedAt)));
  function markArrived(o){
    store.saveOrders((store.orders || []).map(x => x.id === o.id ? cleanOrder({ ...x, status:"arrived", arrivedAt:today }) : x));
    toast && toast("Marked arrived");
  }
  const rows = (list) => <div className="list" style={{marginTop:8}}>{list.map(r =>
    <OrderRow key={r.o.id} o={r.o} st={r.st} onOpen={()=>setEdit(r.o)} onArrived={()=>markArrived(r.o)}/>)}</div>;
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <button className="btn btn-ghost btn-sm" onClick={back}>{Ic.back} Back</button>
        <h1 className="title" style={{marginTop:8}}>Orders</h1>
        <div className="subtle" style={{marginTop:2}}>What's on its way, and what never showed up</div>
      </div>
      <div className="row" style={{marginTop:14,gap:8}}>
        <button className="btn btn-primary" style={{flex:1}} onClick={()=>setCapture(true)}>{Ic.camera} Screenshot</button>
        <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setEdit({})}>{Ic.plus} Add by hand</button>
      </div>
      {look.length > 0 && <div style={{marginTop:18}}><div className="label">Needs a look</div>{rows(look)}</div>}
      {coming.length > 0 && <div style={{marginTop:18}}><div className="label">On the way</div>{rows(coming)}</div>}
      {look.length === 0 && coming.length === 0 &&
        <Empty glyph={"✉"} title="Nothing on its way"
          sub="Screenshot an order confirmation and it lands here, so you can see what is late or never came."/>}
      {closed.length > 0 &&

function OrderSheet({ store, order, onClose, toast }){
  const isNew = !order.id;
  const defaultSpace = store.activeSpace && store.activeSpace !== "all" ? store.activeSpace : (store.defaultSpace || DEFAULT_SPACE);
  const [f,setF] = useState(() => ({ merchant:"", item:"", orderedAt:TODAY(), expectedBy:"", cost:"", ref:"",
    note:"", status:"ordered", space:defaultSpace, ...order }));
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  function save(){
    const o = cleanOrder(f);
    if(!o){ toast && toast("Give it a name or a store first"); return; }
    const list = store.orders || [];
    store.saveOrders(isNew ? list.concat([o]) : list.map(x => x.id === o.id ? o : x));
    toast && toast(isNew ? "Order added" : "Saved");
    onClose();
  }
  function del(){
    store.saveOrders((store.orders || []).filter(x => x.id !== order.id));
    toast && toast("Order deleted");
    onClose();
  }
  return (
    <Sheet title={isNew ? "New order" : "Order"} onClose={onClose}
      action={<button className="btn btn-primary btn-sm" onClick={save}>{isNew ? "Add" : "Save"}</button>}>
      <div className="title-field"><span className="label">What</span>
        <input className="title-input" value={f.item} onChange={set("item")} placeholder="e.g. Standing desk" autoFocus/></div>
      <div className="field"><span className="label">From</span>
        <input className="input" value={f.merchant} onChange={set("merchant")} placeholder="Store"/></div>
      <div className="row">
        <div className="field" style={{flex:1,minWidth:0}}><span className="label">Ordered</span>
          <input className="input" type="date" value={f.orderedAt} onChange={set("orderedAt")}/></div>
        <div className="field" style={{flex:1,minWidth:0}}><span className="label">Expected by</span>
          <input className="input" type="date" value={f.expectedBy} onChange={set("expectedBy")}/></div>
      </div>
      <div className="row">
        <div className="field" style={{flex:1,minWidth:0}}><span className="label">Cost</span>
          <input className="input" value={f.cost} onChange={set("cost")} placeholder="$0.00"/></div>
        <div className="field" style={{flex:1,minWidth:0}}><span className="label">Order number</span>
          <input className="input" value={f.ref} onChange={set("ref")}/></div>
      </div>
      <div className="field"><span className="label">Status</span>
        <select className="select" value={f.status} onChange={set("status")}>
          {Object.keys(ORDER_STATUSES).map(k => <option key={k} value={k}>{ORDER_STATUSES[k]}</option>)}
        </select></div>
      <div className="field"><span className="label">Note</span>
        <input className="input" value={f.note} onChange={set("note")} placeholder="Wrong size, refund requested..."/></div>
      <SpaceField store={store} value={f.space} onChange={(v)=>setF({ ...f, space:v })}/>
      {!isNew && <button className="btn btn-ghost btn-block" style={{marginTop:10,color:"var(--red)"}} onClick={del}>Delete order</button>}
    </Sheet>
  );
}

/* Screenshot, then the model's reading, then Chris reviews and edits, then save.
   Review is mandatory: a misread delivery date would create a false "late", the
   one kind of noise that teaches you to stop looking at this screen. */
function OrderCaptureSheet({ store, onClose, toast }){
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");
  const [found,setFound] = useState(null);        // null = nothing read yet
  const fileRef = useRef(null);
  const today = TODAY();
  const space = store.activeSpace && store.activeSpace !== "all" ? store.activeSpace : (store.defaultSpace || DEFAULT_SPACE);
  async function read(file){
    if(!file) return;
    setBusy(true); setErr("");
    try{
      const b64 = await resizeImage(file);
      const raw = await claudeExtract([
        { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:b64 } },
        { type:"text", text:"TODAY is " + today + ". Read this order confirmation." }
      ], ORDER_EXTRACT_SYSTEM);
      const orders = normalizeExtractedOrders(raw, today).map(o => ({ ...o, space }));
      if(!orders.length) setErr("Couldn't find an order in that image. You can add it by hand on the Orders screen.");
      setFound(orders);
    }catch(e){ setErr(e.message || "Couldn't read that image."); }
    finally{ setBusy(false); }
  }
  const upd = (id, k, v) => setFound(found.map(o => o.id === id ? { ...o, [k]: v } : o));
  function saveAll(){
    const clean = (found || []).map(cleanOrder).filter(Boolean);
    if(!clean.length) return;
    store.saveOrders((store.orders || []).concat(clean));
    toast && toast(clean.length === 1 ? "Order added" : clean.length + " orders added");
    onClose();
  }
  return (
    <Sheet title="Read a screenshot" onClose={onClose}>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}}
        onChange={(e)=>{ const f = e.target.files && e.target.files[0]; e.target.value = ""; read(f); }}/>
      {!found && <p className="hint" style={{marginTop:0}}>Pick a screenshot of an order confirmation or shipping email.
        You'll check what it read before anything is saved.</p>}
      <button className="btn btn-primary btn-block" disabled={busy} onClick={()=>fileRef.current && fileRef.current.click()}>
        {busy ? "Reading..." : found ? "Read a different screenshot" : "Choose screenshot"}</button>
      {err && <p className="hint" style={{color:"var(--red)"}}>{err}</p>}
      {found && found.length > 0 && <div style={{marginTop:12}}>
        {found.map(o =>
          <div key={o.id} className="card ord-review" style={{marginTop:10,padding:"10px 12px"}}>
            <div className="field"><span className="label">What</span>
              <input className="input" value={o.item} onChange={(e)=>upd(o.id, "item", e.target.value)}/></div>
            <div className="row">
              <div className="field" style={{flex:1,minWidth:0}}><span className="label">From</span>
                <input className="input" value={o.merchant} onChange={(e)=>upd(o.id, "merchant", e.target.value)}/></div>
              <div className="field" style={{flex:1,minWidth:0}}><span className="label">Cost</span>
                <input className="input" value={o.cost} onChange={(e)=>upd(o.id, "cost", e.target.value)}/></div>
            </div>
            <div className="field"><span className="label">Expected by</span>
              <input className="input" type="date" value={o.expectedBy} onChange={(e)=>upd(o.id, "expectedBy", e.target.value)}/></div>
            {!o.expectedBy && <p className="hint" style={{marginTop:-6}}>No delivery date on the screenshot.
              It will be flagged if nothing arrives within {ORDER_STALE_DAYS} days.</p>}
            <button className="btn btn-ghost btn-block" style={{color:"var(--red)"}}
              onClick={()=>setFound(found.filter(x => x.id !== o.id))}>Don't save this one</button>
          </div>)}
        <button className="btn btn-primary btn-block" style={{marginTop:12}} onClick={saveAll}>
          {found.length === 1 ? "Save order" : "Save " + found.length + " orders"}</button>
      </div>}
    </Sheet>
  );
}

function HeadsUpCard({ store, style }){

      background: alert?"var(--amber-dim)":"var(--bg-2)", ...(style||{})}}>
      <div className="eyebrow" style={{marginBottom:6}}>Heads up</div>
