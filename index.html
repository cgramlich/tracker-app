/* ── Event links: attaching owned work to a read-only calendar event ─────────
   A todo or project may point at ONE calendar event. The feed stays strictly
   read-only - nothing is ever written back to Google. The link lives on the
   item and points outward.

   The stored link carries a SNAPSHOT (title/end/allDay) as well as identity
   (uid/start), and that is the load-bearing part. Events are server-fetched, in
   a 90-day window, online; todos are local and offline-first. Without the
   snapshot a linked todo would render "attached to nothing" whenever you are
   offline or the trip is outside the window. */
function eventLinkFrom(ev){
  if(!ev) return null;
  return { uid:String(ev.uid||""), start:String(ev.start||""), title:String(ev.title||""),
           end:String(ev.end||""), allDay: !!(ev.all_day || ev.allDay) };
}
function cleanEventLink(l){
  if(!l) return null;
  const start = String(l.start||"").trim(), title = String(l.title||"").trim();
  if(!start && !title) return null;            // nothing to identify OR display
  return { uid:String(l.uid||"").trim(), start, title,
           end:String(l.end||"").trim(), allDay:!!l.allDay };
}
/* Resolve a stored link against the live (merged) event list. Matching mirrors
   mergeCalendarEvents: uid|start, then title|start, then uid alone.
   The third pass is what lets a RESCHEDULED trip carry its todos with it.
   Returns null when the event is not in the list we happen to be holding, which
   means offline or out-of-window far more often than deleted - so callers must
   fall back to the snapshot and MUST NOT drop the link. */
function resolveEventLink(link, events){
  if(!link) return null;
  const list = events || [];
  const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
  let hit = link.uid && list.find(e => e.uid===link.uid && e.start===link.start);
  if(hit) return { event:hit, moved:false };
  hit = list.find(e => norm(e.title)===norm(link.title) && e.start===link.start);
  if(hit) return { event:hit, moved:false };
  if(link.uid){
    const same = list.filter(e => e.uid===link.uid);
    if(same.length){
      const at = Date.parse(link.start) || 0;
      same.sort((a,b)=> Math.abs((Date.parse(a.start)||0)-at) - Math.abs((Date.parse(b.start)||0)-at));
      return { event:same[0], moved: same[0].start!==link.start };
    }
  }
  return null;
}
// One key per event, used to group items that point at the same thing.
function eventLinkKey(l){ return l ? (String(l.uid||"")+"|"+String(l.start||"")+"|"+String(l.title||"").toLowerCase()) : ""; }
// "today" / "tomorrow" / "in 9 days" / "9 days ago". Ordinal, not a timestamp.
function eventUntilLabel(startISO){
  const ms = Date.parse(startISO); if(!ms) return "";
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const d1 = new Date(ms); d1.setHours(0,0,0,0);
  const n = Math.round((d1-d0)/86400000);
  if(n===0) return "today";
  if(n===1) return "tomorrow";
  if(n===-1) return "yesterday";
  return n>0 ? "in "+n+" days" : Math.abs(n)+" days ago";
}

/* Shared by the Calendar view AND the Dashboard card, so both dedupe and format
   identically - one implementation, no drift. */

// The same meeting often sits on two calendars. Merge those into ONE row carrying
// BOTH calendars. Title+start is the PRIMARY key: the same meeting on two different
// SYSTEMS (Outlook/Teams vs Google) has DIFFERENT UIDs, so a uid-first match would
// never merge them. uid+start is a second signal (an invite titled differently on
// each side) - and it MUST include start, because a recurring series shares ONE uid
// across every occurrence and a bare-uid match would collapse the whole series.
function mergeCalendarEvents(list){
  const norm = (s)=> String(s||"").trim().toLowerCase().replace(/\s+/g," ");
  const byKey = new Map(), byUid = new Map(), out = [];
  (list||[]).forEach(ev=>{
    const k  = norm(ev.title)+"|"+(ev.start||"");
    const uk = ev.uid ? (ev.uid+"|"+(ev.start||"")) : null;
    const hit = byKey.get(k) || (uk ? byUid.get(uk) : null);
    if(hit){
      if(hit.feedIds.indexOf(ev.feed_id) < 0){ hit.feedIds.push(ev.feed_id); hit.colors.push(ev.color||"#6f9bc4"); }
      if(!hit.location && ev.location) hit.location = ev.location;
      if(!hit.end && ev.end) hit.end = ev.end;
      if(!byKey.has(k)) byKey.set(k, hit);
      if(uk && !byUid.has(uk)) byUid.set(uk, hit);
      return;
    }
    const row = { ...ev, feedIds:[ev.feed_id], colors:[ev.color||"#6f9bc4"] };
    byKey.set(k, row);
    if(uk) byUid.set(uk, row);
    out.push(row);
  });
  return out;
}

// Flag every TIMED event that overlaps another timed event, so the UI can badge it as a
// conflict. All-day entries (PTO, birthdays) are context rather than a booking, so they
// never create a conflict - otherwise a single PTO day would flag everything on it.
// Touching edges (10:00-10:30 then 10:30-11:00) are back-to-back, NOT a conflict.
function markConflicts(list){
  const timed = (list||[]).filter(e=>!e.all_day && e.start && e.end);
  const span  = timed.map(e=>[+new Date(e.start), +new Date(e.end)]);
  timed.forEach((a,i)=>{
    const [as,ae] = span[i];
    a.conflict = timed.some((b,j)=> j!==i && as < span[j][1] && span[j][0] < ae);
  });
  return list;
}

// Calendar color dots for an event (one per calendar it appears on). The dots live in an
// inline-flex wrapper so the gap BETWEEN them is uniform and there is a single consistent
// gap before the title. Hand-rolled per-dot margins made a merged 2-dot event look uneven.
function CalDots({ colors }){
  const list = (colors||[]).filter(Boolean).slice(0,4);
  if(!list.length) return null;
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:3,verticalAlign:"middle",marginRight:6}}>
      {list.map((c,i)=><span key={i} className="space-dot" style={{background:c}}></span>)}
    </span>
  );
}

// "All day", "9:00 AM - 9:30 AM", or "10:00 PM - Jul 20" when it crosses a day.
function fmtEventTime(ev){
  if(ev.all_day) return "All day";
  try{
    const hhmm = (d)=> d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    const d = new Date(ev.start);
    let s = hhmm(d);
    if(ev.end){
      const e2 = new Date(ev.end);
      s += todayKey(e2)!==todayKey(d) ? (" - "+fmtDate(todayKey(e2))) : (" - "+hhmm(e2));
    }
    return s;
  }catch(_){ return ""; }
}

const EXTRACT_SYSTEM =
  "You convert messy input into a clean list of actionable items for a GTD tracker. "+

  "A multi-step outcome is a project; a raw thought to sit on is an idea; a single action is a todo. "+

function stripFences(s){ return String(s).replace(/```json/gi,"").replace(/```/g,"").trim(); }

async function claudeExtract(content, system){
  // content is the messages[0].content array (text and/or image blocks)

        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({

        model: "claude-sonnet-4-6",        // advisory; server has the final say
        max_tokens: 16000,                 // generous: OCR output can be large (Dining Log lesson)
        system: system || EXTRACT_SYSTEM,  // a caller may supply its own reading instructions (orders)
        messages:[{ role:"user", content }]

    });
    if(!r.ok){ const t=await r.text(); log("ERROR","relay extract "+r.status+" "+t.slice(0,200));
      if(r.status===401) throw new Error("Session expired - sign in again.");
      if(r.status===429) throw new Error("AI is at its limit for now. Try again later.");
      if(r.status===402) throw new Error("You've used this month's AI allowance. It resets on the 1st.");
      if(r.status===503) throw new Error("AI is temporarily unavailable.");
      throw new Error("AI error "+r.status+"."); }
    const j = await r.json();
    if(j.stop_reason === "max_tokens"){ // truncated -> guide user instead of JSON parse crash
      log("AI","stop_reason max_tokens (truncated)");
      throw new Error("That was too large to read in one pass. Try fewer lines or scan a smaller section.");
    }
    const text = (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    log("AI","raw len="+text.length);
    let arr;
    try { arr = JSON.parse(stripFences(text)); }
    catch(e){ log("ERROR","JSON parse: "+e.message+" :: "+text.slice(0,120)); throw new Error("Could not read structured items back. Try again."); }
    if(!Array.isArray(arr)) throw new Error("Unexpected response shape.");
    log("AI","extracted "+arr.length+" items");
    return arr;
  }catch(e){ log("ERROR","claudeExtract: "+e.message); throw e; }
}

// Step 1: question -> date window. Falls back to today..+6 months on any failure,
// so a bad parse never blocks the question.
async function calInferWindow(question, history){
  const today = TODAY();
  const system = "You turn a question about someone's calendar into the date window that must be examined. "
    + "Today is " + today + ". Reply with ONLY a JSON object: {\"start\":\"YYYY-MM-DD\",\"end\":\"YYYY-MM-DD\"}. "
    + "Rules: a named month means that whole month (this year, or next year if it has already passed); "
    + "an open-ended lookup like \"my next X\" means today through today plus 6 months; "
    + "\"tomorrow\" / \"this week\" / \"next week\" mean exactly that range; a question about the past uses that past range. "
    + "If the new question is a FOLLOW-UP that refines an earlier search (e.g. naming a specific person "
    + "or event to look for), keep a window consistent with that earlier search rather than starting over. "
    + "Never span more than 12 months. Output JSON only, no prose.";
  const convo = (history||[]).filter(m=>m.role==="user"||m.role==="assistant").slice(-4)
    .map(m=>(m.role==="user"?"User: ":"Assistant: ")+m.text).join("\n");
  const content = convo ? ("Conversation so far:\n"+convo+"\n\nNew question: "+question) : question;
  let txt = "";
  try{ txt = await aiRelay({ task:"calendar_window", model:"claude-haiku-4-5", max_tokens:200, system,
                             messages:[{ role:"user", content }] }); }
  catch(e){ log("AI","window inference failed: "+e.message); }
  let s=null, e2=null;
  const m = txt && txt.match(/\{[\s\S]*\}/);
  if(m){ try{ const j=JSON.parse(m[0]);
    if(/^\d{4}-\d{2}-\d{2}$/.test(j.start||"")) s=j.start;
    if(/^\d{4}-\d{2}-\d{2}$/.test(j.end||""))   e2=j.end;
  }catch(_){ } }
  if(!s || !e2 || e2 <= s){ const f=new Date(); f.setMonth(f.getMonth()+6); s=today; e2=todayKey(f); }
  log("AI","calendar window "+s+" -> "+e2);
  return { start:s, end:e2 };
}

// Step 2: answer, grounded strictly in the events we actually fetched. `history` carries
// the prior turns so follow-ups work ("no dentist found" -> "look for Dr Robinson, that's
// my dentist") - the model keeps the thread AND gets the events re-supplied each turn.
async function calAnswer(question, win, scopeLabel, eventLines, count, history){
  const wd = new Date(TODAY()+"T00:00:00").toLocaleDateString(undefined,{weekday:"long"});
  const system = "You answer questions about the user's calendar. Today is " + TODAY() + " (" + wd + "). "
    + "Use ONLY the events provided - never invent or assume events. Be concise and specific: name real events and dates. "
    + "If asked about free time, find gaps with NO events and say exactly which dates are free, accounting for weekends. "
    + "This is a CONVERSATION: the user may correct or refine you (for example telling you that a "
    + "particular person or event name IS the thing they were looking for). Take that at face value, "
    + "re-scan the supplied events with it, and answer again. "
    + "If the provided events do not answer the question, say so plainly and suggest a wider window "
    + "or ask what the event might be called. Plain text, no markdown headers.";
  const user = "Question: " + question
    + "\n\nWindow examined: " + win.start + " to " + win.end + " (" + scopeLabel + ", " + count + " events)"
    + "\n\nEvents:\n" + (eventLines || "(no events in this window)");
  // Prior turns first (UI-only "sys" notes excluded). Drop a trailing user turn so the
  // roles stay alternating when we append the new question.
  const prior = (history||[]).filter(m=>m.role==="user"||m.role==="assistant").slice(-6);
  while(prior.length && prior[prior.length-1].role==="user") prior.pop();
  const messages = prior.map(m=>({ role:m.role, content:m.text }));
  messages.push({ role:"user", content:user });
  return aiRelay({ task:"calendar_qa", model:"claude-sonnet-4-6", max_tokens:900, system, messages });
}

// Build a compact snapshot of current data for the organizer's context.
function organizeSnapshot(store){
  const d = store.data;
  const todo = (d.todos||[]).filter(t=>t.status!=="done").map(t=>({ id:t.id, title:t.title, status:t.status, type:t.type||"", quad:t.quad||"", due:t.due||"", projectId:t.projectId||"", location:t.location||"" }));
  const projects = (d.projects||[]).map(p=>({ id:p.id, name:p.name, status:p.status, type:p.type||"" }));
  const goals = (d.goals||[]).map(g=>({ id:g.id, name:g.name }));
  // Notes carry their body (truncated) - without it the organizer can only see a title
  // and can't actually work the jotted note. Discarded ones are noise; leave them out.
  const ideas = (d.ideas||[]).filter(i=>i.state!=="discarded").map(i=>({ id:i.id, title:i.title,
    state:i.state||"raw", body:(i.body||"").slice(0,400) }));
  return JSON.stringify({
    categories: knownCategories(store),
    locations: (store.cfg.locations&&store.cfg.locations.length)?store.cfg.locations:DEFAULT_LOCATIONS,
    todos: todo, projects, goals, ideas
  });
}

// Resize an image File to <=1568px long edge, JPEG q0.82 (keeps OCR accurate, cuts tokens).
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    log("OCR","resize "+(file.size/1024|0)+"KB "+file.type);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try{
        const max = 1568;
        let { width:w, height:h } = img;
        if(Math.max(w,h) > max){ const s = max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        const dataUrl = c.toDataURL("image/jpeg",0.82);
        URL.revokeObjectURL(url);
        log("OCR","resized to "+w+"x"+h);
        resolve(dataUrl.split(",")[1]); // base64 only
      }catch(e){ log("ERROR","resize: "+e.message); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not load image.")); };
    img.src = url;
  });
}

/* ============================================================
   DATA STORE HOOK
   Holds all entities in memory + localStorage. Optimistic local
   writes, then push to GitHub. Dirty files retry on next sync /
   when the device comes back online.
   ============================================================ */
const STATUS_ORDER = ["inbox","next","waiting","someday","done"];
const QUADRANTS = {
  q1:{label:"Do First", hint:"Urgent + Important", cls:"q1"},
  q2:{label:"Schedule", hint:"Important, Not Urgent", cls:"q2"},
  q3:{label:"Do Quick", hint:"Urgent, Not Important", cls:"q3"},
  q4:{label:"Not Right Now", hint:"Not urgent or important", cls:"q4"}
};

// GTD contexts / locations. Seeded with the user's places; editable in Settings.
// A todo's location is stored as a plain label string so it travels with the data
// and syncs across devices without an id->label map.
// Neutral GTD contexts. These seed a NEW account only: knownLocations() unions in any
// location already used on an item, so an existing account never loses its own labels
// even if its saved cfg were somehow missing.
const DEFAULT_LOCATIONS = ["Home", "Office", "Errands", "Car"];
function knownLocations(store){
  const seed = (store.cfg.locations && store.cfg.locations.length) ? store.cfg.locations : DEFAULT_LOCATIONS;
  const used = (store.data.todos || []).map(t=>t.location).filter(Boolean);
  return Array.from(new Set([...seed, ...used]));   // union keeps options valid on any device
}

// Life-area categories. Editable in Settings (stored in config), with any category
// already used on an item kept available so options stay valid across devices.
// Deliberately a DIFFERENT axis from Spaces (which are areas of life). If categories
// also seeded Personal/Work/Family a new user would face two competing partitions and
// no way to tell them apart. These are kinds of work instead. Same union rule as
// locations: knownCategories() keeps any category already used on an item.
const DEFAULT_CATEGORIES = ["Admin","Health","Home","Money","Social"];
function knownCategories(store){
  const seed = (store.cfg.categories && store.cfg.categories.length) ? store.cfg.categories : DEFAULT_CATEGORIES;
  const used = [];
  ["todos","ideas","projects","goals"].forEach(f=>(store.data[f]||[]).forEach(x=>{ if(x.type) used.push(x.type); }));
  return Array.from(new Set([...seed, ...used]));
}
// Stable color per category name (hash -> warm palette), so user-defined categories
// get a consistent color without storing one.
const CAT_PALETTE = ["#6f9bc4","#a98bc4","#7fa66a","#e0a33e","#cf8a54","#c98aa6","#8ab8a0","#d6a25e"];
function catHue(c){
  if(!c) return "#998a73";
  let h=0; for(let i=0;i<c.length;i++) h=(h*31+c.charCodeAt(i))>>>0;
  return CAT_PALETTE[h % CAT_PALETTE.length];
}
// Accent theming helpers (per-device, so one shared app can be re-colored per user).
const DEFAULT_ACCENT = "#e0a33e";
const isHex6 = (s) => typeof s==="string" && /^#[0-9a-fA-F]{6}$/.test(s);
function lighten(hex, t){
  if(!isHex6(hex)) hex = DEFAULT_ACCENT;
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const mix=(v)=>Math.round(v+(255-v)*t).toString(16).padStart(2,"0");
  return "#"+mix(r)+mix(g)+mix(b);
}
const ACCENT_PRESETS = ["#e0a33e","#6f9bc4","#7fa66a","#c98aa6","#a98bc4","#cf8a54","#5fb0a3","#d97b6c"];
// Base palettes (background + text + lines). The accent color is chosen separately,
// so any theme can pair with any accent. All per-device.
const THEMES = {
  espresso: { label:"Espresso", dark:true,  bg:"#1c1611", bg2:"#241c15", bg3:"#2e251c", bg4:"#3a2f23", line:"#3a2f2333", line2:"#4a3d2e", ink:"#f3ead9", ink2:"#cbbca4", ink3:"#998a73" },
  onyx:     { label:"Onyx",     dark:true,  bg:"#0c0c0d", bg2:"#141417", bg3:"#1c1c20", bg4:"#27272d", line:"#ffffff10", line2:"#34343c", ink:"#f6f6f5", ink2:"#c6c6c9", ink3:"#86868c" },
  paper:    { label:"Paper",    dark:false, bg:"#fbfaf7", bg2:"#f1efe9", bg3:"#ffffff", bg4:"#e8e5de", line:"#00000010", line2:"#e0dcd3", ink:"#211d18", ink2:"#5f584d", ink3:"#8d8676" },
};
const DEFAULT_THEME = "espresso";
// The full default config shape. Also the reset target on sign-out, so a shared
// device doesn't leak one account's settings to the next (config now syncs per-user).
const DEFAULT_CFG = { locations:DEFAULT_LOCATIONS, categories:DEFAULT_CATEGORIES, appName:"Priority Captain", accent:DEFAULT_ACCENT, theme:DEFAULT_THEME };

/* ============================================================
   SPACES - partition every item by area of life (Personal / RTR / Kids / ...).
   Rides entirely on the existing sync: a per-item `space` (id) field, and the Space
   LIST in the per-user `meta` object (meta.spaces + meta.defaultSpace). No backend change.
   The active-Space selection (Step 2) is per-device; the list here is synced.
   ============================================================ */
const DEFAULT_SPACE = "personal";
// TWO seeds, chosen by whether the account already has items (see ensureSpaces).
//
// LEGACY is the original owner-shaped seed. It must stay EXACTLY as it was, because
// ensureSpaces step 2 reassigns any item whose space is not in the seeded list - so
// seeding an existing RTR/Kids account with the neutral list below would silently
// collapse those items into Personal and lose the partition.
const SEED_SPACES_LEGACY = [
  { id:"personal", name:"Personal", color:"#6f9bc4", order:0, archived:false },
  { id:"rtr",      name:"RTR",      color:"#7fa66a", order:1, archived:false },
  { id:"kids",     name:"Kids",     color:"#c98aa6", order:2, archived:false },
];
// NEW accounts (zero items) get neutral areas instead of the owner's. Nobody but the
// owner knows what "RTR" is, and it was the first thing a new user saw. Renameable in
// Manage Spaces, so this is a starting point, not a constraint.
const SEED_SPACES_NEW = [
  { id:"personal", name:"Personal", color:"#6f9bc4", order:0, archived:false },
  { id:"work",     name:"Work",     color:"#7fa66a", order:1, archived:false },
  { id:"family",   name:"Family",   color:"#c98aa6", order:2, archived:false },
];
// Where an existing item migrates, from its category (`type`). Category-aware seed
// (chosen 2026-07-13): the RTR/Kids categories move into their Spaces; everything else
// goes to the default (Personal). Case-insensitive. Additive + reversible.
function spaceForType(type){
  const t = String(type||"").trim().toLowerCase();
  if(t==="rtr")  return "rtr";
  if(t==="kids") return "kids";
  return DEFAULT_SPACE;
}

function useStore(){
  const [cfg, setCfg] = useState(() => {
    const c = lsGet("cfg", DEFAULT_CFG);
    if(c.appName === "Tracker"){ c.appName = "Priority Captain"; lsSet("cfg", c); }   // rebrand: bump the old "Tracker" default for existing installs
    return c;
  });
  const [data, setData] = useState(() => {
    const d = {}; FILES.forEach(f => d[f] = lsGet("cache:"+f, [])); return d;
  });
  const [dirty, setDirty] = useState(() => lsGet("dirty", {}));
  const [sync, setSync] = useState("idle");      // idle | busy | pending | error
  const [syncMsg, setSyncMsg] = useState("");
  const [online, setOnline] = useState(navigator.onLine);
  const [authed, setAuthed] = useState(false);       // is a Supabase session active
  const [authEmail, setAuthEmail] = useState("");    // signed-in email (shown in Settings)
  const [authReady, setAuthReady] = useState(false); // first session check finished (avoids a login flash)
  const cfgRef = useRef(cfg); cfgRef.current = cfg;
  const cfgDirtyRef = useRef(lsGet("cfgDirty", false));   // true when local META (cfg + spaces) has unpushed edits
  /* META CHANGE COUNTER. Every change to the meta blob bumps this, and pushCfg may
     only mark meta CLEAN if the counter did not move while its push was in flight.

     WARNING - why a single dirty boolean is not enough (found by the store test
     suite, 2026-09-12): on a first sign-in pull, ensureSpaces fires a meta push in
     the background. While that push was in flight, ensureHabits converted routine
     todos into habits and set the flag. The earlier push then finished and cleared
     the flag, although it had sent meta from BEFORE the migration. The pull's final
     pushCfg saw a clean flag and did nothing. The server kept the deleted-routine
     todos' removal but never received the habits, their backup, or habitsMigrated;
     they existed only on the phone until some later meta save carried them.

     Rejected: awaiting every background push before continuing. Savers are fired
     from UI handlers that must not block, and it would only move the race. */
  const metaSeqRef = useRef(0);
  const markMetaDirty = () => { metaSeqRef.current++; cfgDirtyRef.current = true; lsSet("cfgDirty", true); };
  // Spaces live in the same per-user meta object as cfg. `spaces` is null until seeded
  // (on the first authed pull) or applied from the server.
  const [spaces, setSpaces] = useState(() => lsGet("spaces", null));
  const [defaultSpace, setDefaultSpace] = useState(() => lsGet("defaultSpace", DEFAULT_SPACE));
  const spacesRef = useRef(spaces); spacesRef.current = spaces;
  const defaultSpaceRef = useRef(defaultSpace); defaultSpaceRef.current = defaultSpace;
  const spacesSeededRef = useRef(lsGet("spacesSeeded", false));
  // Reusable checklist templates, also in the meta blob: [{ id, name, items:[titles] }].
  const [templates, setTemplates] = useState(() => lsGet("templates", []));
  const templatesRef = useRef(templates); templatesRef.current = templates;
  // Habits: [{id,name,cadence,space,type,startedAt,done:[iso]}]. Another meta slice.
  // `habitsMigrated` marks the one-time routine-todo conversion as already run;
  // `habitsBackup` holds the routine rows it deleted, so a bad migration is undoable.
  const [habits, setHabits] = useState(() => lsGet("habits", null));
  const habitsRef = useRef(habits); habitsRef.current = habits;
  // Affirmations: [{id,text,addedAt}]. A meta slice like the rest. Which one is
  // shown today is DERIVED from the date, so there is no pointer to persist.
  const [affirmations, setAffirmations] = useState(() => lsGet("affirmations", null));
  const affirmationsRef = useRef(affirmations); affirmationsRef.current = affirmations;
  // Orders: see ORDERS. A meta slice, so all four parts apply, signOut included.
  const [orders, setOrders] = useState(() => lsGet("orders", null));
  const ordersRef = useRef(orders); ordersRef.current = orders;
  // Scratch pad: see SCRATCH. A meta slice, so all four parts apply, signOut included.
  const [scratch, setScratch] = useState(() => lsGet("scratch", null));
  const scratchRef = useRef(scratch); scratchRef.current = scratch;
  const habitsMigratedRef = useRef(lsGet("habitsMigrated", false));
  const habitsBackupRef = useRef(lsGet("habitsBackup", null));
  // RTR Rundown: an awareness board that rides on meta (like templates/spaces). null until
  // first use. Shape: { workstreams:[{id,name,order}], items:[{id,workstreamId,name,status,
  // nextStep,blocker,note,order,updatedAt}] }. See SCOPE-rtr-rundown.md.
  const [rundown, setRundown] = useState(() => lsGet("rundown", null));
  const rundownRef = useRef(rundown); rundownRef.current = rundown;
  // Active Space = the current focus (per-device). "all" = show everything. lastSpaceRef
  // remembers the last real Space so a new item created in "All" still gets a sensible one.
  const [activeSpace, setActiveSpaceState] = useState(() => lsGet("activeSpace", "all"));
  const activeSpaceRef = useRef(activeSpace); activeSpaceRef.current = activeSpace;
  const lastSpaceRef = useRef(lsGet("lastSpace", DEFAULT_SPACE));
  const setActiveSpace = useCallback((id) => {
    const v = id || "all";
    setActiveSpaceState(v); lsSet("activeSpace", v); activeSpaceRef.current = v;
    if(v !== "all"){ lastSpaceRef.current = v; lsSet("lastSpace", v); }
    log("SPACES","active -> "+v);
  }, []);
  // The Space a newly created item inherits: the active Space, or (in "All") the last-used one.
  const newItemSpace = () => (activeSpaceRef.current && activeSpaceRef.current!=="all")
    ? activeSpaceRef.current : (lastSpaceRef.current || defaultSpaceRef.current);
  const dirtyRef = useRef(dirty); dirtyRef.current = dirty;
  const dataRef = useRef(data); dataRef.current = data;
  const authedRef = useRef(false);
  // Mirrors `sync` for the resume handler, which reads it from inside a listener closure
  // and must see the CURRENT status (an error should retry at once, not wait out the gap).
  const syncRef = useRef(sync); syncRef.current = sync;

  // Assemble the whole per-user meta blob (backend replaces it wholesale on PUT, so a
  // partial PUT would drop keys). Reads refs, so it's always current. Spaces are included
  // only once seeded, so we never write a null spaces list over a good server one.
  const buildMeta = () => {
    const m = { cfg: cfgRef.current };
    if(spacesRef.current && spacesRef.current.length){
      m.spaces = spacesRef.current; m.defaultSpace = defaultSpaceRef.current; m.spacesSeeded = spacesSeededRef.current;
    }
    if(templatesRef.current && templatesRef.current.length){ m.templates = templatesRef.current; }
    if(rundownRef.current){ m.rundown = rundownRef.current; }
    if(affirmationsRef.current){ m.affirmations = affirmationsRef.current; }
    if(ordersRef.current){ m.orders = ordersRef.current; }
    if(scratchRef.current){ m.scratch = scratchRef.current; }
    if(habitsRef.current){
      m.habits = habitsRef.current;
      m.habitsMigrated = !!habitsMigratedRef.current;
      if(habitsBackupRef.current) m.habitsBackup = habitsBackupRef.current;
    }
    return m;
  };
  // Push the meta blob (cfg + spaces) to the per-user `meta` singleton. Same offline-defer
  // contract as the file sync: if offline or signed out, leave cfgDirty set so the next
  // pull / online event flushes it. (Named pushCfg for history; it now pushes all of meta.)
  const pushCfg = useCallback(async () => {
    if(!cfgDirtyRef.current) return;
    if(!authedRef.current) return;
    if(!navigator.onLine){ log("SYNC","offline; deferring meta push"); setSync("pending"); return; }
    const sentSeq = metaSeqRef.current;
    try{
      await metaPut(buildMeta());
      if(metaSeqRef.current === sentSeq){
        cfgDirtyRef.current = false; lsSet("cfgDirty", false);
        log("SYNC","meta (cfg+spaces) pushed");
      } else {
        // Meta changed while this push was in flight, so what we sent is already
        // stale. Leave it dirty and send the current state.
        log("SYNC","meta changed during push; pushing again");
        await pushCfg();
      }
    }catch(e){ setSync("error"); setSyncMsg(syncErrText(e)); log("ERROR","pushCfg: "+e.message); }
  }, []);

  // persist config (local + per-user meta). Keep cfgRef current so pushCfg sends
  // the new value immediately, before the re-render that would sync the ref.
  const saveCfg = useCallback((next) => {
    setCfg(next); lsSet("cfg", next); cfgRef.current = next;
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);

  // Save the Space list (add / rename / recolor / reorder / archive) - persists to meta.
  const saveSpaces = useCallback((next) => {
    spacesRef.current = next; setSpaces(next); lsSet("spaces", next);
    spacesSeededRef.current = true; lsSet("spacesSeeded", true);
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);
  const setDefaultSpaceId = useCallback((id) => {
    defaultSpaceRef.current = id; setDefaultSpace(id); lsSet("defaultSpace", id);
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);
  const saveOrders = useCallback((next) => {
    ordersRef.current = next; setOrders(next); lsSet("orders", next);
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);
  const saveScratch = useCallback((next) => {
    scratchRef.current = next; setScratch(next); lsSet("scratch", next);
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);
  const saveAffirmations = useCallback((next) => {
    affirmationsRef.current = next; setAffirmations(next); lsSet("affirmations", next);
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);
  // Save the habit list (add / rename / tick / delete) - persists to meta.
  // Ref written SYNCHRONOUSLY before the push, same contract as every other slice.
  const saveHabits = useCallback((next) => {
    habitsRef.current = next; setHabits(next); lsSet("habits", next);
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);
  // Save the checklist-template list (create / rename / delete) - persists to meta.
  const saveTemplates = useCallback((next) => {
    templatesRef.current = next; setTemplates(next); lsSet("templates", next);
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);
  const saveRundown = useCallback((next) => {
    rundownRef.current = next; setRundown(next); lsSet("rundown", next);
    markMetaDirty();
    pushCfg();
  }, [pushCfg]);

  // mark a file dirty + persist its cache. dirtyRef is written SYNCHRONOUSLY,
  // not left to the re-render: pushDirty() runs in the same tick and reads
  // dirtyRef to pick what to push, and multi-file mutators (relabel, applyPlan,
  // restoreLabel, ensureOrders, ensureSpaces) call this back-to-back - with the
  // ref lagging, each call spread the same stale map and the LAST write dropped
  // the earlier files' flags, so a file with real local changes could read clean
  // and be rolled back by the next pull.
  const markDirty = useCallback((file, rows) => {
    lsSet("cache:"+file, rows);
    const nd = { ...dirtyRef.current, [file]:true };
    dirtyRef.current = nd; setDirty(nd); lsSet("dirty", nd);
  }, []);

  // push all dirty files to the backend
  const pushDirty = useCallback(async () => {
    if(!authedRef.current){ return; }
    if(!navigator.onLine){ log("SYNC","offline; deferring push"); setSync("pending"); return; }
    const pending = FILES.filter(f => dirtyRef.current[f]);
    if(pending.length===0){ setSync("idle"); return; }
    setSync("busy"); setSyncMsg("Saving...");
    log("SYNC","push "+pending.join(","));
    try{
      for(const f of pending){
        await collPut(f, dataRef.current[f]);
        const nd = { ...dirtyRef.current, [f]:false }; dirtyRef.current = nd; setDirty(nd); lsSet("dirty", nd);
      }
      setSync("idle"); setSyncMsg("");
      log("SYNC","push complete");
    }catch(e){
      setSync("error"); setSyncMsg(syncErrText(e));
      log("ERROR","pushDirty: "+e.message);
    }
  }, []);

  // One-time: make sure every item has a numeric manual `order` (for drag-to-reorder).
  // Seeds from each file's natural sort so the list looks identical until you drag.
  const ensureOrders = useCallback(() => {
    let wrote = false; const nd = { ...dataRef.current };
    FILES.forEach(f => {
      const list = dataRef.current[f] || [];
      if(list.length && list.some(x => typeof x.order !== "number")){
        const sorted = list.slice().sort(NAT_CMP[f] || (()=>0));
        const ord = {}; sorted.forEach((x,idx)=>{ ord[x.id] = idx*1000; });
        const nextList = list.map(x => typeof x.order==="number" ? x : { ...x, order:ord[x.id] });
        nd[f] = nextList; markDirty(f, nextList); wrote = true;
        log("INIT","seeded manual order for "+f+" ("+nextList.length+" items)");
      }
    });
    if(wrote){ dataRef.current = nd; setData(nd); pushDirty(); }
  }, [markDirty, pushDirty]);

  // One-time, idempotent: seed the Space list into meta and stamp every existing item
  // with a `space`. Runs from pull() on authoritative data (like ensureOrders). Only
  // fills items that lack a valid space, so re-running is a no-op. Category-aware map
  // (spaceForType): RTR/Kids categories -> their Spaces, everything else -> default.
  // Additive only (never deletes) -> fully reversible.
  const ensureSpaces = useCallback(() => {
    let metaChanged = false;
    // 1) Seed the Space list if this account has none yet.
    if(!spacesRef.current || !spacesRef.current.length){
      // Which seed? An account with ZERO items is genuinely new, so give it neutral
      // areas. An account that already HAS items is mid-migration and must get the
      // legacy owner seed, or step 2 below would find their rtr/kids spaces invalid
      // and reassign every one of those items to Personal.
      const hasItems = FILES.some(f => (dataRef.current[f] || []).length > 0);
      const seeded = (hasItems ? SEED_SPACES_LEGACY : SEED_SPACES_NEW).map(s => ({ ...s }));
      spacesRef.current = seeded; setSpaces(seeded); lsSet("spaces", seeded);
      defaultSpaceRef.current = DEFAULT_SPACE; setDefaultSpace(DEFAULT_SPACE); lsSet("defaultSpace", DEFAULT_SPACE);
      metaChanged = true;
      log("SPACES","seeded space list ("+(hasItems?"legacy":"new account")+"): "+seeded.map(s=>s.id).join(","));
    }
    // 2) Backfill `space` on any item missing one (or pointing at a space that no longer exists).
    const valid = new Set((spacesRef.current||[]).map(s => s.id));
    let wrote = false; const nd = { ...dataRef.current }; const tally = {}; let before = 0, after = 0;
    FILES.forEach(f => {
      const list = dataRef.current[f] || []; before += list.length;
      if(!list.some(x => !x.space || !valid.has(x.space))){ after += list.length; return; }
      const nextList = list.map(x => {
        if(x.space && valid.has(x.space)) return x;
        // Clamp to a space that actually exists. spaceForType maps a category named
        // "RTR"/"Kids" to those space ids, but a NEW account has no such spaces - the
        // item would fail `valid` on the next pull, be rewritten, and churn forever.
        const guess = spaceForType(x.type);
        const sp = valid.has(guess) ? guess : (defaultSpaceRef.current || DEFAULT_SPACE);
        tally[sp] = (tally[sp]||0) + 1;
        return { ...x, space: sp };
      });
      nd[f] = nextList; after += nextList.length; markDirty(f, nextList); wrote = true;
    });
    if(wrote){
      dataRef.current = nd; setData(nd);
      log("SPACES","migrated items to spaces "+JSON.stringify(tally)+" (count "+before+" -> "+after+")");
    }
    if(!spacesSeededRef.current){ spacesSeededRef.current = true; lsSet("spacesSeeded", true); metaChanged = true; }
    if(metaChanged){ markMetaDirty(); }
    if(wrote || metaChanged){ pushDirty(); pushCfg(); }
  }, [markDirty, pushDirty, pushCfg]);

  // One-time migration + every-load roll-forward for routines. Runs from pull() on
  // authoritative data, like ensureOrders/ensureSpaces, and is idempotent.
  //   1) MIGRATE: an existing DAILY recurring todo with no `routine` flag becomes a
  //      routine. Weekly/monthly are left alone - a missed "pay rent" is a real debt.
  //   2) ROLL: any routine whose due date is in the past moves to the next occurrence
  //      that is not past, so a skipped day reads "Today" instead of piling up red.
  // Mutating (rather than computing at render) keeps every downstream consumer -
  // todayItems, overdue chips, Dashboard, Now - correct with no changes.
  /* One-time: convert routine todos into habits, then delete those rows.
     Runs from pull() on authoritative data, like ensureSpaces/ensureOrders.

     DELETION SAFETY, in order:
      1. Guarded by habitsMigrated so it can never run twice.
      2. The deleted rows are stashed verbatim in habitsBackup FIRST, so the
         "delete" is undoable even though Chris asked for a delete.
      3. Habits are written before the todos are removed, never after.
     Grouping is by title (see migrateRoutines) - a renamed routine splits. */
  const ensureHabits = useCallback(() => {
    if(habitsMigratedRef.current) return;
    const list = dataRef.current.todos || [];
    const { habits: made, removeIds } = migrateRoutines(list, habitsRef.current || []);
    if(!made.length && !removeIds.length){
      habitsMigratedRef.current = true; lsSet("habitsMigrated", true);
      if(!habitsRef.current){ habitsRef.current = []; setHabits([]); lsSet("habits", []); }
      return;
    }
    const kill = new Set(removeIds);
    const backup = list.filter(t => kill.has(t.id));          // stash BEFORE removing
    habitsBackupRef.current = backup; lsSet("habitsBackup", backup);

    const nextHabits = (habitsRef.current || []).concat(made);
    habitsRef.current = nextHabits; setHabits(nextHabits); lsSet("habits", nextHabits);

    const nextTodos = list.filter(t => !kill.has(t.id));
    const nd = { ...dataRef.current, todos: nextTodos };
    dataRef.current = nd; setData(nd); markDirty("todos", nextTodos);

    habitsMigratedRef.current = true; lsSet("habitsMigrated", true);
    markMetaDirty();
    log("HABIT","converted "+made.length+" habit(s), removed "+removeIds.length+" routine todo(s), "+
                backup.length+" row(s) backed up");
  }, [markDirty]);

  const ensureRoutines = useCallback(() => {
    const list = dataRef.current.todos || [];
    let migrated = 0, rolled = 0;
    const next = list.map(t => {
      let o = t;
      if(o.routine === undefined && o.recur && o.recur !== "none"){
        o = { ...o, routine: defaultRoutineFor(o.recur) };
        if(o.routine) migrated++;
      }
      // Only live routines roll; a completed instance keeps its historical date.
      if(isRoutine(o) && o.status !== "done"){
        const due = o.due || TODAY();
        const r = rollToToday(due, o.recur);
        if(r !== o.due){ o = { ...o, due:r }; rolled++; }
      }
      return o;
    });
    if(migrated || rolled){
      const nd = { ...dataRef.current, todos: next };
      dataRef.current = nd; setData(nd); markDirty("todos", next);
      log("ROUTINE","migrated "+migrated+", rolled forward "+rolled);
      pushDirty();
    }
  }, [markDirty, pushDirty]);

  // pull from the backend (only overwrites files that are NOT locally dirty)
  const pull = useCallback(async () => {
    if(!authedRef.current || !navigator.onLine) return;
    setSync("busy"); setSyncMsg("Syncing...");
    log("SYNC","pull all");
    try{
      const nextData = { ...dataRef.current };
      for(const f of FILES){
        if(dirtyRef.current[f]){ log("SYNC","skip pull "+f+" (dirty)"); continue; }
        const arr = await collGet(f);
        nextData[f] = arr; lsSet("cache:"+f, arr);
      }
      dataRef.current = nextData; setData(nextData);
      // Config lives in the per-user `meta` singleton. Apply the server copy unless
      // we have unpushed local edits (mirrors the per-file dirty-skip above). If the
      // server has no config yet (existing user, first run), seed it from this device.
      if(!cfgDirtyRef.current){
        try{
          const m = await metaGet();
          const sc = m && m.cfg;
          if(sc && typeof sc==="object" && !Array.isArray(sc)){
            const merged = { ...DEFAULT_CFG, ...sc };
            if(merged.appName === "Tracker") merged.appName = "Priority Captain";   // legacy rebrand guard
            cfgRef.current = merged; setCfg(merged); lsSet("cfg", merged);
            log("SYNC","cfg <- meta applied");
          } else {
            markMetaDirty();   // seed server from local on the push below
            log("SYNC","no server cfg; seeding from local");
          }
          // Spaces live in the same meta object. Apply the server list if present;
          // ensureSpaces() below seeds it (and migrates items) when the server has none.
          if(Array.isArray(m && m.spaces) && m.spaces.length){
            spacesRef.current = m.spaces; setSpaces(m.spaces); lsSet("spaces", m.spaces);
            const ds = m.defaultSpace || DEFAULT_SPACE; defaultSpaceRef.current = ds; setDefaultSpace(ds); lsSet("defaultSpace", ds);
            spacesSeededRef.current = !!m.spacesSeeded; lsSet("spacesSeeded", !!m.spacesSeeded);
            log("SPACES","spaces <- meta ("+m.spaces.length+")");
          }
          if(Array.isArray(m && m.templates)){
            templatesRef.current = m.templates; setTemplates(m.templates); lsSet("templates", m.templates);
            log("TEMPLATE","templates <- meta ("+m.templates.length+")");
          }
          if(m && m.rundown && typeof m.rundown==="object"){
            rundownRef.current = m.rundown; setRundown(m.rundown); lsSet("rundown", m.rundown);
            log("RUNDOWN","rundown <- meta ("+((m.rundown.items||[]).length)+" items)");
          }
          if(Array.isArray(m && m.affirmations)){
            affirmationsRef.current = m.affirmations; setAffirmations(m.affirmations);
            lsSet("affirmations", m.affirmations);
            log("AFFIRM","affirmations <- meta ("+m.affirmations.length+")");
          }
          if(Array.isArray(m && m.orders)){
            ordersRef.current = m.orders; setOrders(m.orders); lsSet("orders", m.orders);
            log("ORDERS","orders <- meta ("+m.orders.length+")");
          }
          if(Array.isArray(m && m.scratch)){
            scratchRef.current = m.scratch; setScratch(m.scratch); lsSet("scratch", m.scratch);
            log("SCRATCH","scratch <- meta ("+m.scratch.length+")");
          }
          if(Array.isArray(m && m.habits)){
            habitsRef.current = m.habits; setHabits(m.habits); lsSet("habits", m.habits);
            habitsMigratedRef.current = !!m.habitsMigrated; lsSet("habitsMigrated", !!m.habitsMigrated);
            if(m.habitsBackup){ habitsBackupRef.current = m.habitsBackup; lsSet("habitsBackup", m.habitsBackup); }
            log("HABIT","habits <- meta ("+m.habits.length+")");
          }
        }catch(e){ log("ERROR","pull meta: "+e.message); }
      }
      setSync(FILES.some(f=>dirtyRef.current[f])?"pending":"idle"); setSyncMsg("");
      log("SYNC","pull complete");
      ensureOrders();
      ensureSpaces();
      ensureRoutines();      // must run BEFORE ensureHabits: it backfills the
      ensureHabits();        // routine flag on older recurring todos.
      await pushDirty();
      await pushCfg();
    }catch(e){ setSync("error"); setSyncMsg(syncErrText(e)); log("ERROR","pull: "+e.message); }
  }, [pushDirty, pushCfg, ensureOrders, ensureSpaces, ensureRoutines, ensureHabits]);

  // ----- Auth: track the Supabase session and pull on sign-in -----
  // applySession runs on the initial check AND on every auth change. It pulls only
  // on the transition INTO a signed-in state, so a background token refresh does
  // not trigger a redundant full pull.
  const applySession = useCallback((session) => {
    const ok = !!session;
    const was = authedRef.current;
    authedRef.current = ok; setAuthed(ok);
    setAuthEmail(ok && session.user ? (session.user.email||"") : "");
    if(ok && !was){ log("AUTH","session active"); pull(); }
    else if(!ok){ log("AUTH","no session"); }
  }, [pull]);

  const signIn = useCallback(async (email, password) => {
    const { error } = await supa.auth.signInWithPassword({ email:(email||"").trim(), password:password||"" });
    if(error){ log("AUTH","sign-in failed: "+error.message); throw new Error(error.message); }
    log("AUTH","sign-in ok");
  }, []);

  const signOut = useCallback(async () => {
    try{ await supa.auth.signOut(); }catch(e){ log("ERROR","signOut: "+e.message); }
    // Clear the local data cache + dirty flags + AI drafts so the next login starts
    // CLEAN from the server. Prevents one account's stale/dirty data from being shown
    // to - or pushed under - a different account on the same device (migration footgun).
    FILES.forEach(f => lsDel("cache:"+f));
    ["dirty","pendingReview","aiChat","aiPlan","aiSeed","cfgDirty","spaces","defaultSpace","spacesSeeded","templates","rundown",
     "habits","habitsMigrated","habitsBackup","affirmations","orders","scratch"].forEach(k => lsDel(k));
    const empty = {}; FILES.forEach(f => empty[f] = []);
    dataRef.current = empty; setData(empty);
    dirtyRef.current = {}; setDirty({});
    // Config + spaces sync per-user, so reset them to defaults too - the next sign-in
    // pulls that account's meta (cfg + spaces) back down.
    cfgDirtyRef.current = false; lsSet("cfg", DEFAULT_CFG);
    cfgRef.current = DEFAULT_CFG; setCfg(DEFAULT_CFG);
    spacesRef.current = null; setSpaces(null);
    defaultSpaceRef.current = DEFAULT_SPACE; setDefaultSpace(DEFAULT_SPACE);
    spacesSeededRef.current = false;
    templatesRef.current = []; setTemplates([]);
    // Habits are a meta slice too, so the SAME rule applies: ref + state + localStorage,
    // all three. habitsMigrated especially - left set, the next account would skip its own
    // routine conversion entirely and silently keep routine todos that never became habits.
    affirmationsRef.current = null; setAffirmations(null);
    ordersRef.current = null; setOrders(null);
    scratchRef.current = null; setScratch(null);
    habitsRef.current = null; setHabits(null);
    habitsMigratedRef.current = false;
    habitsBackupRef.current = null;
    // The Rundown lives in meta like templates do, and buildMeta pushes whatever is in
    // rundownRef. Leaving it behind meant the previous account's board stayed on screen
    // AND could be written into the next account's meta on the first sync.
    rundownRef.current = null; setRundown(null);
    log("AUTH","signed out (local cache + config + spaces + templates + rundown cleared)");
  }, []);

  // Permanently delete this account and everything in it. Backend removes every
  // row the user owns then the login itself; here we wipe the device + SW cache
  // and sign out so nothing of the account lingers locally.
  const deleteAccount = useCallback(async () => {
    const token = await authToken();
    if(!token) throw new Error("Please sign in again.");
    const r = await fetch(API_BASE + "/api/account/delete", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token },
      body: JSON.stringify({ confirm:"DELETE" }),
    });
    if(!r.ok){
      const t = await r.text().catch(()=>"");
      log("ERROR","deleteAccount "+r.status+" "+t.slice(0,200));
      throw new Error(r.status===502
        ? "Your data was removed but the login couldn't be deleted. Contact support."
        : "Could not delete the account. Please try again.");
    }
    try{ if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("clearCache"); }catch(_){}
    await signOut();
    log("AUTH","account deleted");
  }, [signOut]);

  // Self-serve signup. With email confirmation ON (Supabase setting), there is no
  // session until the user clicks the emailed link, so data.session is null and we
  // tell the UI to show a "check your email" state. emailRedirectTo brings the
  // confirmation link back to THIS app (must be allow-listed in Supabase Auth URLs).
  const signUp = useCallback(async (email, password) => {
    const redirectTo = window.location.origin + window.location.pathname;
    const { data, error } = await supa.auth.signUp({
      email:(email||"").trim(), password:password||"",
      options:{ emailRedirectTo: redirectTo }
    });
    if(error){ log("AUTH","sign-up failed: "+error.message); throw new Error(error.message); }
    const needsConfirm = !data.session;   // true when email confirmation is required
    log("AUTH","sign-up ok needsConfirm="+needsConfirm);
    return { needsConfirm };
  }, []);

  // --- Password reset / recovery ---
  const [recovery, setRecovery] = useState(false);   // true after a PASSWORD_RECOVERY event (landed from a reset link)

  // "Forgot password?" - email a reset link. The link returns here with a recovery
  // token; onAuthStateChange (below) flips `recovery` on so we show the set-password screen.
  const requestReset = useCallback(async (email) => {
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await supa.auth.resetPasswordForEmail((email||"").trim(), { redirectTo });
    if(error){ log("AUTH","reset request failed: "+error.message); throw new Error(error.message); }
    log("AUTH","reset email sent");
  }, []);

  // Set a new password for the current (recovery) session, then leave recovery mode.
  const updatePassword = useCallback(async (newPassword) => {
    const { error } = await supa.auth.updateUser({ password: newPassword });
    if(error){ log("AUTH","updatePassword failed: "+error.message); throw new Error(error.message); }
    setRecovery(false);
    log("AUTH","password updated");
  }, []);

  // Establish the session on mount, then subscribe to auth changes.
  useEffect(() => {
    let sub = null;
    (async () => {
      try{
        const { data } = await supa.auth.getSession();
        applySession(data.session);
      }catch(e){ log("ERROR","getSession: "+e.message); }
      setAuthReady(true);
      const res = supa.auth.onAuthStateChange((evt, session) => { if(evt === "PASSWORD_RECOVERY"){ setRecovery(true); } applySession(session); });
      sub = res.data ? res.data.subscription : null;
    })();
    return () => { if(sub) sub.unsubscribe(); };
  }, [applySession]);

  // online/offline listeners. Coming back online must PULL as well as push - a failed
  // pull used to leave the error chip up with nothing that would ever clear it.
  useEffect(() => {
    const on = () => { setOnline(true); log("SYNC","online"); pushDirty(); pushCfg(); pull(); };
    const off = () => { setOnline(false); log("SYNC","offline"); setSync("pending"); };
    window.addEventListener("online", on); window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, [pushDirty, pushCfg, pull]);

  // Re-sync when the app is RESUMED. An installed PWA is almost always resumed from the
  // background rather than cold-launched, and iOS routinely fires a resumed app's first
  // fetch before the network stack is back - which lands as a bare TypeError ("Load
  // failed" in Safari). Without this, that one failure stuck: nothing else re-pulled
  // (the 30s interval only PUSHES) so the error chip stayed up until a full relaunch.
  // Debounced like the update check so a burst of resumes can't hammer the backend.
  useEffect(() => {
    let last = 0; const GAP = 30 * 1000;
    const maybe = () => {
      if(!authedRef.current || !navigator.onLine) return;
      const now = Date.now();
      // Always retry immediately when we are sitting on an error; otherwise debounce.
      if(syncRef.current !== "error" && now - last < GAP) return;
      last = now; log("SYNC","resume -> pull"); pull();
    };
    const onVis = () => { if(document.visibilityState === "visible") maybe(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("focus", onVis);
    return () => { document.removeEventListener("visibilitychange", onVis); window.removeEventListener("focus", onVis); };
  }, [pull]);

  // seed manual order for whatever is already cached (covers offline launches)
  useEffect(() => { ensureOrders(); }, [ensureOrders]);

  // periodic retry while dirty
  useEffect(() => {
    const id = setInterval(() => {
      if(!navigator.onLine) return;
      if(FILES.some(f=>dirtyRef.current[f])) pushDirty();
      if(cfgDirtyRef.current) pushCfg();
    }, 30000);
    return () => clearInterval(id);
  }, [pushDirty, pushCfg]);

  // generic mutators ------------------------------------------------
  const upsert = useCallback((file, row) => {
    const list = dataRef.current[file] || [];
    const i = list.findIndex(x => x.id === row.id);
    let next, merged;
    if(i>=0){ merged = { ...list[i], ...row, updatedAt:nowISO() }; }
    else {
      const os = list.filter(x=>typeof x.order==="number").map(x=>x.order);
      const ord = typeof row.order==="number" ? row.order : (os.length?Math.min(...os):0) - 1000;
      merged = { ...row, space: row.space || newItemSpace(), order:ord, id: row.id||uid(), createdAt:nowISO(), updatedAt:nowISO() };
    }
    // Track when a to-do entered "waiting" so stale follow-ups can be nudged.
    if(file==="todos"){
      if(merged.status==="waiting"){ if(!merged.waitingSince) merged.waitingSince = nowISO(); }
      else if(merged.waitingSince){ merged.waitingSince = null; }
    }
    if(i>=0){ next = list.slice(); next[i] = merged; }
    else { next = [merged, ...list]; }
    const nd = { ...dataRef.current, [file]:next }; dataRef.current = nd; setData(nd);
    markDirty(file, next);
    log("SAVE", file+" upsert "+(row.title||row.name||row.id||"").slice(0,40));
    pushDirty();
    return next.find(x => x.id === (row.id||merged.id));
  }, [markDirty, pushDirty]);

  const remove = useCallback((file, id) => {
    const next = (dataRef.current[file]||[]).filter(x => x.id !== id);
    const nd = { ...dataRef.current, [file]:next }; dataRef.current = nd; setData(nd);
    markDirty(file, next);
    log("SAVE", file+" delete "+id); pushDirty();
  }, [markDirty, pushDirty]);

  // Re-insert a previously-removed item exactly as it was (keeps id + order, so it
  // returns to its original spot). Used by Undo after a swipe-delete.
  const restore = useCallback((file, item) => {
    const cur = dataRef.current[file] || [];
    if(cur.some(x => x.id === item.id)){ log("SAVE","restore skipped, "+file+" "+item.id+" already present"); return; }
    const next = [...cur, item];
    const nd = { ...dataRef.current, [file]:next }; dataRef.current = nd; setData(nd);
    markDirty(file, next);
    log("SAVE", file+" restore "+item.id); pushDirty();
  }, [markDirty, pushDirty]);

  // Put a field value back onto specific items in one write. Used to UNDO a category/place
  // delete (which had cleared that label off N items).
  const restoreLabel = useCallback((field, entries, value) => {
    const d = {}; FILES.forEach(f => d[f] = (dataRef.current[f]||[]).slice());
    const touched = new Set();
    (entries||[]).forEach(({file,id}) => {
      const i = d[file].findIndex(x => x.id===id);
      if(i>=0){ d[file][i] = { ...d[file][i], [field]:value, updatedAt:nowISO() }; touched.add(file); }
    });
    dataRef.current = d; setData(d);
    touched.forEach(f => markDirty(f, d[f]));
    log("SAVE","restoreLabel "+field+"='"+value+"' on "+(entries?entries.length:0)+" items");
    pushDirty();
  }, [markDirty, pushDirty]);

  // bulk add (used by AI capture review)
  const bulkAdd = useCallback((file, rows) => {
    const os = (dataRef.current[file]||[]).filter(x=>typeof x.order==="number").map(x=>x.order);
    const minO = os.length?Math.min(...os):0;
    const stamped = rows.map((r,k) => ({ ...r, space: r.space || newItemSpace(), order: typeof r.order==="number"?r.order:(minO-1000*(rows.length-k)),
      id:uid(), createdAt:nowISO(), updatedAt:nowISO() }));
    const next = [...stamped, ...(dataRef.current[file]||[])];
    const nd = { ...dataRef.current, [file]:next }; dataRef.current = nd; setData(nd);
    markDirty(file, next);
    log("SAVE", file+" bulkAdd "+rows.length); pushDirty();
  }, [markDirty, pushDirty]);

  // Spin up a Project from a checklist template: create the project, then one open todo per
  // item under it. Both inherit the active Space (via upsert/bulkAdd). Returns the project.
  const createFromTemplate = useCallback((tpl, name) => {
    const proj = upsert("projects", { name: ((name||tpl.name||"Untitled").trim()) || "Untitled",
      type:"", status:"active", outcome:"", description:"", deadline:"", goalId:null });
    const rows = (tpl.items||[]).map(s=>String(s||"").trim()).filter(Boolean)
      .map(title => ({ title, status:"next", projectId: proj.id }));
    if(rows.length) bulkAdd("todos", rows);
    log("TEMPLATE","new project from template '"+(tpl.name||"?")+"' ("+rows.length+" items)");
    return proj;
  }, [upsert, bulkAdd]);

  // Complete a todo. If it recurs, mark this instance done AND spawn the next
  // occurrence with the due date rolled forward. Centralized so every "done" path
  // (row checkbox, Now view) behaves the same.
  const completeTodo = useCallback((todo) => {
    upsert("todos", { id:todo.id, status:"done", completedAt:nowISO() });
    if(todo.recur && todo.recur!=="none"){
      const clone = { ...todo };
      delete clone.id;                                  // bulkAdd assigns a fresh id
      clone.status = "next";
      clone.completedAt = null;
      clone.starredToday = false;
      clone.due = nextDue(todo.due, todo.recur);
      clone.subtasks = (todo.subtasks||[]).map(s => ({ ...s, id:uid(), done:false })); // reset checklist
      bulkAdd("todos", [clone]);
      log("SAVE", "recurring "+todo.recur+" -> next due "+clone.due);
    }
  }, [upsert, bulkAdd]);

  // Rename a value across every item that uses it (e.g. category 'type' or 'location').
  // This is what makes renaming a category/location in Settings actually relabel the
  // items already tagged with the old name, instead of leaving them orphaned.
  const relabel = useCallback((field, oldVal, newVal) => {
    let touched = 0;
    const nd = { ...dataRef.current };
    FILES.forEach(f => {
      const list = dataRef.current[f] || [];
      let changed = false;
      const next = list.map(x => {
        if(x[field] === oldVal){ changed = true; touched++; return { ...x, [field]:newVal, updatedAt:nowISO() }; }
        return x;
      });
      if(changed){ nd[f] = next; markDirty(f, next); }
    });
    dataRef.current = nd; setData(nd);
    log("SAVE", "relabel "+field+" '"+oldVal+"' -> '"+newVal+"' ("+touched+" items)");
    pushDirty();
    return touched;
  }, [markDirty, pushDirty]);

  // Apply an approved AI plan as ONE batched change (creates + updates), then one push.
  const applyPlan = useCallback((plan) => {
    const d = {}; FILES.forEach(f => { d[f] = (dataRef.current[f]||[]).slice(); });
    const tmp = {}; let created = 0, updated = 0; const touched = new Set();
    const minOrder = (file) => { const os = d[file].filter(x=>typeof x.order==="number").map(x=>x.order); return os.length?Math.min(...os):0; };
    const addTop = (file, row) => {
      const id = row.id || uid();
      d[file] = [{ ...row, space: row.space || newItemSpace(), id, order:minOrder(file)-1000, createdAt:nowISO(), updatedAt:nowISO() }, ...d[file]];
      created++; touched.add(file); return id;
    };
    (plan||[]).filter(o=>o.op==="create_project").forEach(o=>{
      const id = addTop("projects", { name:o.name||"Untitled project", type:o.type||"", status:o.status||"active",
        outcome:o.outcome||"", description:o.description||"", deadline:o.deadline||"", goalId:o.goalId||null });
      if(o.tmpId) tmp[o.tmpId] = id;
    });
    (plan||[]).filter(o=>o.op==="create_goal").forEach(o=>addTop("goals", { name:o.name||"Untitled goal", type:o.type||"", why:o.why||"", status:"active", target:o.target||"" }));
    (plan||[]).filter(o=>o.op==="create_idea").forEach(o=>addTop("ideas", { title:o.title||"Untitled", body:o.body||"", type:o.type||"", state:"raw", capturedAt:nowISO(), tags:o.tags||[] }));
    (plan||[]).filter(o=>o.op==="create_todo").forEach(o=>{
      let pid = o.projectId||null; if(pid && tmp[pid]) pid = tmp[pid];
      addTop("todos", { title:o.title||"Untitled", status:o.status||"inbox", type:o.type||"", quad:o.quad||"", due:o.due||"",
        defer:o.defer||"", location:o.location||"", projectId:pid, tags:o.tags||[], notes:o.notes||"",
        subtasks:(o.subtasks||[]).map(s=>({ id:uid(), title:(typeof s==="string"?s:(s.title||"")), done:false })) });
    });
    (plan||[]).filter(o=>o.op==="update_todo").forEach(o=>{
      if(!o.id) return; const i = d.todos.findIndex(t=>t.id===o.id); if(i<0) return;
      const patch = {};
      ["status","type","quad","due","defer","location","notes"].forEach(k=>{ if(o[k]!==undefined) patch[k]=o[k]; });
      if(o.projectId!==undefined) patch.projectId = tmp[o.projectId] || o.projectId;
      if(o.tags!==undefined) patch.tags = o.tags;
      d.todos[i] = { ...d.todos[i], ...patch, updatedAt:nowISO() }; updated++; touched.add("todos");
    });
    // Lets the organizer work the raw jot pile: retitle, categorize, and move a note to
    // "promoted" (turned into work) or "kept" (reference worth keeping).
    (plan||[]).filter(o=>o.op==="update_idea").forEach(o=>{
      if(!o.id) return; const i = d.ideas.findIndex(x=>x.id===o.id); if(i<0) return;
      const patch = {};
      ["title","body","type","state"].forEach(k=>{ if(o[k]!==undefined) patch[k]=o[k]; });
      if(o.tags!==undefined) patch.tags = o.tags;
      d.ideas[i] = { ...d.ideas[i], ...patch, updatedAt:nowISO() }; updated++; touched.add("ideas");
    });
    dataRef.current = d; setData(d);
    touched.forEach(f => markDirty(f, d[f]));
    log("AI","applied plan: "+created+" created, "+updated+" updated, files="+[...touched].join(","));
    pushDirty();
    return { created, updated };
  }, [markDirty, pushDirty]);

  // Views read `data` SPACE-SCOPED - this is the focus/mute: when a Space is active, every
  // other Space is filtered out everywhere at once (no per-view plumbing to leak). Writes go
  // through the store methods on dataRef (full data), so nothing is ever lost. `allData` stays
  // full for backups/export. Falls back to showing everything if the active Space is gone.
  const scopedData = useMemo(() => {
    if(activeSpace === "all") return data;
    const sp = (spaces||[]).find(s => s.id === activeSpace);
    if(!sp || sp.archived) return data;   // active space gone or archived -> show everything (never a blank app)
    const out = {}; FILES.forEach(f => { out[f] = (data[f]||[]).filter(x => (x.space||DEFAULT_SPACE) === activeSpace); });
    return out;
  }, [data, activeSpace, spaces]);

  return { cfg, saveCfg, spaces, defaultSpace, saveSpaces, setDefaultSpaceId, activeSpace, setActiveSpace, templates, saveTemplates, createFromTemplate, habits, saveHabits, affirmations, saveAffirmations, orders, saveOrders, scratch, saveScratch, rundown, saveRundown, data: scopedData, allData: data, sync, syncMsg, online, dirty, authed, authEmail, authReady, recovery, signIn, signUp, signOut, deleteAccount, requestReset, updatePassword, pull, pushDirty, upsert, remove, restore, restoreLabel, bulkAdd, completeTodo, relabel, applyPlan, setSync };
}

/* ============================================================
   SMALL SHARED COMPONENTS
   ============================================================ */
function Sheet({ title, onClose, children, action }){
  const boxRef = useRef(null);
  /* A sheet must ALWAYS open at its top. Chris, 2026-08-14: opening a new to-do
     landed him half way down the form and he had to scroll back up to the title,
     which is the first thing he types.

     Three separate things scroll this container out from under you, which is why
     the fix is a repeated snap rather than a single scrollTop=0:
       1. autoFocus on the title fires while the sheet is still mid-slide-up, so
          the browser's scroll-into-view computes against a moving element;
       2. on iOS the software keyboard then shrinks the viewport and Safari
          scrolls again to keep the focused input visible;
       3. this sheet often replaces another one (the + menu) in the same commit.
     The last snap is timed just past the .32s slideup. */
  useEffect(() => {
    document.body.style.overflow="hidden";
    const snap = () => { if(boxRef.current) boxRef.current.scrollTop = 0; };
    snap();
    const raf = requestAnimationFrame(snap);
    const t1 = setTimeout(snap, 80);
    const t2 = setTimeout(snap, 360);
    return () => {
      document.body.style.overflow="";
      cancelAnimationFrame(raf); clearTimeout(t1); clearTimeout(t2);
    };
  }, []);
  // Portal to <body>. The scrim + sheet are position:fixed (viewport-anchored), but a
  // Sheet opened from inside a row (e.g. the snooze button) sits under SwipeRow's
  // .swipe-body, which has transform + will-change:transform - that makes it the
  // containing block for fixed descendants, so the sheet would anchor to the ROW and
  // get clipped by .swipe-wrap's overflow:hidden. The portal lifts it out of that.
  return ReactDOM.createPortal(
    <div>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet" role="dialog" ref={boxRef}>
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          {title && <h3 className="sheet-title">{title}</h3>}
          <div style={{display:"flex",alignItems:"center",gap:10,flex:"0 0 auto"}}>
            {action}
            <button className="sheet-x" onClick={onClose} aria-label="Cancel">{Ic.close}</button>
          </div>
        </div>
        {children}
      </div>
    </div>,
    document.body
  );
}
function Toast({ obj, onClose }){
  if(!obj) return null;
  return <div className={"toast"+(obj.fn?" toast-bar":"")}>
    <span>{obj.msg}</span>
    {obj.fn && <button className="toast-act" onClick={()=>{ obj.fn(); onClose && onClose(); }}>{obj.label||"Undo"}</button>}
  </div>;
}
function Empty({ glyph, title, sub }){
  return <div className="empty"><div className="glyph">{glyph||"\u2727"}</div><b style={{color:"var(--ink-2)",fontFamily:"Fraunces",fontSize:18}}>{title}</b><p>{sub}</p></div>;
}
function Check({ on, onClick }){
  return <button className={"check"+(on?" on":"")} onClick={onClick} aria-label="toggle">{Ic.check}</button>;
}
function TypeChip({ type }){
  if(!type) return null;                       // uncategorized items show no chip
  const h = catHue(type);
  return <span className="chip" style={{background:h+"22", color:h, border:"1px solid "+h+"55"}}>{type}</span>;
}

// Confirm dialog (destructive actions need a deliberate second tap, no traps)
function Confirm({ text, confirmLabel, onConfirm, onCancel }){
  return (
    <Sheet title="Are you sure?" onClose={onCancel}>

/* ============================================================
   CONVERT an item between entity types (todo/idea/project/goal).
   Destructive replace: creates the new entity, removes the old.
   ============================================================ */
const TYPE_FILE = { todo:"todos", idea:"ideas", project:"projects", goal:"goals" };
const FILE_NOUN = { todos:"todo", ideas:"idea", projects:"project", goals:"goal" };
function convertEntity(store, fromFile, item, toType, toast, onClose){
  // Pull common fields regardless of source shape (todos/ideas use title; projects/goals use name).
  const title = item.title || item.name || "";
  const body  = item.notes || item.body || item.description || item.outcome || item.why || "";
  const type  = item.type || "";
  const date  = item.due || item.deadline || item.target || "";
  const tags  = item.tags || [];
  let row;
  if(toType==="todo")         row = { title, notes:body, type, status:"inbox", due:date, tags, subtasks:[] };
  else if(toType==="idea")    row = { title, body, type, state:"raw", capturedAt:nowISO(), tags };
  else if(toType==="project") row = { name:title, type, status:"active", outcome:"", description:body, deadline:date, goalId:null };
  else if(toType==="goal")    row = { name:title, type, why:body, status:"active", target:date };
  store.upsert(TYPE_FILE[toType], row);
  store.remove(fromFile, item.id);
  log("SAVE","convert "+fromFile+" -> "+toType);
  toast("Converted to "+toType); onClose();
}
function ConvertRow({ store, fromFile, item, toast, onClose }){
  const [confirm,setConfirm]=useState(null);
  const opts = [["todo","Todo","todos"],["idea","Idea","ideas"],["project","Project","projects"],["goal","Goal","goals"]]
    .filter(o=>o[2]!==fromFile);
  return (
    <div style={{marginTop:16}}>
      <span className="label">Convert this into</span>
      <div className="pills">
        {opts.map(([t,l])=><button key={t} className="pill" onClick={()=>setConfirm(t)}>{l}</button>)}
      </div>
      {confirm && <Confirm
        text={"Convert this "+FILE_NOUN[fromFile]+" into a "+confirm+"? The original will be replaced, and fields that don't carry over are dropped."}
        confirmLabel={"Convert to "+confirm}
        onConfirm={()=>convertEntity(store, fromFile, item, confirm, toast, onClose)}
        onCancel={()=>setConfirm(null)}/>}
    </div>
  );
}

// The Space an editor should preselect: the item's own, else the active Space (or, in
// "All", the default). New items thus inherit the current focus, with the picker to override.
function editorSpace(store, t){
  return (t && t.space) || (store.activeSpace && store.activeSpace!=="all" ? store.activeSpace : (store.defaultSpace||DEFAULT_SPACE));
}
/* ── Decision: a choice among enumerated alternatives ────────────────────────
   Came out of four real use cases (a fee negotiation, an equity-option
   structure, purchases under consideration, travel). In three of the four the
   thing the app could not hold was always the same shape: here are the options,
   one of them eventually wins, and there is a reason it won.

   It ATTACHES to a container that already exists - a Rundown item or a note -
   rather than becoming a fifth entity, because the evidence showed the same
   object living in three different homes.

   `value` is free text on purpose. It has to hold "0.325%", "$650" and
   "30% + cleanup call" without making you pick a unit on a phone. Nothing
   aggregates it yet, so nothing needs it parsed; parse it the day something
   sums it, not before. */
function emptyDecision(){ return { question:"", candidates:[], chosenId:"", decidedAt:"", why:"" }; }
function decisionHasContent(d){ return !!(d && (String(d.question||"").trim() || (d.candidates||[]).length)); }
function decisionIsOpen(d){ return decisionHasContent(d) && !d.chosenId; }
// Normalize on save: drop blank options, and never let chosenId point at an
// option that was deleted (that would render as "decided" with nothing picked).
function cleanDecision(d){
  if(!decisionHasContent(d)) return null;
  const cands = (d.candidates||[]).filter(c=>String(c.label||"").trim())
    .map(c=>({ id:c.id||uid(), label:String(c.label).trim(), value:String(c.value||"").trim() }));
  const chosenId = cands.some(c=>c.id===d.chosenId) ? d.chosenId : "";
  return { question:String(d.question||"").trim(), candidates:cands, chosenId,
           decidedAt: chosenId ? (d.decidedAt||nowISO()) : "",
           why: chosenId ? String(d.why||"").trim() : "" };
}
// One-line summary for a list row: the question, or failing that the options.
function decisionSummary(d){
  if(!decisionHasContent(d)) return "";
  const q = String(d.question||"").trim();
  if(q) return q;
  return (d.candidates||[]).map(c=>c.label).filter(Boolean).join(" / ");
}

function DecisionField({ value, onChange }){
  const d = value || emptyDecision();
  const [draft,setDraft]=useState("");
  const cands = d.candidates||[];
  const set = (patch)=> onChange({ ...d, ...patch });
  function add(){
    const l=draft.trim(); if(!l) return;
    set({ candidates:[...cands,{ id:uid(), label:l, value:"" }] }); setDraft("");
  }
  function upd(id,patch){ set({ candidates:cands.map(c=>c.id===id?{...c,...patch}:c) }); }
  function drop(id){
    set({ candidates:cands.filter(c=>c.id!==id),
          chosenId: d.chosenId===id?"":d.chosenId,
          decidedAt: d.chosenId===id?"":d.decidedAt,
          why: d.chosenId===id?"":d.why });
  }
  function pick(id){
    const off = d.chosenId===id;                      // tapping the chosen one re-opens it
    set({ chosenId: off?"":id, decidedAt: off?"":nowISO(), why: off?"":d.why });
  }
  return (
    <div className="field">
      <span className="label">Decision (optional)</span>
      <input className="input" value={d.question||""} onChange={e=>set({question:e.target.value})}
        placeholder="What has to be decided?"/>
      {cands.length>0 &&
        <div className="options">
          {cands.map(c=>
            <div key={c.id} className={"option"+(d.chosenId===c.id?" chosen":"")}>
              <button className={"pick"+(d.chosenId===c.id?" on":"")} onClick={()=>pick(c.id)}
                aria-pressed={d.chosenId===c.id} aria-label={"Choose "+c.label}></button>
              <input className="opt-label" value={c.label} onChange={e=>upd(c.id,{label:e.target.value})}
                aria-label="Option"/>
              <input className="opt-value" value={c.value} onChange={e=>upd(c.id,{value:e.target.value})}
                placeholder="0.325%" aria-label="Value"/>
              <button className="opt-x" onClick={()=>drop(c.id)} aria-label={"Remove "+c.label}>&times;</button>
            </div>)}
        </div>}
      <div className="row" style={{marginTop:8}}>
        <input className="input" value={draft} onChange={e=>setDraft(e.target.value)}
          placeholder="Add an option" onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:3}}/>
        <button className="btn btn-ghost btn-sm" onClick={add} style={{flex:1}}>Add</button>
      </div>
      {d.chosenId
        ? <input className="input" style={{marginTop:8}} value={d.why||""} onChange={e=>set({why:e.target.value})}
            placeholder="Why this one won (optional)"/>
        : cands.length>0 && <p className="hint">Undecided. Tap a circle to choose one.</p>}
    </div>
  );
}

/* Attach this item to one calendar event. Deliberately manual: no AI guessing
   that "book the Nashville flight" belongs to the Nashville trip.
   The picker fetches ACROSS ALL SPACES, not the active one - a Personal todo
   ("pack a suit") legitimately belongs to a Work trip, and space-filtering the
   list would silently hide the event you were looking for. */
function EventLinkField({ store, value, onChange, label }){
  const [picking,setPicking]=useState(false);
  const [events,setEvents]=useState(null);      // null = not fetched yet
  const [err,setErr]=useState("");
  const link = value || null;

  useEffect(()=>{
    if(!picking || events || err) return;
    let alive = true;
    (async()=>{
      try{
        const now = new Date();
        const end = new Date(now.getTime() + 89*86400000);   // backend caps the window at 90 days
        const res = await calEventsGet({ start:now.toISOString(), end:end.toISOString(), space:"all" });
        if(!alive) return;
        const list = mergeCalendarEvents((res && res.events) || []);
        setEvents(list);
        // If the trip moved while we were not looking, quietly refresh the snapshot.
        const r = resolveEventLink(link, list);
        if(r && r.moved) onChange(eventLinkFrom(r.event));
      }catch(ex){ if(alive) setErr(ex.message || "Couldn't load your calendar."); }
    })();
    return ()=>{ alive=false; };
  },[picking, events, err]);   // eslint-disable-line

  const when = (l)=>{
    const u = eventUntilLabel(l.start);
    const d = l.start ? new Date(l.start).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
    return [d, u].filter(Boolean).join(" · ");
  };
  return (
    <div className="field">
      <span className="label">{label || "On the calendar (optional)"}</span>
      {link &&
        <div className="evlink">
          <div className="evlink-body">
            <div className="evlink-title">{link.title || "Calendar event"}</div>
            <div className="evlink-when">{when(link)}</div>
          </div>
          <button className="opt-x" aria-label="Detach from this event"
            onClick={()=>{ onChange(null); setPicking(false); }}>&times;</button>
        </div>}
      {!picking &&
        <button className="btn btn-ghost btn-block" style={{marginTop:link?8:0}}
          onClick={()=>setPicking(true)}>{link ? "Attach to something else" : "Attach to a calendar event"}</button>}
      {picking && (
        err ? <p className="hint" style={{color:"var(--red)"}}>{err} Your existing link is unchanged.</p> :
        events===null ? <p className="hint">Loading your calendar...</p> :
        events.length===0 ? <p className="hint">Nothing on your calendar in the next 90 days.</p> :
        <div className="evpick">
          {events.map((e,i)=>
            <button key={(e.uid||"")+"|"+e.start+"|"+i} className="evrow"
              onClick={()=>{ onChange(eventLinkFrom(e)); setPicking(false); }}>
              <span className="evrow-dot" style={{background:(e.colors&&e.colors[0])||e.color||"#6f9bc4"}}></span>
              <span className="evrow-body">
                <span className="evrow-title">{e.title}</span>
                <span className="evrow-when">{when(e)}</span>
              </span>
            </button>)}
        </div>)}
      {picking && <button className="btn btn-ghost btn-block" style={{marginTop:8}}
        onClick={()=>setPicking(false)}>Cancel</button>}
    </div>
  );
}

// Reusable Space picker for the item editors (the "easy override control").
function SpaceField({ store, value, onChange }){
  const list = (store.spaces||[]).filter(s=>!s.archived).slice().sort((a,b)=>(a.order||0)-(b.order||0));
