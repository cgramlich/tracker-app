/* The scratch pad card. Lives at the TOP of Today, above Heads up: the whole
   point is that capture costs no scrolling and no taps, and a box you have to
   reach is a box you will not use when it matters.
   Today only. Tomorrow and 7 days are look-ahead screens you read, not screens
   you type into, and a pad repeated on all three would just be clutter. */
function ScratchCard({ store, toast, openAI }){
  const [draft,setDraft] = useState("");
  const [expanded,setExpanded] = useState(false);
  const lines = scratchLines(store.scratch);
  const SHOWN = 4;
  const visible = expanded ? lines : lines.slice(0, SHOWN);
  const hidden = lines.length - visible.length;
  function add(){
    const next = addScratchLine(store.scratch, draft);
    if(!next) return;                      // nothing typed; leave the pad alone
    store.saveScratch(next);
    setDraft("");                          // cursor stays put, ready for the next one
    log("SCRATCH","line added ("+next.length+" on pad)");
  }
  function drop(id){
    store.saveScratch(lines.filter(l => l.id !== id));
    toast && toast("Removed");
  }
  function clearAll(){
    store.saveScratch([]);
    setExpanded(false);
    toast && toast("Pad cleared");
    log("SCRATCH","pad cleared");
  }
  /* Hands the pad to the EXISTING brain-dump review flow rather than calling the
     model here: that flow already shows every proposed item for approval before
     anything is saved, and duplicating it would mean a second, less-reviewed
     path into the same stores. The pad is deliberately NOT cleared - Chris may
     back out of that screen, and a draft that vanished on the way would be a
     draft he lost. He clears it when he can see the items landed. */
  function organize(){
    const seed = scratchSeedText(store.scratch);
    if(!seed) return;
    lsSet("aiSeed", seed);
    log("SCRATCH","organize -> aichat ("+lines.length+" lines)");
    openAI();
  }
  return (
    <div className="card" style={{marginTop:14,padding:"12px 14px"}}>
      <div className="row" style={{gap:8}}>
        <input className="input" value={draft} onChange={e=>setDraft(e.target.value)}
          placeholder="Catch a thought..." aria-label="Scratch pad"
          onKeyDown={e=>{ if(e.key==="Enter") add(); }}
          style={{flex:1,minWidth:0}}/>
        <button className="btn btn-ghost btn-sm scr-btn" style={{flex:"0 0 auto"}}
          disabled={!draft.trim()} onClick={add}>Add</button>
      </div>
      {lines.length>0 && <div style={{marginTop:10}}>
        {visible.map(l=>
          <div key={l.id} className="row" style={{alignItems:"center",gap:8,background:"var(--bg)",marginBottom:6,padding:"8px 10px"}}>
            <span style={{flex:1,minWidth:0,fontSize:14,lineHeight:1.35,wordBreak:"break-word"}}>{l.text}</span>
            <button className="btn btn-ghost btn-sm scr-btn" style={{flex:"0 0 auto"}}
              aria-label={"Remove "+l.text} onClick={()=>drop(l.id)}>Clear</button>
          </div>)}
        {hidden>0 &&
          <button className="btn btn-ghost btn-sm btn-block scr-btn" onClick={()=>setExpanded(true)}>
            Show {hidden} more</button>}
        {expanded && lines.length>SHOWN &&
          <button className="btn btn-ghost btn-sm btn-block scr-btn" onClick={()=>setExpanded(false)}>Show less</button>}
        <div className="row" style={{marginTop:8,gap:8}}>
          <button className="btn btn-ghost btn-sm scr-btn" style={{flex:1,minWidth:0}} onClick={organize}>
            {Ic.sparkle} Organize with AI</button>
          <button className="btn btn-ghost btn-sm scr-btn" style={{flex:"0 0 auto"}} onClick={clearAll}>Clear all</button>
        </div>
      </div>}
    </div>
  );
}

function TodayView({ store, onOpen, goNow, typeFilter, del, toast, openAI }){
  const [habitOpen,setHabitOpen] = useState(null);
  // Which day the screen is showing. Deliberately NOT persisted: the useful
  // default is always "today", and a stale "tomorrow" left over from last night
  // would be a confusing thing to open the app into.
  const [day,setDay] = useState("today");
  const tomorrow = day==="tomorrow";
  const week = day==="week";
  const openHabit = (h)=> setHabitOpen(h);
  const inFilter = t => typeFilter==="all" || t.type===typeFilter;
  // Habits are no longer todos at all, so the main list needs no routine filter.
  // isRoutine() is kept only for the one-time migration of pre-habits data.
  const items = week ? []
    : (tomorrow ? tomorrowItems(store.data.todos) : todayItems(store.data.todos))
        .filter(inFilter).sort(sortTodos);
  const buckets = week
    ? weekBuckets(store.data.todos).map(b => ({ ...b, items:b.items.filter(inFilter).sort(sortTodos) }))
    : [];
  const thr = waitThreshold(store);
  // Follow-ups and stale-idea nudges are TODAY questions ("this has been waiting
  // 12 days"), so they are suppressed on tomorrow rather than recomputed for it.
  const followUps = (tomorrow||week) ? [] : store.data.todos
    .filter(t=>t.status==="waiting" && (typeFilter==="all"||t.type===typeFilter))
    .map(t=>({ t, d:waitingDays(t) }))
    .filter(x=>x.d!=null && x.d>=thr)
    .sort((a,b)=>b.d-a.d)
    .map(x=>x.t);
  const staleIdeas = (tomorrow||week) ? [] : store.data.ideas.filter(i=>{
    if(i.state==="promoted"||i.state==="discarded") return false;
    const age = (Date.now()-new Date(i.capturedAt||i.createdAt||Date.now()))/86400000;
    return age>=30;
  });
  const d = tomorrow ? tomorrowDate() : new Date();
  const th = tomorrow ? headsUpTomorrow(store.data.todos, habitsInSpace(store))
           : week     ? headsUpWeek(store.data.todos) : null;
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <div className="eyebrow">{week?"Ahead":d.toLocaleDateString(undefined,{weekday:"long"})}</div>
        <div className="topbar-row"><h1 className="title">{week?"Next 7 days":tomorrow?"Tomorrow":"Today"}</h1>
          {!tomorrow && !week && <button className="btn btn-ghost btn-sm" onClick={goNow}>{Ic.now} Focus</button>}</div>
        <div className="subtle" style={{marginTop:2}}>{week
          ? d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " - " +
            snzAddDays(WEEK_DAYS-1).toLocaleDateString(undefined,{month:"short",day:"numeric"})
          : d.toLocaleDateString(undefined,{month:"long",day:"numeric"})}</div>
      </div>
      {!tomorrow && !week && <AffirmationLine store={store}/>}
      <div className="seg" style={{marginTop:12}}>
        <button className={"seg-b"+(!tomorrow && !week?" on":"")} onClick={()=>setDay("today")}>Today</button>
        <button className={"seg-b"+(tomorrow?" on":"")} onClick={()=>setDay("tomorrow")}>Tomorrow</button>
        <button className={"seg-b"+(week?" on":"")} onClick={()=>setDay("week")}>7 days</button>
      </div>
      {!tomorrow && !week && <ScratchCard store={store} toast={toast} openAI={openAI}/>}
      {(tomorrow||week)
        ? <div className="card" style={{marginTop:14}}>
            <div className="eyebrow" style={{marginBottom:6}}>Heads up</div>
            <p style={{fontFamily:"Fraunces",fontSize:16,lineHeight:1.45,margin:0,color:"var(--ink)"}}>{th.line}</p>
          </div>
        : <HeadsUpCard store={store}/>}
      {followUps.length>0 &&
        <div style={{marginTop:14}}>
          <div className="label" style={{display:"flex",alignItems:"center",gap:6}}>{Ic.clock} Follow up - waiting {thr}+ days</div>
          <div className="list" style={{marginTop:8}}>{followUps.map(t=><SwipeRow key={t.id} onDelete={()=>del("todos",t)}><TodoRow store={store} todo={t} onOpen={()=>onOpen(t)}/></SwipeRow>)}</div>
        </div>}
      {staleIdeas.length>0 &&
        <div className="card" style={{marginTop:14,borderColor:"var(--amber-line)",background:"var(--amber-dim)"}}>
          <b style={{fontFamily:"Fraunces",fontSize:15}}>Revisit your ideas</b>
          <p className="hint" style={{marginTop:4}}>{staleIdeas.length} idea{staleIdeas.length===1?"":"s"} untouched 30+ days. A quick review keeps the system trusted.</p>
        </div>}
      {week ? null
            : tomorrow ? <HabitsTomorrowCard store={store} onOpen={openHabit}/>
                       : <RoutinesCard store={store} onOpen={openHabit}/>}
      {week
        ? <div>
            {buckets.map(b=>
              <div key={b.key} style={{marginTop:14}}>
                <div className="label">{b.date.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"})}</div>
                {b.items.length===0
                  ? <p className="hint" style={{marginTop:4}}>Clear.</p>
                  : <div className="list" style={{marginTop:8}}>{b.items.map(t=>
                      <SwipeRow key={t.id} onDelete={()=>del("todos",t)}>
                        <TodoRow store={store} todo={t} onOpen={()=>onOpen(t)}/></SwipeRow>)}</div>}
              </div>)}
          </div>
        : items.length===0
        ? (tomorrow
            ? <Empty glyph={"☾"} title="Tomorrow is clear" sub="Nothing is due or deferred to tomorrow yet."/>
            : <Empty glyph={"☀"} title="Nothing scheduled" sub="Star items for today, or set a due date."/>)
        : <div className="list">{items.map(t=><SwipeRow key={t.id} onDelete={()=>del("todos",t)}><TodoRow store={store} todo={t} onOpen={()=>onOpen(t)}/></SwipeRow>)}</div>}
      {habitOpen && <HabitSheet store={store} habit={habitOpen} toast={toast} onClose={()=>setHabitOpen(null)}/>}
    </div>
  );
}

/* ============================================================
   VIEW: NOW / FOCUS  (single next action)
   ============================================================ */
function NowView({ store, onOpen, back }){
  const candidates = store.data.todos
    .filter(t=>t.status==="next"||todayItems([t]).length>0)
    .filter(t=>t.status!=="done").sort(sortTodos);
  const [idx,setIdx]=useState(0);
  const t = candidates[idx];
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <button className="btn btn-ghost btn-sm" onClick={back}>{Ic.back} Back</button>
        <h1 className="title" style={{marginTop:8}}>Now</h1>
      </div>
      {!t ? <Empty glyph={"\u25CB"} title="All clear" sub="No next action queued. Nice."/> :
        <div style={{marginTop:30}}>
          <div className="card" style={{padding:24,textAlign:"center"}}>
            <div className="subtle" style={{marginBottom:10}}>{t.quad?QUADRANTS[t.quad].label:"Next action"}</div>
            <h2 style={{fontSize:24,lineHeight:1.25}}>{t.title}</h2>
            {t.notes && <p className="hint" style={{marginTop:10}}>{t.notes}</p>}
          </div>
          <button className="btn btn-primary btn-block" style={{marginTop:18}}
            onClick={()=>{ store.completeTodo(t); setIdx(0); }}>Mark done</button>
          <div className="row" style={{marginTop:10}}>
            <button className="btn btn-ghost" onClick={()=>setIdx((idx+1)%candidates.length)}>Skip</button>
            <button className="btn btn-ghost" onClick={()=>onOpen(t)}>Edit</button>
          </div>
          <p className="hint center" style={{marginTop:14}}>{idx+1} of {candidates.length}</p>
        </div>}
    </div>
  );
}

/* ============================================================
   VIEW: LISTS  (GTD statuses, filterable)
   ============================================================ */
function ListsView({ store, onOpen, typeFilter, setTypeFilter, locFilter, setLocFilter, del, toast }){
  const TABS = ["all", ...STATUS_ORDER];     // "all" = every active to-do in one list
  const [tab,setTab]=useState("all");
  const [sortMode,setSortMode]=useState(()=>lsGet("todoSort","manual")); // 'manual' = your drag order, 'smart' = priority/due
  useEffect(()=>{ lsSet("todoSort", sortMode); },[sortMode]);
  const [showDone,setShowDone]=useShowDone();  // show/hide completed on the combined "all" list
  // Bulk multi-select: tap "Select", tick items, then act on all at once.
  const [selMode,setSelMode]=useState(false);
  const [sel,setSel]=useState(()=>new Set());
  const [bulkSnooze,setBulkSnooze]=useState(false);
  const [bulkMoveOpen,setBulkMoveOpen]=useState(false);
  const [confirmDel,setConfirmDel]=useState(false);
  const byId = (id) => store.data.todos.find(t=>t.id===id);
  const toggleSel = (id) => setSel(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  const exitSel = () => { setSelMode(false); setSel(new Set()); setBulkSnooze(false); setBulkMoveOpen(false); setConfirmDel(false); };
  function bulkComplete(){ sel.forEach(id=>{ const t=byId(id); if(t && t.status!=="done") store.completeTodo(t); }); exitSel(); }
  function bulkDelete(){ sel.forEach(id=>store.remove("todos", id)); exitSel(); }
  // Re-file every selected todo under `pid` ("" = unfile). `label` is passed from the
  // MoveSheet so the toast is correct even for a just-created project.
  function bulkMove(pid, label){ const n=sel.size; sel.forEach(id=>{ const t=byId(id); if(t) store.upsert("todos",{ id:t.id, projectId:pid }); }); exitSel(); if(toast) toast("Moved "+n+" to "+label); }
  const locs = knownLocations(store);
  // A location filter shows that place's items PLUS "anywhere" (blank) items - GTD contexts.
  const matchLoc = (t) => locFilter==="all" || !t.location || t.location===locFilter;
  const passType = (t) => typeFilter==="all"||t.type===typeFilter;
  const counts = {};
  counts.all = store.data.todos.filter(t=>t.status!=="done"&&passType(t)&&matchLoc(t)&&!isDeferredAway(t)).length;
  STATUS_ORDER.forEach(s=>{ counts[s]=store.data.todos.filter(t=>t.status===s&&passType(t)&&matchLoc(t)).length; });
  let items = store.data.todos
    .filter(t=> (tab==="all" ? t.status!=="done" : t.status===tab) && passType(t) && matchLoc(t))
    .filter(t=> (tab==="someday"||tab==="done") ? true : !isDeferredAway(t))
    .sort(sortMode==="smart" ? sortTodos : byOrder);
  // Completed to-dos for the "all" list: counted always (drives the toggle label),
  // but only rendered when "Show done" is on. Kept out of the DragList so completing
  // an item never disturbs the manual drag order of active work.
  const doneAll = store.data.todos.filter(t=>t.status==="done"&&passType(t)&&matchLoc(t)).sort(sortTodos);
  const doneItems = (tab==="all" && showDone) ? doneAll : [];
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <div className="eyebrow">Organize</div>
        <div className="topbar-row"><h1 className="title">To-Dos</h1>
          <button className="btn btn-ghost btn-sm" onClick={()=>{ if(selMode) exitSel(); else setSelMode(true); }}>{selMode?"Cancel":"Select"}</button></div>
      </div>
      <div className="pills">
        {["all",...knownCategories(store)].map(f=><button key={f} className={"pill"+(typeFilter===f?" on":"")} onClick={()=>setTypeFilter(f)}>{f[0].toUpperCase()+f.slice(1)}</button>)}
      </div>
      {locs.length>0 &&
        <div className="pills">
          <button className={"pill"+(locFilter==="all"?" on":"")} onClick={()=>setLocFilter("all")}>Any place</button>
          {locs.map(l=><button key={l} className={"pill"+(locFilter===l?" on":"")} onClick={()=>setLocFilter(l)}>{l}</button>)}
        </div>}
      <div className="tabs">
        {TABS.map(s=><button key={s} className={"tab"+(tab===s?" on":"")} onClick={()=>setTab(s)}>{s[0].toUpperCase()+s.slice(1)} {counts[s]>0&&<span style={{opacity:.6}}>{counts[s]}</span>}</button>)}
      </div>
      {!selMode &&
        <div className="sortrow">
          <div className="seg">
            <button className={"seg-b"+(sortMode==="manual"?" on":"")} onClick={()=>setSortMode("manual")}>Manual</button>
            <button className={"seg-b"+(sortMode==="smart"?" on":"")} onClick={()=>setSortMode("smart")}>Smart</button>
          </div>
          <span className="sortlbl">{sortMode==="manual" ? "Your drag order - hold the grip to reorder" : "Auto: priority, then due date"}</span>
        </div>}
      {tab==="all" && <DoneToggle showDone={showDone} setShowDone={setShowDone} n={doneAll.length}/>}
      {locFilter!=="all" && <p className="hint" style={{marginTop:8}}>Showing {locFilter} + any-place items.</p>}
      {items.length===0 && doneItems.length===0 ? <Empty glyph={"\u2014"} title={tab==="all"?"No to-dos yet":"No "+tab+" items"} sub={tab==="inbox"||tab==="all"?"Capture with the + button.":"Move items here as you organize."}/> :
        selMode ?
          <div className="list">
            {items.map(t=>{ const on=sel.has(t.id);
              return <div key={t.id} onClick={()=>toggleSel(t.id)} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",borderRadius:12,padding:"1px 4px",background:on?"var(--amber-dim)":"transparent"}}>
                <span style={{flex:"0 0 auto",width:24,height:24,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",border:"2px solid "+(on?"var(--amber)":"var(--line-2)"),background:on?"var(--amber)":"transparent",color:"var(--bg)"}}>{on && Ic.check}</span>
                <div style={{flex:1,pointerEvents:"none"}}><TodoRow store={store} todo={t} onOpen={()=>{}}/></div>
              </div>; })}
            <div style={{height:72}}></div>
          </div>
        :
        <>
          {items.length>0 && <DragList items={items} getId={t=>t.id} reorderable={sortMode==="manual"} onReorder={(id,ids)=>reorderItem(store,"todos",id,ids,items)} onDelete={t=>del("todos",t)}
            render={t=><TodoRow store={store} todo={t} onOpen={()=>onOpen(t)}/>}/>}
          {doneItems.length>0 && <>
            <div className="sortlbl" style={{margin:"16px 4px 8px"}}>Completed</div>
            <div className="list">{doneItems.map(t=><TodoRow key={t.id} store={store} todo={t} onOpen={()=>onOpen(t)}/>)}</div>
          </>}
        </>}
      {selMode &&
        <div style={{position:"fixed",left:0,right:0,bottom:"calc(var(--nav-h) + env(safe-area-inset-bottom))",zIndex:45,background:"var(--bg-2)",borderTop:"1px solid var(--line)",padding:"10px 16px",display:"flex",gap:6,rowGap:8,flexWrap:"wrap",alignItems:"center"}}>
          <span className="label" style={{marginRight:"auto"}}>{sel.size} selected</span>
          <button className="btn btn-ghost btn-sm" onClick={()=>setSel(sel.size===items.length&&items.length?new Set():new Set(items.map(t=>t.id)))}>{sel.size===items.length&&items.length?"Clear":"All"}</button>
          <button className="btn btn-ghost btn-sm" disabled={!sel.size} onClick={bulkComplete}>Done</button>
          <button className="btn btn-ghost btn-sm" disabled={!sel.size} onClick={()=>sel.size&&setBulkSnooze(true)}>Snooze</button>
          <button className="btn btn-ghost btn-sm" disabled={!sel.size} onClick={()=>sel.size&&setBulkMoveOpen(true)}>Move</button>
          <button className="btn btn-ghost btn-sm" disabled={!sel.size} style={{color:"var(--danger,#d9744f)"}} onClick={()=>sel.size&&setConfirmDel(true)}>Delete</button>
        </div>}
      {bulkSnooze && <SnoozeSheet onPick={(iso)=>{ sel.forEach(id=>{ const t=byId(id); if(t) snoozeTodo(store,t,iso); }); exitSel(); }} onClose={()=>setBulkSnooze(false)}/>}
      {bulkMoveOpen && <MoveSheet store={store} onPick={bulkMove} onClose={()=>setBulkMoveOpen(false)}/>}
      {confirmDel && <Confirm text={"Delete "+sel.size+" item"+(sel.size===1?"":"s")+"? This can't be undone."} confirmLabel="Delete" onConfirm={bulkDelete} onCancel={()=>setConfirmDel(false)}/>}
    </div>
  );
}

/* ============================================================
   VIEW: MATRIX (Eisenhower)
   ============================================================ */
function MatrixView({ store, onOpen, typeFilter, setTypeFilter, locFilter, setLocFilter }){
  const locs = knownLocations(store);
  const matchLoc = (t) => locFilter==="all" || !t.location || t.location===locFilter;
  const active = store.data.todos.filter(t=>t.status!=="done"&&t.status!=="someday"&&!isDeferredAway(t)&&(typeFilter==="all"||t.type===typeFilter)&&matchLoc(t));
  const byQ = {q1:[],q2:[],q3:[],q4:[]};
  active.forEach(t=>{ if(t.quad&&byQ[t.quad]) byQ[t.quad].push(t); });
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <div className="eyebrow">Prioritize</div><h1 className="title">Matrix</h1>
        <div className="subtle" style={{marginTop:2}}>Eisenhower: urgent x important</div>
      </div>
      <div className="pills">
        {["all",...knownCategories(store)].map(f=><button key={f} className={"pill"+(typeFilter===f?" on":"")} onClick={()=>setTypeFilter(f)}>{f[0].toUpperCase()+f.slice(1)}</button>)}
      </div>
      {locs.length>0 &&
        <div className="pills">
          <button className={"pill"+(locFilter==="all"?" on":"")} onClick={()=>setLocFilter("all")}>Any place</button>
          {locs.map(l=><button key={l} className={"pill"+(locFilter===l?" on":"")} onClick={()=>setLocFilter(l)}>{l}</button>)}
        </div>}
      <div className="matrix">
        {Object.entries(QUADRANTS).map(([k,v])=>
          <div key={k} className={"quad "+v.cls}>
            <div className="quad-head"><b>{v.label}</b><span className="quad-count">{byQ[k].length}</span></div>
            <div className="subtle" style={{fontSize:10,marginTop:-6,marginBottom:8}}>{v.hint}</div>
            {byQ[k].sort(sortTodos).map(t=><div key={t.id} className="quad-item" onClick={()=>onOpen(t)}>{t.title}</div>)}
            {byQ[k].length===0 && <div className="subtle" style={{fontSize:11}}>Empty</div>}
          </div>)}
      </div>
      <p className="hint" style={{marginTop:14}}>Unprioritized todos won't appear here. Set a priority in any todo to place it.</p>
    </div>
  );
}

   VIEW: PROJECTS

/* ============================================================
   TEMPLATES - reusable checklists. Save a project's open todos as a named template, then
   spin up a fresh project + those items in one tap (e.g. a packing list per trip). Stored
   in the meta object (no backend change).
   ============================================================ */
function SaveTemplateSheet({ store, defaultName, items, onClose, toast }){
  const [name,setName]=useState(defaultName||"");
  const clean = (items||[]).map(s=>String(s||"").trim()).filter(Boolean);
  function save(){
    const n=name.trim(); if(!n){ toast&&toast("Name the template"); return; }
    if(!clean.length){ toast&&toast("No open items to save"); return; }
    const existing = store.templates||[];
    const without = existing.filter(t=>(t.name||"").toLowerCase()!==n.toLowerCase());   // same name -> replace
    store.saveTemplates([...without, { id:uid(), name:n, items:clean }]);
    toast&&toast("Saved template \""+n+"\" ("+clean.length+" item"+(clean.length===1?"":"s")+")");
    onClose();
  }
  return (
    <Sheet title="Save as template" onClose={onClose}>
      <div className="field"><span className="label">Template name</span>
        <input className="input" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Packing" autoFocus/></div>
      <p className="hint" style={{marginTop:6}}>Saves this project's {clean.length} open item{clean.length===1?"":"s"} as a reusable checklist. Reuse it later with "New from template". Saving with an existing name replaces it.</p>
      <button className="btn btn-primary btn-block" style={{marginTop:12}} onClick={save}>Save template</button>
    </Sheet>
  );
}
/* Settings > Habits. The only place a habit is CREATED - the Today card is for
   ticking them, and it hides itself when there are none, so without this a user
   with zero habits would have no way in. */
function HabitsEditor({ store, toast }){
  const list = store.habits || [];
  const [adding,setAdding] = useState("");
  const [cadence,setCadence] = useState("daily");
  function add(){
    const n = adding.trim(); if(!n) return;
    store.saveHabits(list.concat([{ id:uid(), name:n, cadence, space:store.activeSpace&&store.activeSpace!=="all"?store.activeSpace:(store.defaultSpace||DEFAULT_SPACE),
      type:"", startedAt:TODAY(), done:[] }]));
    setAdding(""); toast && toast("Habit added");
  }
  function rename(id, v){ const n=(v||"").trim(); if(n) store.saveHabits(list.map(h=>h.id===id?{...h,name:n}:h)); }
  function del(id){ store.saveHabits(list.filter(h=>h.id!==id)); toast && toast("Habit deleted"); }
  return (
    <div>
      {list.map(h=>{
        const r = habitRecent(h,30);
        return (
          <div key={h.id} className="row" style={{alignItems:"center",gap:8,background:"var(--bg)",marginBottom:6}}>
            <input className="input" defaultValue={h.name} onBlur={e=>rename(h.id,e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }} style={{flex:1,minWidth:90}} aria-label="Habit name"/>
            <span className="chip" style={{flex:"0 0 auto"}}>{r.hit}/{r.expected}</span>
            <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>del(h.id)}>Delete</button>
          </div>
        );
      })}
      <div className="row" style={{marginTop:8}}>
        <input className="input" value={adding} onChange={e=>setAdding(e.target.value)} placeholder="New habit"
          onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:2,minWidth:90}}/>
        <select className="select" value={cadence} onChange={e=>setCadence(e.target.value)} style={{flex:1,minWidth:90}}>
          {Object.keys(HABIT_CADENCES).map(k=><option key={k} value={k}>{HABIT_CADENCES[k]}</option>)}
        </select>
      </div>
      <button className="btn btn-ghost btn-block" style={{marginTop:8}} disabled={!adding.trim()} onClick={add}>Add habit</button>
      <p className="hint" style={{marginTop:8}}>Habits are things you do on a cadence, not tasks with a deadline. They show on
        Today in their own card and never appear in your to-do list. The number is how many of the last 30 expected days you hit.</p>
    </div>
  );
}

/* Settings > Affirmations. The only place they are created - the Today line is
   read-only by design, so without this there would be no way in. */
function AffirmationsEditor({ store, toast }){
  const list = store.affirmations || [];
  const [draft,setDraft] = useState("");
  function add(){
    const t = draft.trim(); if(!t) return;
    store.saveAffirmations(list.concat([{ id:uid(), text:t, addedAt:nowISO() }]));
    setDraft(""); toast && toast("Affirmation added");
  }
  function edit(id, v){ const t=(v||"").trim(); if(t) store.saveAffirmations(list.map(a=>a.id===id?{...a,text:t}:a)); }
  function del(id){ store.saveAffirmations(list.filter(a=>a.id!==id)); toast && toast("Removed"); }
  const today = affirmationOfTheDay(list, TODAY());
  return (
    <div>
      {list.map(a=>
        <div key={a.id} className="row" style={{alignItems:"center",gap:8,background:"var(--bg)",marginBottom:6}}>
          <input className="input" defaultValue={a.text} onBlur={e=>edit(a.id,e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }} style={{flex:1,minWidth:90}} aria-label="Affirmation"/>
          {today && today.id===a.id && <span className="chip amber" style={{flex:"0 0 auto"}}>Today</span>}
          <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>del(a.id)}>Delete</button>
        </div>)}
      <div className="row" style={{marginTop:8}}>
        <input className="input" value={draft} onChange={e=>setDraft(e.target.value)}
          placeholder="Something worth reading again" onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:1,minWidth:90}}/>
      </div>
      <button className="btn btn-ghost btn-block" style={{marginTop:8}} disabled={!draft.trim()} onClick={add}>Add affirmation</button>
      <p className="hint" style={{marginTop:8}}>One shows at the top of Today, rotating daily. There is nothing to tick -
        an affirmation is read, not done, so it never counts as outstanding work.</p>
    </div>
  );
}

function TemplatesEditor({ store, toast }){

/* ============================================================
   VIEW: WEEKLY REVIEW (lightweight guided checklist)
   Steps reset each session; tapping a step jumps to its view.
   ============================================================ */
function WeeklyReview({ store, back, go }){
  const [done,setDone]=useState({});
  const inbox = store.data.todos.filter(t=>t.status==="inbox").length;
  const waiting = store.data.todos.filter(t=>t.status==="waiting").length;
  const someday = store.data.todos.filter(t=>t.status==="someday").length;
  const noNext = store.data.projects.filter(p=>p.status==="active" &&
    store.data.todos.filter(t=>t.projectId===p.id&&t.status==="next").length===0).length;
  const steps = [
    { k:"inbox", b:"Process Inbox to zero", p:inbox+" item"+(inbox===1?"":"s")+" waiting", go:()=>go("lists") },
    { k:"next", b:"Review Next actions", p:"Still the right next steps?", go:()=>go("lists") },
    { k:"waiting", b:"Review Waiting-for", p:waiting+" item"+(waiting===1?"":"s")+" - nudge anyone?", go:()=>go("lists") },
    { k:"someday", b:"Review Someday / maybe", p:someday+" parked - anything ready to activate?", go:()=>go("lists") },
    { k:"projects", b:"Every active project has a next action", p:noNext>0? noNext+" project"+(noNext===1?"":"s")+" missing one":"All projects covered", go:()=>go("projects") },
    { k:"goals", b:"Glance at your goals", p:"Are projects still serving them?", go:()=>go("goals") },
  ];
  const completed = Object.values(done).filter(Boolean).length;
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <button className="btn btn-ghost btn-sm" onClick={back}>{Ic.back} Back</button>
        <h1 className="title" style={{marginTop:8}}>Weekly Review</h1>
        <div className="subtle" style={{marginTop:2}}>{completed} of {steps.length} done - GTD's keystone habit</div>
      </div>
      <div className="steps">
        {steps.map((s,i)=>
          <div key={s.k} className={"step"+(done[s.k]?" done":"")}>
            <button className="step-n" onClick={()=>setDone({...done,[s.k]:!done[s.k]})}>{done[s.k]?Ic.check:i+1}</button>
            <div style={{flex:1}} onClick={s.go}><b>{s.b}</b><p>{s.p}</p></div>
          </div>)}
      </div>
      {completed===steps.length && <div className="card center" style={{marginTop:16,borderColor:"var(--amber-line)"}}>
        <b style={{fontFamily:"Fraunces",fontSize:17}}>Review complete</b><p className="hint" style={{marginTop:4}}>Mind like water. See you next week.</p></div>}
    </div>
  );
}

/* ============================================================
   EDITABLE LABEL ROW (shared by Locations + Categories editors)
   - Edits in a local buffer; commits on blur / Enter (so a rename is one
     deliberate change, not one per keystroke).
   - Commit cascades: every item tagged with the old value is relabeled.
   - Delete is by swiping the row left (no X button - swipe handles it).
   ============================================================ */
function EditableLabelRow({ value, color, count, onCommit, onRemove }){
  const [v,setV]=useState(value);
  const [confirm,setConfirm]=useState(false);
  useEffect(()=>{ setV(value); },[value]);
  const commit=()=>{ const t=v.trim(); if(!t || t===value){ setV(value); return; } onCommit(t); };
  return (
    <div style={{marginBottom:8}}>
      <SwipeRow onDelete={()=>setConfirm(true)}>
        <div className="row" style={{alignItems:"center",background:"var(--bg)"}}>
          {color && <span className="chip" style={{flex:"0 0 auto",background:color+"22",color,border:"1px solid "+color+"55"}}>{value||"?"}</span>}
          <input className="input" value={v} style={{flex:1}} aria-label="Rename" onChange={e=>setV(e.target.value)} onBlur={commit}
            onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }}/>
        </div>
      </SwipeRow>
      {confirm && <Confirm
        text={count>0 ? ("Delete \""+value+"\"? It will be cleared from "+count+" item"+(count===1?"":"s")+" (they become uncategorized).")
                      : ("Delete \""+value+"\"?")}
        confirmLabel="Delete" onConfirm={()=>{ onRemove(); setConfirm(false); }} onCancel={()=>setConfirm(false)}/>}
    </div>
  );
}
// How many items currently carry a given category(type)/location value. Uses allData:
// category/location management is global (every Space), not scoped to the active one.
function countUses(store, field, val){
  let n=0; FILES.forEach(f=>((store.allData||store.data)[f]||[]).forEach(x=>{ if(x[field]===val) n++; })); return n;
}

/* ============================================================
   MANAGE CALENDARS (Settings): add / rename / recolor / reassign Space / enable /
   delete .ics feeds. These are NOT in the synced store - they live server-side
   because the feed URL is a secret. We send the URL once and only ever get back
   { id, name, space, color, enabled, host_hint }.
   ============================================================ */
function CalendarsEditor({ store, toast }){
  const spaces = (store.spaces||[]).filter(s=>!s.archived).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const defSpace = (store.activeSpace && store.activeSpace!=="all") ? store.activeSpace : (store.defaultSpace||DEFAULT_SPACE);
  const [feeds,setFeeds]=useState(null);      // null = still loading
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const [name,setName]=useState("");
  const [url,setUrl]=useState("");
  const [space,setSpace]=useState(defSpace);
  const [color,setColor]=useState("#6f9bc4");

  const load = useCallback(async ()=>{
    setErr("");
    try{ const j = await calFeedsGet(); setFeeds((j && j.feeds) || []); }
    catch(e){ setErr(e.message||"Couldn't load calendars."); setFeeds([]); }
  },[]);
  useEffect(()=>{ load(); },[load]);

  async function add(){
    const n=name.trim(), u=url.trim();
    if(!n){ toast&&toast("Name the calendar"); return; }
    if(!u){ toast&&toast("Paste the .ics URL"); return; }
    setBusy(true); setErr("");
    try{
      const f = await calFeedAdd({ name:n, url:u, space, color });
      setUrl(""); setName("");                 // clear the secret out of the form immediately
      setFeeds(list=>[...(list||[]), f]);
      toast&&toast("Added \""+f.name+"\"");
    }catch(e){ setErr(e.message||"Couldn't add that feed."); }
    finally{ setBusy(false); }
  }
  async function patch(id, changes){
    try{
      const updated = await calFeedPatch(id, changes);
      setFeeds(list=>(list||[]).map(f=>f.id===id?updated:f));
    }catch(e){ setErr(e.message||"Update failed."); }
  }
  async function del(id, nm){
    try{
      await calFeedDelete(id);
      setFeeds(list=>(list||[]).filter(f=>f.id!==id));
      toast&&toast("Removed \""+nm+"\"");
    }catch(e){ setErr(e.message||"Delete failed."); }
  }

  return (
    <div>
      {err && <p className="hint danger-text" style={{marginTop:0}}>{err}</p>}
      {feeds===null && <p className="hint" style={{margin:0}}>Loading calendars...</p>}
      {feeds && feeds.length===0 && !err && <p className="hint" style={{margin:0}}>No calendars yet. Add one below.</p>}
      {feeds && feeds.map(f=>(
        <div key={f.id} className="row" style={{alignItems:"center",gap:8,flexWrap:"wrap",background:"var(--bg)",marginBottom:8}}>
          <input type="color" value={f.color||"#6f9bc4"} onChange={e=>patch(f.id,{color:e.target.value})} aria-label="Calendar color"
            style={{flex:"0 0 auto",width:34,height:34,padding:2,border:"1px solid var(--line-2)",borderRadius:9,background:"transparent"}}/>
          <input className="input" defaultValue={f.name} key={f.id+"|"+f.name} aria-label="Calendar name"
            onBlur={e=>{ const v=e.target.value.trim(); if(v && v!==f.name) patch(f.id,{name:v}); }}
            onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }} style={{flex:1,minWidth:110}}/>
          {spaces.length>0 &&
            <select className="select" style={{flex:"0 0 auto",width:120}} value={f.space} onChange={e=>patch(f.id,{space:e.target.value})}>
              {spaces.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>}
          <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>patch(f.id,{enabled:!f.enabled})}>{f.enabled?"On":"Off"}</button>
          <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>del(f.id,f.name)}>Delete</button>
          {f.host_hint && <span className="chip" style={{flex:"0 0 auto"}}>{f.host_hint}</span>}
        </div>
      ))}

      <div className="divider"></div>
      <div className="field">
        <span className="label">Add a calendar</span>
        <input className="input" value={name} onChange={e=>setName(e.target.value)} placeholder="Name (e.g. RTR work)" autoCapitalize="words"/>
        <input className="input" style={{marginTop:8}} value={url} onChange={e=>setUrl(e.target.value)}
          placeholder="Paste the .ics feed URL" autoCapitalize="none" autoCorrect="off" spellCheck="false"/>
        <div className="row" style={{marginTop:8,alignItems:"center"}}>
          {spaces.length>0 &&
            <select className="select" style={{flex:1}} value={space} onChange={e=>setSpace(e.target.value)}>
              {spaces.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>}
          <input type="color" value={color} onChange={e=>setColor(e.target.value)} aria-label="New calendar color"
            style={{flex:"0 0 auto",width:34,height:34,padding:2,border:"1px solid var(--line-2)",borderRadius:9,background:"transparent"}}/>
          <button className="btn btn-primary btn-sm" style={{flex:"0 0 auto"}} disabled={busy} onClick={add}>{busy? <span className="spin"></span> : "Add"}</button>
        </div>
      </div>
      <p className="hint" style={{marginTop:6}}>Google Calendar &gt; Settings &gt; pick a calendar &gt; Integrate calendar &gt; <b>Secret address in iCal format</b>. The URL is stored on the server and never shown again - only its host is displayed here.</p>
      <p className="hint" style={{marginTop:6}}>Heads up: Google refreshes these secret .ics feeds on its own schedule, so very recent edits can take a while to show up.</p>
    </div>
  );
}

function SpacesEditor({ store, toast, toastUndo }){
  const all = (store.spaces||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const active = all.filter(s=>!s.archived);
  const archived = all.filter(s=>s.archived);
  const def = store.defaultSpace;
  const [adding,setAdding]=useState("");
  const [removing,setRemoving]=useState(null);   // {space, to} - a pending remove+reassign
  const patch = (id, changes) => store.saveSpaces(all.map(s=>s.id===id?{...s,...changes}:s));
  function rename(id, v){ const n=(v||"").trim(); if(n) patch(id,{name:n}); }
  function archive(id){
    if(id===def){ toast&&toast("Make another Space the default first"); return; }
    store.saveSpaces(all.map(s=>s.id===id?{...s,archived:true}:s));
    if(store.activeSpace===id) store.setActiveSpace("all");
    toast&&toast("Space archived");
  }
  // Remove a Space for real. Unlike Archive, this deletes it from the list - so its
  // items MUST be reassigned first, or ensureSpaces would find them pointing at a
  // space that no longer exists and sweep them all into the default on the next pull.
  // That reassignment is the whole reason this is a two-step flow and not a button.
  function askRemove(s){
    if(s.id===def){ toast&&toast("Make another Space the default first"); return; }
    if(all.length<2){ toast&&toast("You need at least one Space"); return; }
    const fallback = (all.find(x=>x.id===def) || all.find(x=>x.id!==s.id));
    setRemoving({ space:s, to: fallback.id });
  }
  function doRemove(){
    const { space, to } = removing;
    const prevSpaces = all.map(s=>({...s}));                 // snapshot for undo
    const affected = [];
    FILES.forEach(f => ((store.allData||store.data)[f]||[]).forEach(x => {
      if(x.space===space.id) affected.push({ file:f, id:x.id });
    }));
    const n = store.relabel("space", space.id, to);           // move the items FIRST
    store.saveSpaces(all.filter(s=>s.id!==space.id));         // then drop the space
    if(store.activeSpace===space.id) store.setActiveSpace("all");
    setRemoving(null);
    const toName = (all.find(s=>s.id===to)||{}).name || "another Space";
    toastUndo
      ? toastUndo("Removed \""+space.name+"\""+(n?(" - moved "+n+" item"+(n===1?"":"s")+" to "+toName):""), ()=>{
          store.saveSpaces(prevSpaces);
          if(affected.length) store.restoreLabel("space", affected, space.id);
        })
      : toast&&toast("Removed \""+space.name+"\"");
  }
  function reorder(movedId, newIds){
    const om={}; newIds.forEach((id,i)=>om[id]=i*10); let base=newIds.length*10;
    store.saveSpaces(all.map(s => om[s.id]!==undefined ? {...s,order:om[s.id]} : {...s,order:base++}));
  }
  function add(){
    const n=adding.trim(); if(!n) return;
    if(all.some(s=>(s.name||"").toLowerCase()===n.toLowerCase())){ toast&&toast("A Space with that name exists"); return; }
    const color = ACCENT_PRESETS[all.length % ACCENT_PRESETS.length];
    const order = (active.length?Math.max(...active.map(s=>s.order||0)):0)+10;
    store.saveSpaces([...all, { id:uid(), name:n, color, order, archived:false }]);
    setAdding("");
  }
  const Row = (s) => (
    <div className="row" style={{alignItems:"center",gap:8,flexWrap:"wrap",background:"var(--bg)"}}>
      <input type="color" value={s.color||"#6f9bc4"} onChange={e=>patch(s.id,{color:e.target.value})}
        aria-label="Space color" style={{flex:"0 0 auto",width:34,height:34,padding:2,border:"1px solid var(--line-2)",borderRadius:9,background:"transparent"}}/>
      <input className="input" defaultValue={s.name} key={s.id+"|"+s.name} onBlur={e=>rename(s.id,e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }} style={{flex:1,minWidth:110}} aria-label="Space name"/>
      {def===s.id
        ? <span className="chip amber" style={{flex:"0 0 auto"}}>Default</span>
        : <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>store.setDefaultSpaceId(s.id)}>Make default</button>}
      <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>archive(s.id)}>Archive</button>
      <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>askRemove(s)}>Remove</button>
    </div>
  );
  return (
    <div>
      <DragList items={active} getId={s=>s.id} reorderable={active.length>1} onReorder={reorder} render={Row}/>
      <div className="row" style={{marginTop:6}}>
        <input className="input" value={adding} onChange={e=>setAdding(e.target.value)} placeholder="Add a Space"
          onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:3}} autoCapitalize="words"/>
        <button className="btn btn-ghost btn-sm" onClick={add} style={{flex:1}}>Add</button>
      </div>
      <p className="hint" style={{marginTop:6}}>Drag to reorder. Tap a name to rename, or the swatch to recolor. Archive hides a Space and keeps its items on it; Remove deletes it and moves its items to a Space you pick. The default can't be archived or removed.</p>
      {removing && (()=>{
        const n = countUses(store, "space", removing.space.id);
        const targets = all.filter(s=>s.id!==removing.space.id);
        return (
          <Sheet title={"Remove \""+removing.space.name+"\"?"} onClose={()=>setRemoving(null)}>
            <p className="hint" style={{fontSize:14,marginBottom:14}}>
              {n>0
                ? ("This Space has "+n+" item"+(n===1?"":"s")+". They won't be deleted - pick where they should go.")
                : "This Space has no items."}
            </p>
            {n>0 && <>
              <span className="label">Move its items to</span>
              <select className="input" value={removing.to} style={{marginBottom:16}}
                onChange={e=>setRemoving({...removing, to:e.target.value})}>
                {targets.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </>}
            <button className="btn btn-danger btn-block" onClick={doRemove}>Remove</button>
            <button className="btn btn-ghost btn-block" style={{marginTop:10}} onClick={()=>setRemoving(null)}>Cancel</button>
          </Sheet>
        );
      })()}
      {archived.length>0 && <>
        <div className="set-group">Archived</div>
        {archived.map(s=>
          <div key={s.id} className="row" style={{alignItems:"center",gap:8,background:"var(--bg)",marginBottom:6}}>
            <span className="space-dot" style={{background:s.color,marginLeft:4}}></span>
            <span style={{flex:1,color:"var(--ink-3)"}}>{s.name}</span>
            <button className="btn btn-ghost btn-sm" onClick={()=>patch(s.id,{archived:false})}>Unarchive</button>
          </div>)}
      </>}
    </div>
  );
}

/* ============================================================
   LOCATIONS EDITOR (manage GTD contexts, saved in config)
   ============================================================ */
function LocationsEditor({ store, toast, toastUndo }){
  const list = knownLocations(store);   // union: configured + any in use, so the editor matches the filter pills
  const cfgList = (store.cfg.locations && store.cfg.locations.length) ? store.cfg.locations : DEFAULT_LOCATIONS;
  const [adding,setAdding]=useState("");
  const [merge,setMerge]=useState(null);
  const [seed,setSeed]=useState(0);
  function persist(next){ store.saveCfg({ ...store.cfg, locations: next }); }
  function add(){
    const v = adding.trim(); if(!v) return;
    if(list.includes(v)){ toast("Already in the list"); return; }
    persist([...cfgList, v]); setAdding(""); log("NAV","location added");
  }
  function commit(old, v){
    if(old===v) return;
    if(list.includes(v)){ setMerge({from:old, to:v}); return; }
    persist(cfgList.includes(old) ? cfgList.map(x=>x===old?v:x) : [...cfgList, v]); // adopt in-use-but-unlisted names
    const n = store.relabel("location", old, v);
    toast(n>0 ? ("Renamed - updated "+n+" item"+(n===1?"":"s")) : "Renamed");
  }
  function doMerge(){
    const {from,to}=merge; const prevCfg=store.cfg;
    const affected=[]; FILES.forEach(f=>((store.allData||store.data)[f]||[]).forEach(x=>{ if(x.location===from) affected.push({file:f,id:x.id}); }));
    persist(cfgList.filter(x=>x!==from));
    const n=store.relabel("location", from, to);
    setMerge(null); setSeed(s=>s+1);
    toastUndo("Merged \""+from+"\" into \""+to+"\""+(n?(" - "+n+" item"+(n===1?"":"s")):""), ()=>{
      store.saveCfg(prevCfg);
      if(affected.length) store.restoreLabel("location", affected, from);
    });
  }
  function cancelMerge(){ setMerge(null); setSeed(s=>s+1); }
  function remove(val){
    const prevCfg = store.cfg;
    const affected = []; FILES.forEach(f => ((store.allData||store.data)[f]||[]).forEach(x => { if(x.location===val) affected.push({file:f,id:x.id}); }));
    persist(cfgList.filter(x=>x!==val));
    const n = store.relabel("location", val, "");
    toastUndo("Deleted \""+val+"\""+(n?(" - cleared "+n+" item"+(n===1?"":"s")):""), ()=>{
      store.saveCfg(prevCfg);
      if(affected.length) store.restoreLabel("location", affected, val);
    });
  }
  return (
    <div>
      {list.map((l)=>
        <EditableLabelRow key={l+"|"+seed} value={l} count={countUses(store,"location",l)}
          onCommit={v=>commit(l,v)} onRemove={()=>remove(l)}/>)}
      <div className="row" style={{marginTop:6}}>
        <input className="input" value={adding} onChange={e=>setAdding(e.target.value)} placeholder="Add a place / context"
          onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:3}} autoCapitalize="words"/>
        <button className="btn btn-ghost btn-sm" onClick={add} style={{flex:1}}>Add</button>
      </div>
      <p className="hint" style={{marginTop:6}}>Tap a name to rename it (updates every todo using it). Rename one onto another's name to merge them. Swipe a row left to delete.</p>
      {merge && <Confirm
        text={"Merge \""+merge.from+"\" into \""+merge.to+"\"? Every todo tagged \""+merge.from+"\" becomes \""+merge.to+"\", and \""+merge.from+"\" is removed."}
        confirmLabel="Merge" onConfirm={doMerge} onCancel={cancelMerge}/>}
    </div>
  );
}

function CategoriesEditor({ store, toast, toastUndo }){
  const list = knownCategories(store);   // union: configured + any in use (e.g. one the AI coined), matches the filter pills
  const cfgList = (store.cfg.categories && store.cfg.categories.length) ? store.cfg.categories : DEFAULT_CATEGORIES;
  const [adding,setAdding]=useState("");
  const [merge,setMerge]=useState(null);   // {from, to} pending a confirm
  const [seed,setSeed]=useState(0);        // bump to remount rows (reset an edited input on cancel)
  function persist(next){ store.saveCfg({ ...store.cfg, categories: next }); }
  function add(){
    const v = adding.trim(); if(!v) return;
    if(list.includes(v)){ toast("Already in the list"); return; }
    persist([...cfgList, v]); setAdding(""); log("NAV","category added");
  }
  function commit(old, v){
    if(old===v) return;
    if(list.includes(v)){ setMerge({from:old, to:v}); return; }   // renamed onto an existing one -> offer to merge
    persist(cfgList.includes(old) ? cfgList.map(x=>x===old?v:x) : [...cfgList, v]); // adopt in-use-but-unlisted names
    const n = store.relabel("type", old, v);
    toast(n>0 ? ("Renamed - updated "+n+" item"+(n===1?"":"s")) : "Renamed");
  }
  function doMerge(){
    const {from,to}=merge; const prevCfg=store.cfg;
    const affected=[]; FILES.forEach(f=>((store.allData||store.data)[f]||[]).forEach(x=>{ if(x.type===from) affected.push({file:f,id:x.id}); }));
    persist(cfgList.filter(x=>x!==from));
    const n=store.relabel("type", from, to);
    setMerge(null); setSeed(s=>s+1);
    toastUndo("Merged \""+from+"\" into \""+to+"\""+(n?(" - "+n+" item"+(n===1?"":"s")):""), ()=>{
      store.saveCfg(prevCfg);
      if(affected.length) store.restoreLabel("type", affected, from);
    });
  }
  function cancelMerge(){ setMerge(null); setSeed(s=>s+1); }   // reset the row back to its old name
  function remove(val){
    const prevCfg = store.cfg;                       // snapshot for undo
    const affected = []; FILES.forEach(f => ((store.allData||store.data)[f]||[]).forEach(x => { if(x.type===val) affected.push({file:f,id:x.id}); }));
    persist(cfgList.filter(x=>x!==val));
    const n = store.relabel("type", val, "");        // clear it off every item
    toastUndo("Deleted \""+val+"\""+(n?(" - cleared "+n+" item"+(n===1?"":"s")):""), ()=>{
      store.saveCfg(prevCfg);                         // put the category back...
      if(affected.length) store.restoreLabel("type", affected, val);   // ...and re-tag exactly those items
    });
  }
  return (
    <div>
      {list.map((l)=>
        <EditableLabelRow key={l+"|"+seed} value={l} color={catHue(l)} count={countUses(store,"type",l)}
          onCommit={v=>commit(l,v)} onRemove={()=>remove(l)}/>)}
      <div className="row" style={{marginTop:6}}>
        <input className="input" value={adding} onChange={e=>setAdding(e.target.value)} placeholder="Add a category"
          onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:3}} autoCapitalize="characters"/>
        <button className="btn btn-ghost btn-sm" onClick={add} style={{flex:1}}>Add</button>
      </div>
      <p className="hint" style={{marginTop:6}}>Tap a name to rename it (updates every item using it). Rename one onto another's name to merge them. Swipe a row left to delete. Colors are automatic.</p>
      {merge && <Confirm
        text={"Merge \""+merge.from+"\" into \""+merge.to+"\"? Every item tagged \""+merge.from+"\" becomes \""+merge.to+"\", and \""+merge.from+"\" is removed."}
        confirmLabel="Merge" onConfirm={doMerge} onCancel={cancelMerge}/>}
    </div>
  );
}

/* ============================================================
   VIEW: AI ORGANIZER (conversational; proposes a plan you approve)
   ============================================================ */
function AIChat({ store, toast, back }){
  const [messages,setMessages] = useState(() => lsGet("aiChat", []));   // {role:'user'|'assistant'|'system', text}
  const [plan,setPlan] = useState(() => lsGet("aiPlan", null));         // { ops:[...], excluded:[i,...] }
  const [input,setInput] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");
  const endRef = useRef(null);
  useEffect(() => { lsSet("aiChat", messages); }, [messages]);
  useEffect(() => { if(plan) lsSet("aiPlan", plan); else lsDel("aiPlan"); }, [plan]);
  useEffect(() => { if(endRef.current) endRef.current.scrollIntoView({block:"end"}); }, [messages, plan, busy]);
  // If we arrived here from the + brain-dump box, it left the text in 'aiSeed'. Send it.
  useEffect(() => {
    const seed = lsGet("aiSeed", ""); if(seed){ lsDel("aiSeed"); send(seed); }
  }, []); // eslint-disable-line

  async function send(textArg){
    const text = (typeof textArg==="string" ? textArg : input).trim(); if(!text || busy) return;
    setErr(""); setInput("");
    const history = [...messages, { role:"user", text }];
    setMessages(history); setBusy(true);
    try{
      // If a plan is already on the table, hand it to the AI so the user can ask to
      // revise specific items (and so a plain conversational turn doesn't lose it).
      const planCtx = (plan && plan.ops.length)
        ? "\n\nCURRENT PROPOSED PLAN (not yet applied). If the user asks to change, revise, drop, or reconsider any of these, return an UPDATED plan: keep the items they're happy with and adjust the ones they mention.\n" + JSON.stringify(plan.ops)
        : "";
      const system = ORGANIZE_SYSTEM + "\n\nCURRENT DATA (JSON):\n" + organizeSnapshot(store) + planCtx;
      // only user/assistant turns go to the API (skip our local 'system' confirmations)
      const apiMessages = history.filter(m=>m.role==="user"||m.role==="assistant").map(m=>({ role:m.role, content:m.text }));
      const raw = await claudeChat(system, apiMessages);
      let parsed = null; const cleaned = stripFences(raw);
      try{ parsed = JSON.parse(cleaned); }
      catch(e){
        const a = cleaned.indexOf("{"), b = cleaned.lastIndexOf("}");   // tolerate stray prose around the JSON
        if(a>=0 && b>a){ try{ parsed = JSON.parse(cleaned.slice(a,b+1)); }catch(_){ parsed = null; } }
      }
      if(!parsed || typeof parsed!=="object"){
        // purely conversational reply - keep any plan that's already on the table
        setMessages(m=>[...m, { role:"assistant", text: raw || "(no response)" }]);
      }else{
        const reply = parsed.reply || "Here's what I can do.";
        const ops = Array.isArray(parsed.plan) ? parsed.plan : [];
        setMessages(m=>[...m, { role:"assistant", text: reply }]);
        if(ops.length) setPlan({ ops, excluded:[] });   // a new/updated plan replaces the old; a no-plan turn leaves it intact
      }
    }catch(e){
      setErr(e.message || "Something went wrong.");
      setMessages(m=>[...m, { role:"system", text:"(error: "+(e.message||"failed")+")" }]);
    }
    setBusy(false);
  }

  function toggleOp(i){
    setPlan(p => { if(!p) return p; const ex = p.excluded.includes(i) ? p.excluded.filter(x=>x!==i) : [...p.excluded, i]; return { ...p, excluded:ex }; });
  }
  function applyPlan(){
    if(!plan) return;
    let included = plan.ops.filter((_,i)=>!plan.excluded.includes(i));
    const liveTmp = new Set(included.filter(o=>o.op==="create_project"&&o.tmpId).map(o=>o.tmpId));
    // if a project was excluded, don't leave its todos pointing at a dead tmpId
    included = included.map(o=>{
      if(o.op==="create_todo" && o.projectId && plan.ops.some(x=>x.op==="create_project"&&x.tmpId===o.projectId) && !liveTmp.has(o.projectId))
        return { ...o, projectId:null };
      return o;
    });
    if(!included.length){ toast("Nothing selected"); return; }
    const res = store.applyPlan(included);
    // Keep the UNSELECTED items on the table so you can refine or apply them next. A kept
    // todo that pointed at a project we just created can't resolve its tmpId anymore -> null it.
    const remaining = plan.ops.filter((_,i)=>plan.excluded.includes(i)).map(o=>{
      if(o.op==="create_todo" && o.projectId && liveTmp.has(o.projectId)) return { ...o, projectId:null };
      return o;
    });
    setPlan(remaining.length ? { ops: remaining, excluded: [] } : null);
    const tail = remaining.length ? " - "+remaining.length+" still here to refine or apply." : ".";
    setMessages(m=>[...m, { role:"system", text:"Applied "+res.created+" created"+(res.updated?", "+res.updated+" updated":"")+tail }]);
    toast(remaining.length ? "Applied selected" : "Plan applied");
  }
  function clearChat(){ setMessages([]); setPlan(null); setErr(""); lsDel("aiChat"); lsDel("aiPlan"); }

  function opLabel(o){
    if(o.op==="create_project") return ["New project", o.name||"(untitled)"];
    if(o.op==="create_goal")    return ["New goal", o.name||"(untitled)"];
    if(o.op==="create_idea")    return ["New idea", o.title||"(untitled)"];
    if(o.op==="create_todo"){
      const bits=[ (o.status&&o.status!=="inbox")?o.status:null, o.type||null,
        (o.quad&&QUADRANTS[o.quad])?QUADRANTS[o.quad].label:null, o.due?("due "+o.due):null,
        o.location?("@"+o.location):null, o.projectId?"in project":null ].filter(Boolean);
      return ["New todo", (o.title||"(untitled)") + (bits.length?"  ("+bits.join(", ")+")":"")];
    }
    if(o.op==="update_todo"){
      const t = store.data.todos.find(x=>x.id===o.id); const name = t?t.title:("#"+o.id);
      const ch=[]; ["status","type","due","location"].forEach(k=>{ if(o[k]!==undefined) ch.push(k+"="+o[k]); });
      if(o.quad!==undefined) ch.push("priority="+(QUADRANTS[o.quad]?QUADRANTS[o.quad].label:o.quad));
      if(o.projectId!==undefined) ch.push("project");
      if(o.tags!==undefined) ch.push("tags");
      return ["Update", name + (ch.length?"  ("+ch.join(", ")+")":"")];
    }
    if(o.op==="update_idea"){
      const it = store.data.ideas.find(x=>x.id===o.id); const name = o.title || (it?it.title:("#"+o.id));
      const ch=[]; if(o.state!==undefined) ch.push(o.state==="promoted"?"turned into work":o.state);
      if(o.type!==undefined) ch.push(o.type);
      if(o.title!==undefined && it && o.title!==it.title) ch.push("retitled");
      if(o.tags!==undefined) ch.push("tags");
      return ["Update note", name + (ch.length?"  ("+ch.join(", ")+")":"")];
    }
    return [o.op, ""];
  }

  const empty = messages.length===0;
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <button className="btn btn-ghost btn-sm" onClick={back}>{Ic.back} Back</button>
        {messages.length>0 && <button className="btn btn-ghost btn-sm" onClick={clearChat} style={{marginLeft:"auto"}}>Clear</button>}
        <h1 className="title" style={{marginTop:8,width:"100%"}}>Organize with AI</h1>
      </div>

      {empty &&
        <p className="hint" style={{marginTop:10}}>Dump whatever's on your mind. I'll suggest todos, projects, and how to file your inbox - then you approve before anything is saved. Nothing changes until you tap Apply.</p>}

      <div className="chat-scroll">
        {messages.map((m,i)=> <div key={i} className={"bubble "+(m.role==="user"?"user":m.role==="assistant"?"ai":"sys")}>{m.text}</div>)}
        {busy && <div className="bubble ai" style={{color:"var(--ink-3)"}}>Thinking...</div>}
        {plan && plan.ops.length>0 &&
          <div className="plan-card">
            <div className="label" style={{marginBottom:6}}>Proposed plan - tap an item to deselect it. Apply adds the selected ones; the rest stay here to refine.</div>
            {plan.ops.map((o,i)=>{ const [k,txt]=opLabel(o); const off=plan.excluded.includes(i);
              return <div key={i} className={"plan-op"+(off?" off":"")} onClick={()=>toggleOp(i)}>
                <span className="plan-ck" style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:22,height:22,borderRadius:6,flex:"0 0 auto",border:"1.5px solid "+(off?"var(--line-2)":"var(--amber)"),background:off?"transparent":"var(--amber-dim)"}}>{!off && Ic.check}</span>
                <span style={{flex:1}}><span className="pl-k">{k}</span><br/>{txt}</span>
              </div>; })}
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button className="btn btn-primary btn-block" onClick={applyPlan} disabled={busy}>Apply {plan.ops.length-plan.excluded.length} selected</button>
              <button className="btn btn-ghost" onClick={()=>setPlan(null)}>Dismiss</button>
            </div>
          </div>}
      </div>
      {err && <p className="hint" style={{color:"var(--danger,#d9744f)",marginTop:2}}>{err}</p>}
      <div className="chat-bar">
        <textarea className="textarea" value={input} onChange={e=>setInput(e.target.value)}
          placeholder={empty ? "Talk or type a brain-dump... e.g. 'Start a kitchen reno project and add these todos...'" : "Type your reply..."}
          style={{minHeight:54,flex:1}} onKeyDown={e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); send(); } }}/>
        <button className="btn btn-primary" onClick={send} disabled={busy} style={{flex:"0 0 auto"}}>{busy?"...":"Send"}</button>
      </div>
      <div ref={endRef}></div>
    </div>
  );
}

function ExportView({ store, toast, back }){
  const appName = (store.cfg.appName||"Priority Captain");
  const fname = (ext) => (appName.replace(/[^a-z0-9]+/ig,"-").replace(/^-+|-+$/g,"").toLowerCase() || "tracker")+"-export."+ext;
  function download(name, text, mime){
    const blob = new Blob([text],{type:mime});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  const projName = () => { const m={}; ((store.allData||store.data).projects||[]).forEach(p=>{ m[p.id]=p.name; }); return m; };

  // ---- builders (one per format) ----------------------------------
  function buildText(){
    const d = store.allData; const pn = projName(); const L = [];
    L.push(appName.toUpperCase()+" EXPORT"); L.push(new Date().toString());
    const todoLine = (t)=>{
      const bits = [];
      if(t.type) bits.push(t.type);
      if(t.quad && QUADRANTS[t.quad]) bits.push(QUADRANTS[t.quad].label);
      if(t.due) bits.push("due "+t.due);
      if(t.defer) bits.push("defer "+t.defer);
      if(t.location) bits.push("@"+t.location);
      if(t.projectId && pn[t.projectId]) bits.push("project: "+pn[t.projectId]);
      if(t.waitingOn) bits.push("waiting: "+t.waitingOn);
      const tags = (t.tags||[]).map(x=>"#"+x).join(" ");
      const meta = (bits.length||tags) ? "  ("+[bits.join(", "), tags].filter(Boolean).join("; ")+")" : "";
      let s = "  ["+(t.status==="done"?"x":" ")+"] "+t.title+meta;
      (t.subtasks||[]).forEach(st=>{ s += "\n      - ["+(st.done?"x":" ")+"] "+st.title; });
      return s;
    };
    L.push(""); L.push("== TODOS ==");
    STATUS_ORDER.forEach(st=>{
      const rows = (d.todos||[]).filter(t=>t.status===st);
      if(!rows.length) return;
      L.push(""); L.push("-- "+st.toUpperCase()+" ("+rows.length+") --");
      rows.forEach(t=>L.push(todoLine(t)));
    });
    L.push(""); L.push("== PROJECTS ==");
    (d.projects||[]).forEach(p=>{
      L.push("");
      L.push("* "+p.name+"  ("+[p.type, p.status, p.deadline?("due "+p.deadline):""].filter(Boolean).join(", ")+")");
      if(p.outcome) L.push("    Outcome: "+p.outcome);
      if(p.description) L.push("    "+p.description.replace(/\n/g," "));
      (d.todos||[]).filter(t=>t.projectId===p.id).forEach(t=>L.push("    ["+(t.status==="done"?"x":" ")+"] "+t.title));
    });
    L.push(""); L.push("== IDEAS ==");
    (d.ideas||[]).forEach(i=>{
      L.push("");
      L.push("* "+i.title+"  ("+[i.type, i.state].filter(Boolean).join(", ")+")");
      if(i.body) L.push("    "+i.body.replace(/\n/g," "));
    });
    L.push(""); L.push("== GOALS ==");
    (d.goals||[]).forEach(g=>{
      const projs = (d.projects||[]).filter(p=>p.goalId===g.id).map(p=>p.name);
      L.push("");
      L.push("* "+g.name+"  ("+[g.type, g.status, g.target?("target "+g.target):""].filter(Boolean).join(", ")+")");
      if(g.why) L.push("    Why: "+g.why.replace(/\n/g," "));
      if(projs.length) L.push("    Projects: "+projs.join(", "));
    });
    return L.join("\n");
  }

  function buildMarkdown(){
    const d = store.allData; const pn = projName();
    const L = ["# "+appName+" export","","_"+new Date().toLocaleString()+"_"];
    const line = (t)=>{
      const bits = [];
      if(t.type) bits.push(t.type);
      if(t.quad && QUADRANTS[t.quad]) bits.push(QUADRANTS[t.quad].label);
      if(t.due) bits.push("due "+t.due);
      if(t.defer) bits.push("defer "+t.defer);
      if(t.location) bits.push("@"+t.location);
      if(t.projectId && pn[t.projectId]) bits.push("project: "+pn[t.projectId]);
      if(t.waitingOn) bits.push("waiting: "+t.waitingOn);
      const tags = (t.tags||[]).map(x=>"#"+x).join(" ");
      const meta = (bits.length||tags) ? " _("+[bits.join(", "), tags].filter(Boolean).join("; ")+")_" : "";
      let s = "- ["+(t.status==="done"?"x":" ")+"] "+t.title+meta;
      (t.subtasks||[]).forEach(st=>{ s += "\n  - ["+(st.done?"x":" ")+"] "+st.title; });
      return s;
    };
    L.push(""); L.push("## Todos");
    STATUS_ORDER.forEach(st=>{
      const rows = (d.todos||[]).filter(t=>t.status===st);
      if(!rows.length) return;
      L.push(""); L.push("### "+st.toUpperCase()+" ("+rows.length+")");
      rows.forEach(t=>L.push(line(t)));
    });
    if((d.projects||[]).length){ L.push(""); L.push("## Projects");
      (d.projects||[]).forEach(p=>{
        L.push(""); L.push("### "+p.name);
        L.push("_"+[p.type, p.status, p.deadline?("due "+p.deadline):""].filter(Boolean).join(" - ")+"_");
        if(p.outcome) L.push("**Outcome:** "+p.outcome);
        if(p.description) L.push(p.description);
        (d.todos||[]).filter(t=>t.projectId===p.id).forEach(t=>L.push("- ["+(t.status==="done"?"x":" ")+"] "+t.title));
      });
    }
    if((d.ideas||[]).length){ L.push(""); L.push("## Notes & ideas");
      (d.ideas||[]).forEach(i=>L.push("- **"+i.title+"** _("+[i.type,i.state].filter(Boolean).join(", ")+")_"+(i.body?"  \n  "+i.body.replace(/\n/g," "):"")));
    }
    if((d.goals||[]).length){ L.push(""); L.push("## Goals");
      (d.goals||[]).forEach(g=>{
        const projs = (d.projects||[]).filter(p=>p.goalId===g.id).map(p=>p.name);
        L.push("- **"+g.name+"** _("+[g.type,g.status,g.target?("target "+g.target):""].filter(Boolean).join(", ")+")_"
          +(g.why?"  \n  Why: "+g.why.replace(/\n/g," "):"")+(projs.length?"  \n  Projects: "+projs.join(", "):""));
      });
    }
    return L.join("\n");
  }

  function buildCSV(){
    const d = store.allData; const pn = projName();
    const cell = (v)=>{ v=(v==null?"":String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const rows = [["Kind","Title","Category","Status","Priority","Due","Defer","Location","Project","Tags","Notes"]];
    (d.todos||[]).forEach(t=>rows.push(["Todo",t.title,t.type,t.status,
      (t.quad&&QUADRANTS[t.quad]?QUADRANTS[t.quad].label:""),t.due,t.defer,t.location,
      (t.projectId?pn[t.projectId]:""),(t.tags||[]).join(" "),t.notes]));
    (d.ideas||[]).forEach(i=>rows.push(["Idea",i.title,i.type,i.state,"","","","","",(i.tags||[]).join(" "),i.body]));
    (d.projects||[]).forEach(p=>rows.push(["Project",p.name,p.type,p.status,"",p.deadline,"","","","",
      (p.outcome?("Outcome: "+p.outcome+(p.description?" | "+p.description:"")):(p.description||""))]));
    (d.goals||[]).forEach(g=>rows.push(["Goal",g.name,g.type,g.status,"",g.target,"","","","",g.why]));
    return rows.map(r=>r.map(cell).join(",")).join("\r\n");
  }

  function buildPrintHTML(){
    const d = store.allData; const pn = projName();
    let h = "<h1>"+esc(appName)+" export</h1><p class=date>"+esc(new Date().toLocaleString())+"</p>";
    h += "<h2>Todos</h2>";
    let any=false;
    STATUS_ORDER.forEach(st=>{
      const rows=(d.todos||[]).filter(t=>t.status===st); if(!rows.length) return; any=true;
      h += "<h3>"+esc(st.toUpperCase())+" ("+rows.length+")</h3><ul>";
      rows.forEach(t=>{
        const bits=[]; if(t.type)bits.push(t.type); if(t.quad&&QUADRANTS[t.quad])bits.push(QUADRANTS[t.quad].label);
        if(t.due)bits.push("due "+t.due); if(t.location)bits.push("@"+t.location);
        if(t.projectId&&pn[t.projectId])bits.push(pn[t.projectId]);
        const meta = bits.length ? " <span class=meta>("+esc(bits.join(", "))+")</span>" : "";
        h += "<li>"+(t.status==="done"?"&#9745; ":"&#9744; ")+esc(t.title)+meta;
        if((t.subtasks||[]).length){ h+="<ul>"; t.subtasks.forEach(s=>h+="<li>"+(s.done?"&#9745; ":"&#9744; ")+esc(s.title)+"</li>"); h+="</ul>"; }
        h += "</li>";
      });
      h += "</ul>";
    });
    if(!any) h += "<p class=meta>No todos.</p>";
    if((d.projects||[]).length){ h+="<h2>Projects</h2>";
      (d.projects||[]).forEach(p=>{ h+="<h3>"+esc(p.name)+"</h3><p class=meta>"+esc([p.type,p.status,p.deadline?("due "+p.deadline):""].filter(Boolean).join(" - "))+"</p>";
        if(p.outcome)h+="<p><b>Outcome:</b> "+esc(p.outcome)+"</p>"; if(p.description)h+="<p>"+esc(p.description)+"</p>"; }); }
    if((d.ideas||[]).length){ h+="<h2>Ideas</h2><ul>";
      (d.ideas||[]).forEach(i=>h+="<li><b>"+esc(i.title)+"</b> <span class=meta>("+esc([i.type,i.state].filter(Boolean).join(", "))+")</span>"+(i.body?"<br>"+esc(i.body):"")+"</li>"); h+="</ul>"; }
    if((d.goals||[]).length){ h+="<h2>Goals</h2><ul>";
      (d.goals||[]).forEach(g=>h+="<li><b>"+esc(g.name)+"</b> <span class=meta>("+esc([g.type,g.status,g.target?("target "+g.target):""].filter(Boolean).join(", "))+")</span>"+(g.why?"<br>"+esc(g.why):"")+"</li>"); h+="</ul>"; }
    return "<!doctype html><html><head><meta charset=utf-8><title>"+esc(appName)+" export</title><style>"
      +"body{font:14px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;max-width:760px;margin:32px auto;padding:0 22px;}"
      +"h1{font-size:24px;margin:0 0 2px;}.date{color:#888;margin:0 0 18px;}"
      +"h2{margin:24px 0 6px;border-bottom:1px solid #ddd;padding-bottom:4px;font-size:18px;}"
      +"h3{margin:14px 0 4px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.05em;}"
      +"ul{margin:4px 0 10px;padding-left:22px;}li{margin:3px 0;}.meta{color:#999;font-size:12px;}"
      +"@media print{body{margin:0;}a{color:inherit;}}</style></head><body>"+h+"</body></html>";
  }

  // ---- actions ----------------------------------------------------
  async function copyText(){
    const text = buildText();
    try{
      await navigator.clipboard.writeText(text);
      toast("Copied to clipboard"); log("NAV","copied text "+text.length+" chars");
    }catch(e){
      log("ERROR","clipboard: "+(e.message||e)); download(fname("txt"), text, "text/plain");
      toast("Clipboard blocked - downloaded instead");
    }
  }
  // Mobile-friendly: native share sheet (Notes/Mail/Messages); desktop falls back to a download.
  async function shareText(){
    const text = buildText();
    if(navigator.share){
      try { await navigator.share({ title:appName+" export", text }); log("NAV","shared text"); return; }
      catch(e){ if(e.name==="AbortError") return; log("ERROR","share: "+e.message); }
    }
    download(fname("txt"), text, "text/plain"); log("NAV","downloaded text");
  }
  function exportMarkdown(){ download(fname("md"), buildMarkdown(), "text/markdown"); toast("Markdown downloaded"); log("NAV","export md"); }
  function exportCSV(){ download(fname("csv"), buildCSV(), "text/csv"); toast("CSV downloaded"); log("NAV","export csv"); }
  function exportData(){ download(fname("json"), JSON.stringify(store.allData,null,2), "application/json"); toast("JSON downloaded"); log("NAV","export json"); }
  function printDoc(){
    const w = window.open("", "_blank");
    if(!w){ toast("Allow pop-ups to print / save as PDF"); log("ERROR","print: popup blocked"); return; }
    w.document.open(); w.document.write(buildPrintHTML()); w.document.close(); w.focus();
    setTimeout(()=>{ try{ w.print(); }catch(e){ log("ERROR","print: "+e.message); } }, 350);
    log("NAV","print");
  }

  const Row = ({ic,b,s,onClick}) => (
    <button className="act-row" onClick={onClick}>
      <span className="act-ic">{ic}</span><span className="act-txt"><b>{b}</b><span>{s}</span></span></button>
  );
  return (
    <div className="screen">
      <div className="topbar" style={{padding:0,position:"static"}}>
        <button className="btn btn-ghost btn-sm" onClick={back}>{Ic.back} Back</button>
        <h1 className="title" style={{marginTop:8}}>Export</h1>
      </div>
      <p className="hint" style={{marginTop:8}}>Get your data out anytime. This reads only what is on this device.</p>

      <span className="label" style={{marginTop:14,display:"block"}}>Read &amp; share</span>
      <Row ic={Ic.lists}   b="Copy to clipboard"     s="Readable text - paste anywhere" onClick={copyText}/>
      <Row ic={Ic.review}  b="Share / save as text"  s="Phone share sheet, or .txt on desktop" onClick={shareText}/>
      <Row ic={Ic.idea}    b="Download as Markdown"   s="Formatted .md for Notion, Obsidian, docs" onClick={exportMarkdown}/>
      <Row ic={Ic.today}   b="Print / Save as PDF"    s="Opens a clean printable page" onClick={printDoc}/>

      <span className="label" style={{marginTop:18,display:"block"}}>Spreadsheet &amp; backup</span>
      <Row ic={Ic.matrix}  b="Download as CSV"        s="Open in Excel, Numbers, or Sheets" onClick={exportCSV}/>
      <Row ic={Ic.project} b="Download data (JSON)"   s="Full machine-readable backup" onClick={exportData}/>
    </div>
  );
}

      <div className="set-group">Habits</div>
      <div className="card"><HabitsEditor store={store} toast={toast}/></div>

      <div className="set-group">Templates</div>
      <div className="card"><TemplatesEditor store={store} toast={toast}/></div>

      <div className="set-group">Calendars</div>
      <div className="card"><CalendarsEditor store={store} toast={toast}/></div>

      <div className="set-group">Follow-up nudge</div>
      <div className="card">
        <div className="row" style={{alignItems:"center"}}>

          <select className="input" style={{flex:"0 0 auto",width:130}} value={String(waitThreshold(store))}

            {[3,5,7,14,30].map(n=><option key={n} value={n}>{n} days</option>)}

        <a href="privacy.html" target="_blank" rel="noopener" style={{color:"var(--ink-3)",textDecoration:"underline"}}>Privacy</a>
