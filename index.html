// Password input with a show/hide eyeball. Used by every password field
// (sign in, sign up, reset) so the toggle behaves the same everywhere.
function PwInput({ value, onChange, placeholder, autoComplete, onEnter }){
  const [show,setShow]=useState(false);
  return (
    <div className="pw-wrap">
      <input className="input" type={show?"text":"password"} value={value}
        autoCapitalize="off" autoComplete={autoComplete||"current-password"}
        onChange={e=>onChange(e.target.value)} placeholder={placeholder||""}
        onKeyDown={e=>{ if(e.key==="Enter" && onEnter) onEnter(); }} />
      <button type="button" className="pw-eye" onClick={()=>setShow(s=>!s)}
        aria-label={show?"Hide password":"Show password"}>
        {show ? Ic.eyeOff : Ic.eye}
      </button>
    </div>
  );
}

function Login({ store, toast }){
  const [mode,setMode]=useState("signin");   // signin | signup
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [sent,setSent]=useState(false);       // signup confirmation email sent
  const [resetSent,setResetSent]=useState(false); // password-reset email sent
  const isSignup = mode==="signup";
  async function submit(){
    setErr("");
    if(!email.trim()||!password){ setErr("Email and password are required."); return; }
    if(isSignup && password.length<6){ setErr("Password must be at least 6 characters."); return; }
    setBusy(true);
    try{
      if(isSignup){
        const { needsConfirm } = await store.signUp(email, password);
        if(needsConfirm) setSent(true);          // email confirmation flow
        else toast("Account created");           // (only if confirmation is off)
      }else{
        await store.signIn(email, password); toast("Signed in");
      }
    }catch(e){ setErr(e.message||"Something went wrong."); }
    finally{ setBusy(false); }
  }

  async function forgot(){
    setErr("");
    if(!email.trim()){ setErr("Enter your email above first, then tap Forgot password."); return; }
    setBusy(true);
    try{ await store.requestReset(email); setResetSent(true); }
    catch(e){ setErr(e.message||"Couldn't send the reset email."); }
    finally{ setBusy(false); }
  }

  // After "Forgot password?": tell them to check their inbox for the reset link.
  if(resetSent){
    return (
      <div className="app"><div className="screen">
        <div style={{paddingTop:"calc(env(safe-area-inset-top) + 40px)"}}>
          <div className="eyebrow">Reset password</div>
          <h1 className="title" style={{fontSize:30,marginTop:4}}>Check your email</h1>
          <p className="hint" style={{marginTop:10,fontSize:14}}>
            We sent a password-reset link to <b>{email.trim()}</b>. Tap it and you'll be able to set a new password.
          </p>
        </div>
        <button className="btn btn-ghost btn-block" style={{marginTop:20}}
          onClick={()=>{ setResetSent(false); setErr(""); }}>Back to sign in</button>
        <p className="hint" style={{textAlign:"center",marginTop:16,opacity:.6}}>v{APP_VERSION}</p>
      </div></div>
    );
  }

  // After signup with email confirmation on: tell them to go check their inbox.
  if(sent){
    return (
      <div className="app"><div className="screen">
        <div style={{paddingTop:"calc(env(safe-area-inset-top) + 40px)"}}>
          <div className="eyebrow">Almost there</div>
          <h1 className="title" style={{fontSize:30,marginTop:4}}>Check your email</h1>
          <p className="hint" style={{marginTop:10,fontSize:14}}>
            We sent a confirmation link to <b>{email.trim()}</b>. Tap it to activate your account,
            then come back here and sign in.
          </p>
        </div>
        <button className="btn btn-ghost btn-block" style={{marginTop:20}}
          onClick={()=>{ setSent(false); setMode("signin"); setPassword(""); setErr(""); }}>Back to sign in</button>
        <p className="hint" style={{textAlign:"center",marginTop:16,opacity:.6}}>v{APP_VERSION}</p>
      </div></div>
    );
  }

  return (
    <div className="app"><div className="screen">
      <div style={{paddingTop:"calc(env(safe-area-inset-top) + 40px)"}}>
        <div className="eyebrow">{isSignup?"Get started":"Welcome back"}</div>
        <h1 className="title" style={{fontSize:34,marginTop:4}}>Priority Captain</h1>
        <p className="hint" style={{marginTop:8,fontSize:14}}>
          {isSignup ? "Create an account to sync your todos, ideas, projects, and goals across your devices."
                    : "Sign in to sync your todos, ideas, projects, and goals across your devices."}
        </p>
      </div>
      <div className="card" style={{marginTop:20}}>
        <div className="field"><span className="label">Email</span>
          <input className="input" type="email" value={email} autoCapitalize="off" autoCorrect="off"
            onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"
            onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/></div>
        <div className="field"><span className="label">Password</span>
          <PwInput value={password} onChange={setPassword} onEnter={submit}
            placeholder={isSignup?"At least 6 characters":"Your password"}
            autoComplete={isSignup?"new-password":"current-password"}/></div>
        {err && <p className="hint danger-text">{err}</p>}
        <button className="btn btn-primary btn-block" style={{marginTop:6}} disabled={busy} onClick={submit}>
          {busy? <span className="spin"></span> : (isSignup?"Create account":"Sign in")}</button>
        {isSignup &&
          <p className="hint" style={{textAlign:"center",marginTop:10,fontSize:12.5}}>
            By creating an account you agree to our{" "}
            <a href="terms.html" target="_blank" rel="noopener" style={{color:"var(--ink-2)",textDecoration:"underline"}}>Terms</a>{" "}
            and{" "}
            <a href="privacy.html" target="_blank" rel="noopener" style={{color:"var(--ink-2)",textDecoration:"underline"}}>Privacy Policy</a>.
          </p>}
      </div>
      <button className="btn btn-ghost btn-block" style={{marginTop:12}} disabled={busy}
        onClick={()=>{ setErr(""); setMode(isSignup?"signin":"signup"); }}>
        {isSignup ? "Already have an account? Sign in" : "New here? Create an account"}</button>
      {!isSignup &&
        <button disabled={busy} onClick={forgot}
          style={{display:"block",margin:"14px auto 0",background:"none",border:"none",color:"var(--ink-3)",fontSize:13,textDecoration:"underline",cursor:"pointer"}}>
          Forgot password?</button>}
      <p className="hint" style={{textAlign:"center",marginTop:16,opacity:.6}}>v{APP_VERSION}</p>
    </div></div>
  );
}

function SetPassword({ store, toast }){
  const [password,setPassword]=useState("");
  const [confirm,setConfirm]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  async function submit(){
    setErr("");
    if(password.length<6){ setErr("Password must be at least 6 characters."); return; }
    if(password!==confirm){ setErr("The two passwords don't match."); return; }
    setBusy(true);
    try{ await store.updatePassword(password); toast("Password updated"); }
    catch(e){ setErr(e.message||"Couldn't update the password."); }
    finally{ setBusy(false); }
  }
  return (
    <div className="app"><div className="screen">
      <div style={{paddingTop:"calc(env(safe-area-inset-top) + 40px)"}}>
        <div className="eyebrow">Reset password</div>
        <h1 className="title" style={{fontSize:30,marginTop:4}}>Set a new password</h1>
        <p className="hint" style={{marginTop:8,fontSize:14}}>Choose a new password for <b>{store.authEmail||"your account"}</b>.</p>
      </div>
      <div className="card" style={{marginTop:20}}>
        <div className="field"><span className="label">New password</span>
          <PwInput value={password} onChange={setPassword}
            placeholder="At least 6 characters" autoComplete="new-password"/></div>
        <div className="field"><span className="label">Confirm new password</span>
          <PwInput value={confirm} onChange={setConfirm} onEnter={submit}
            placeholder="Re-enter it" autoComplete="new-password"/></div>
        {err && <p className="hint danger-text">{err}</p>}
        <button className="btn btn-primary btn-block" style={{marginTop:6}} disabled={busy} onClick={submit}>
          {busy? <span className="spin"></span> : "Update password"}</button>
      </div>
      <p className="hint" style={{textAlign:"center",marginTop:16,opacity:.6}}>v{APP_VERSION}</p>
    </div></div>
  );
}

/* ============================================================
   SPACE SWITCHER - top-level focus/mute. Tap a Space to focus the whole app on it,
   or "All" to see everything. Persisted per-device via the store.
   ============================================================ */
function SpaceSwitcher({ store }){
  const list = (store.spaces||[]).filter(s=>!s.archived).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  if(!list.length) return null;   // spaces not seeded yet (pre first pull)
  const active = store.activeSpace || "all";
  const Pill = ({ id, label, color }) => {
    const on = active===id;
    const style = on ? { background: color||"var(--amber)", borderColor: color||"var(--amber)", color:"#241a0c" } : null;
    return (
      <button className={"space-pill"+(on?" on":"")} style={style} onClick={()=>store.setActiveSpace(id)}>
        {color && <span className="space-dot" style={{background: on ? "#241a0c" : color}}></span>}{label}
      </button>
    );
  };
  return (
    <div className="space-switch">
      <Pill id="all" label="All" color={null}/>
      {list.map(s => <Pill key={s.id} id={s.id} label={s.name} color={s.color}/>)}
    </div>
  );
}

/* ============================================================
   APP SHELL
   ============================================================ */
function App(){
  const store = useStore();
  const [tab,setTab]=useState("today");        // bottom-nav tab
  const [sub,setSub]=useState(null);           // sub-view within More (projects/ideas/etc)
  const [capture,setCapture]=useState(false);
  const [editor,setEditor]=useState(null);     // {kind, entity}
  const [toastObj,setToastObj]=useState(null);   // { msg, label?, fn? }
  const [typeFilter,setTypeFilter]=useState("all");
  const [locFilter,setLocFilter]=useState("all");
  const toastRef = useRef();
  const toast = useCallback((m)=>{ setToastObj({msg:m}); clearTimeout(toastRef.current); toastRef.current=setTimeout(()=>setToastObj(null),2200); },[]);
  const toastUndo = useCallback((m, fn)=>{ setToastObj({msg:m, label:"Undo", fn}); clearTimeout(toastRef.current); toastRef.current=setTimeout(()=>setToastObj(null),6000); },[]);
  // Swipe-delete routes through here so every deletion offers a few seconds to undo.
  const deleteWithUndo = useCallback((file, item)=>{
    store.remove(file, item.id);
    toastUndo("Deleted "+(item.title||item.name||"item"), ()=>store.restore(file, item));
  },[store, toastUndo]);

  const openEditor = useCallback((kind, entity)=>{ setEditor({kind, entity}); log("NAV","editor "+kind); },[]);
  const openTodo = useCallback((t)=>setEditor({kind:"todo", entity:t}),[]);
  const go = useCallback((k)=>{ setSub(k); log("NAV","go "+k); },[]);

  // --- PWA self-update: detect a newer deployed build and offer a one-tap refresh ---
  // Installed PWAs cache the HTML hard; this fetches the deployed file fresh, reads its
  // BUILD stamp, and surfaces a banner when a genuinely newer build is live.
  const [update,setUpdate]=useState(null);   // { ver, build } of a newer deployed build, else null
  const [updMsg,setUpdMsg]=useState("");     // inline status for the Settings "Check for updates" row
  const updTimer = useRef(null);
  // Show a status line for a few seconds then clear it (used for terminal results).
  const flashUpd = useCallback((msg)=>{ setUpdMsg(msg); if(updTimer.current) clearTimeout(updTimer.current); updTimer.current = setTimeout(()=>setUpdMsg(""), 4000); },[]);
  // manual=true is the Settings button: show inline "Checking..." then a result. On
  // launch/resume we check quietly and only surface the banner if there's an update.
  // Detection compares the deployed BUILD (monotonic date stamp) so it never misfires;
  // the deployed APP_VERSION is read alongside it purely to LABEL the update ("v1.5.1").
  const checkUpdate = useCallback(async (manual=false)=>{
    if(manual){ if(updTimer.current) clearTimeout(updTimer.current); setUpdMsg("Checking..."); }
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache:"no-store" });
      if(!res.ok){ log("UPDATE","check http "+res.status); if(manual) flashUpd("Couldn't check - are you online?"); return; }
      const html = await res.text();
      const mb = html.match(/const BUILD = "([^"]+)";/);       const rBuild = mb && mb[1];
      const mv = html.match(/const APP_VERSION = "([^"]+)";/); const rVer = mv && mv[1];
      if(rBuild && buildIsNewer(rBuild, BUILD)){ log("UPDATE","newer build live: "+rBuild+" (v"+(rVer||"?")+")"); setUpdate({ ver:rVer, build:rBuild }); if(manual) setUpdMsg(""); }
      else { log("UPDATE","up to date (v"+APP_VERSION+", "+BUILD+")"); setUpdate(null); if(manual) flashUpd("You're on the latest (v"+APP_VERSION+")"); }
    }catch(e){ log("UPDATE","check failed: "+e.message); if(manual) flashUpd("Update check failed"); }
  },[flashUpd]);
  // Check on launch AND on resume AND on a periodic timer - installed PWAs are usually
  // RESUMED from the background, not cold-launched, so a launch-only check means the
  // banner rarely surfaces on its own. Debounced so a burst of resumes only refetches once.
  useEffect(()=>{
    let last=0; const GAP=60*1000;
    const maybe=()=>{ const now=Date.now(); if(now-last<GAP) return; last=now; checkUpdate(false); };
    const t=setTimeout(maybe, 1200);                       // initial launch check
    const onVis=()=>{ if(document.visibilityState==="visible") maybe(); };
    document.addEventListener("visibilitychange", onVis);
    const iv=setInterval(maybe, 20*60*1000);               // periodic while open
    return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  },[checkUpdate]);
  // Service worker: app-shell offline caching (matches MenuCaptain). Registered with a
  // RELATIVE path so the scope is /tracker-app/ - "/sw.js" would 404 on GitHub Pages.
  // Deliberately no web manifest: without one, Add to Home Screen uses the CURRENT page
  // URL as the launch URL, which is what makes the #dump deep-link icon work.
  useEffect(()=>{
    if(!("serviceWorker" in navigator)) return;
    const onLoad = ()=>{ navigator.serviceWorker.register("sw.js")
      .then(()=>log("SW","registered"))
      .catch(e=>log("SW","register failed: "+(e&&e.message))); };
    if(document.readyState==="complete") onLoad(); else window.addEventListener("load", onLoad);
    return ()=>window.removeEventListener("load", onLoad);
  },[]);

  // --- Home screen badge (installed PWA, iOS 16.4+ / desktop Chrome) ---
  // The count is what the Today TAB LISTS - due today, overdue, starred, deferred-to-today -
  // so tapping the icon lands on exactly those items and the number reconciles.
  // This claim was FALSE from 2026-07-21 to 2026-08-09: routines were todos, so they were
  // counted here but shown in their own card, and two daily routines meant the badge could
  // never reach zero. Habits are no longer todos, so the count is honest again by
  // construction rather than by filtering.
  // Deliberately uses allData, NOT the space-scoped view: the icon is global, so muting a
  // Space in the UI must not hide work from the badge.
  // HONEST LIMIT: iOS gives an installed PWA no background execution, so this can only be
  // recomputed while the app is running. It is right when you leave and goes stale as the
  // day turns. The visibilitychange hook below refreshes it the moment you come back.
  const badgeOn = store.cfg.badge !== false;                     // default ON
  const badgeCount = useMemo(
    ()=> store.authed ? todayItems(store.allData.todos||[]).length : 0,
    [store.allData.todos, store.authed]);
  useEffect(()=>{
    if(!("setAppBadge" in navigator)) return;                    // unsupported browser: no-op
    const paint = ()=>{
      try{
        if(badgeOn && badgeCount>0) navigator.setAppBadge(badgeCount);
        else navigator.clearAppBadge();
      }catch(e){ /* Safari throws when not installed to the Home Screen - harmless */ }
    };
    paint();
    const onVis = ()=>{ if(document.visibilityState==="visible") paint(); };
    document.addEventListener("visibilitychange", onVis);
    return ()=>document.removeEventListener("visibilitychange", onVis);
  },[badgeCount, badgeOn]);

  // Apply by navigating to a build-stamped URL so iOS can't serve the cached HTML.
  // Wipe the SW caches first so the new build can never be masked by a cached shell.
  function applyUpdate(){
    const stamp=(update&&update.build)||String(Date.now());
    log("UPDATE","applying -> "+stamp);
    try{ if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("clearCache"); }catch(_){}
    window.location.replace(location.pathname + "?u=" + encodeURIComponent(stamp));
  }

  // Apply the per-device theme (accent color + app name) live. Because this is
  // device config (not code), one shared app file can look different for each user.
  useEffect(()=>{
    const root = document.documentElement.style;
    const a = isHex6(store.cfg.accent) ? store.cfg.accent : DEFAULT_ACCENT;
    root.setProperty("--amber", a);
    root.setProperty("--amber-2", lighten(a, 0.24));
    root.setProperty("--amber-dim", a+"22");
    root.setProperty("--amber-line", a+"55");
    const th = THEMES[store.cfg.theme] || THEMES[DEFAULT_THEME];
    root.setProperty("--bg", th.bg);   root.setProperty("--bg-2", th.bg2); root.setProperty("--bg-3", th.bg3); root.setProperty("--bg-4", th.bg4);
    root.setProperty("--line", th.line); root.setProperty("--line-2", th.line2);
    root.setProperty("--ink", th.ink); root.setProperty("--ink-2", th.ink2); root.setProperty("--ink-3", th.ink3);
    const name = (store.cfg.appName||"").trim() || "Priority Captain";
    document.title = name;
    const t1 = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(t1) t1.setAttribute("content", name);
    const t2 = document.querySelector('meta[name="theme-color"]'); if(t2) t2.setAttribute("content", th.bg);
  }, [store.cfg.accent, store.cfg.appName, store.cfg.theme]);

  // --- Deep-link capture: a second Home Screen icon pointing at ...#dump boots
  // straight into the AI brain-dump surface. We route on first mount (cold launch)
  // AND on hashchange (iOS re-launching an already-open instance just swaps the hash).
  // Routing to a view that's already showing is a harmless no-op, so this is safe to
  // fire repeatedly. We deliberately do NOT clear the hash, so a manual refresh keeps you here.
  useEffect(()=>{
    function routeHash(){
      if(location.hash === "#dump"){ log("NAV","deep-link #dump -> aichat"); setSub("aichat"); }
    }
    routeHash();
    window.addEventListener("hashchange", routeHash);
    return ()=>window.removeEventListener("hashchange", routeHash);
  },[]); // eslint-disable-line

  if(!store.authReady) return <div className="app"><div className="screen"><p className="hint" style={{textAlign:"center",marginTop:90}}>Loading...</p></div></div>;
  if(store.recovery) return <div><SetPassword store={store} toast={toast}/><Toast obj={toastObj} onClose={()=>setToastObj(null)}/></div>;
  if(!store.authed) return <div><Login store={store} toast={toast}/><Toast obj={toastObj} onClose={()=>setToastObj(null)}/></div>;

  // sub-views launched from More / Today
  let subView = null;
  if(sub==="projects") subView=<ProjectsView store={store} openEditor={openEditor} onOpenTodo={openTodo} typeFilter={typeFilter} setTypeFilter={setTypeFilter} del={deleteWithUndo} toast={toast}/>;
  else if(sub==="ideas") subView=<IdeasView store={store} openEditor={openEditor} typeFilter={typeFilter} setTypeFilter={setTypeFilter} del={deleteWithUndo}/>;
  else if(sub==="goals") subView=<GoalsView store={store} openEditor={openEditor} typeFilter={typeFilter} setTypeFilter={setTypeFilter} del={deleteWithUndo}/>;
  else if(sub==="review") subView=<WeeklyReview store={store} back={()=>setSub(null)} go={go}/>;
  else if(sub==="now") subView=<NowView store={store} onOpen={openTodo} back={()=>setSub(null)}/>;
  else if(sub==="search") subView=<SearchView store={store} openEditor={openEditor} back={()=>setSub(null)}/>;
  else if(sub==="matrix") subView=<MatrixView store={store} onOpen={openTodo} typeFilter={typeFilter} setTypeFilter={setTypeFilter} locFilter={locFilter} setLocFilter={setLocFilter}/>;
  else if(sub==="dashboard") subView=<DashboardView store={store} onOpen={openTodo} openEditor={openEditor} go={go}/>;
  else if(sub==="wins") subView=<WinsView store={store} back={()=>setSub(null)}/>;
  else if(sub==="orders") subView=<OrdersView store={store} toast={toast} back={()=>setSub(null)}/>;
  else if(sub==="calendar") subView=<CalendarView store={store}/>;
  else if(sub==="export") subView=<ExportView store={store} toast={toast} back={()=>setSub(null)}/>;
  else if(sub==="aichat") subView=<AIChat store={store} toast={toast} back={()=>setSub(null)}/>;
  else if(sub==="settings") subView=<SettingsView store={store} toast={toast} toastUndo={toastUndo} go={go} onCheckUpdate={checkUpdate} updMsg={updMsg} update={update} onApplyUpdate={applyUpdate}/>;
  else if(sub==="diagnostics") subView=<Diagnostics back={()=>setSub("settings")}/>;
  else if(sub==="guide") subView=<GuideView back={()=>setSub(null)}/>;
  else if(sub==="rundown") subView=<RundownView store={store} toast={toast} toastUndo={toastUndo}/>;

  let main;
  if(sub && sub!=="more") main=subView;
  else if(tab==="today") main=<TodayView store={store} onOpen={openTodo} goNow={()=>setSub("now")} typeFilter={typeFilter} del={deleteWithUndo} toast={toast} openAI={()=>setSub("aichat")}/>;
  else if(tab==="lists") main=<ListsView store={store} onOpen={openTodo} typeFilter={typeFilter} setTypeFilter={setTypeFilter} locFilter={locFilter} setLocFilter={setLocFilter} del={deleteWithUndo} toast={toast}/>;
  else if(tab==="more") main=<MoreView store={store} go={go}/>;

  function navTo(t){ setTab(t); setSub(null); }
  // Promote Ideas/Goals/Search to nav items: clear the main tab so only the sub lights up.
  function goNav(s){ setTab(""); setSub(s); }
  // Subs that are NOT "owned" by the More tab highlight: Dashboard has its own nav
  // button, and Search is launched from the top bar. Calendar and Projects moved into
  // the More hub (2026-08-01), so they deliberately light the More tab.
  const NAV_SUBS = ["dashboard","search"];
  const moreActive = tab==="more" || (sub && !NAV_SUBS.includes(sub));

  const syncLabel = store.sync==="idle"?"Synced":store.sync==="busy"?(store.syncMsg||"Working"):store.sync==="pending"?"Queued offline":store.syncMsg||"Sync error";

  return (
    <div className="app">
      {update &&
        <button className="update-bar" onClick={applyUpdate}>
          <span>{Ic.sparkle} Update available <b>(v{update.ver||update.build})</b></span>
          <span className="update-go">Refresh</span>
        </button>}
      {/* global top bar - search + a gear that opens Settings (hidden on search/settings) + sync */}
      {sub!=="search" &&
        <div style={{padding:"calc(env(safe-area-inset-top) + 10px) 18px 0"}}>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <button className="search-bar" style={{marginTop:0,flex:1}} onClick={()=>setSub("search")}>{Ic.search}<span>Search everything</span></button>
            {sub!=="settings" &&
              <button className="icon-btn" aria-label="Settings" onClick={()=>setSub("settings")}>{Ic.gear}</button>}
          </div>
          {sub!=="settings" && store.sync!=="idle" && (
            store.sync==="error"
              // A sync error the user can't act on is worse than none. Tap to retry.
              ? <button className={"sync "+store.sync} style={{marginTop:10}} onClick={()=>store.pull()}>
                  <span className="dot"></span>{syncLabel}<span style={{opacity:.75,marginLeft:6}}>Tap to retry</span>
                </button>
              : <div className={"sync "+store.sync} style={{marginTop:10}}><span className="dot"></span>{syncLabel}</div>
          )}
          {sub!=="settings" && <SpaceSwitcher store={store}/>}
        </div>}
      {main}

      {/* bottom nav - 4 items + center capture FAB (portfolio nav standard, 2026-07-24).
          Calendar and Projects live at the top of the More hub, not down here. */}
      <div className="nav">
        <button className={"nav-btn"+(tab==="today"&&!sub?" on":"")} onClick={()=>navTo("today")}><NavIc d={Ic.today}/>Today</button>
        <button className={"nav-btn"+(tab==="lists"&&!sub?" on":"")} onClick={()=>navTo("lists")}><NavIc d={Ic.lists}/>To-Dos</button>
        <button className="nav-btn nav-fab" onClick={()=>setCapture(true)}><span className="fab">{Ic.plus}</span></button>
        <button className={"nav-btn"+(sub==="dashboard"?" on":"")} onClick={()=>goNav("dashboard")}><NavIc d={Ic.dashboard}/>Dashboard</button>
        <button className={"nav-btn"+(moreActive?" on":"")} onClick={()=>navTo("more")}><NavIc d={Ic.more}/>More</button>
      </div>

      {/* capture sheet */}
      {capture && <CaptureSheet store={store} toast={toast} onClose={()=>setCapture(false)} openEditor={openEditor} openAI={()=>{ setCapture(false); setSub("aichat"); }}/>}

      {/* editors */}
      {editor && editor.kind==="todo" && <TodoEditor store={store} todo={editor.entity} toast={toast} onClose={()=>setEditor(null)}/>}
      {editor && editor.kind==="idea" && <IdeaEditor store={store} idea={editor.entity} toast={toast} onClose={()=>setEditor(null)}/>}
      {editor && editor.kind==="project" && <ProjectEditor store={store} project={editor.entity} toast={toast} onClose={()=>setEditor(null)}/>}
      {editor && editor.kind==="goal" && <GoalEditor store={store} goal={editor.entity} toast={toast} onClose={()=>setEditor(null)}/>}
      {editor && editor.kind==="orderCapture" && <OrderCaptureSheet store={store} toast={toast} onClose={()=>setEditor(null)}/>}

      <Toast obj={toastObj} onClose={()=>setToastObj(null)}/>
    </div>
  );
}

/* ============================================================
   MOUNT
   ============================================================ */
(function(){
  try{
    log("INIT","mounting app");
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
    log("INIT","mounted");
  }catch(e){
    log("ERROR","mount failed: "+e.message);
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;color:#f3ead9;font-family:sans-serif"><h2>Startup error</h2><p>'+e.message+'</p></div>';
  }
})();
</script>
</body>
</html>
